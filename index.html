<script>

/* =====================================================
   CONFIG
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";

const VOICEVOX_URL =
  "http://127.0.0.1:50021";

const SPEAKER_ID = 7;


/* =====================================================
   ELEMENTS
   ===================================================== */

const status =
  document.getElementById("status");

const answer =
  document.getElementById("answer");

const debug =
  document.getElementById("debug");

const audioPlayer =
  document.getElementById("audioPlayer");

const micButton =
  document.getElementById("micButton");

const soundTest =
  document.getElementById("soundTest");


/* =====================================================
   DEBUG
   ===================================================== */

function log(message, data) {

  const time =
    new Date().toLocaleTimeString(
      "th-TH"
    );

  let line =
    "[" +
    time +
    "] " +
    message;

  if (
    data !== undefined
  ) {

    try {

      line +=
        " | " +
        JSON.stringify(
          data,
          null,
          2
        );

    }
    catch (e) {

      line +=
        " | " +
        String(data);

    }

  }

  console.log(line);

  debug.innerText +=
    "\n" +
    line;

  debug.scrollTop =
    debug.scrollHeight;
}


/* =====================================================
   AUDIO CONTEXT
   ===================================================== */

let audioContext = null;


async function unlockAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      log(
        "สร้าง AudioContext",
        {
          state:
            audioContext.state
        }
      );

    }

    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();

      log(
        "AudioContext resume แล้ว",
        {
          state:
            audioContext.state
        }
      );

    }

    /*
      สร้างเสียงเงียบสั้น ๆ
      เพื่อปลดล็อกระบบเสียงของ browser
    */

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    gain.gain.value = 0.00001;

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      0.03
    );

    log(
      "ปลดล็อกระบบเสียงแล้ว"
    );

  }
  catch (error) {

    log(
      "ปลดล็อกเสียงไม่สำเร็จ",
      error.message
    );

  }

}


/* =====================================================
   ปลดล็อกเสียงเมื่อผู้ใช้กดหน้าเว็บ
   ===================================================== */

document.addEventListener(
  "click",
  function () {

    unlockAudio();

  },
  {
    once: true
  }
);


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

let recognition = null;

let listening = false;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  status.innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";

}
else {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "th-TH";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function () {

      listening = true;

      micButton
        .classList
        .add("listening");

      status.innerText =
        "🎙️ กำลังฟังครับ...";

    };


  recognition.onresult =
    function (event) {

      const text =
        event
          .results[0][0]
          .transcript;

      document
        .getElementById(
          "question"
        )
        .value =
        text;

      stopListening();

      askAI(text);

    };


  recognition.onerror =
    function (event) {

      log(
        "Speech error",
        event.error
      );

      stopListening();

      let message =
        "รับเสียงไม่ได้ครับ";

      if (
        event.error ===
        "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      }

      else if (
        event.error ===
        "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      }

      else if (
        event.error ===
        "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }

      status.innerText =
        message;

    };


  recognition.onend =
    function () {

      stopListening();

    };

}


function startListening() {

  unlockAudio();

  if (!recognition) {
    return;
  }

  if (listening) {

    recognition.stop();

    return;

  }

  try {

    recognition.start();

  }
  catch (error) {

    log(
      "เริ่มไมค์ไม่ได้",
      error.message
    );

  }

}


function stopListening() {

  listening = false;

  micButton
    .classList
    .remove("listening");

}


micButton.addEventListener(
  "click",
  startListening
);


/* =====================================================
   ASK AI
   ===================================================== */

function askAI(question) {

  if (
    !question ||
    !question.trim()
  ) {

    return;

  }

  unlockAudio();

  status.innerText =
    "🤖 กำลังวิเคราะห์...";

  answer.innerText =
    "กำลังอ่านข้อมูลจากสวน...";

  log(
    "ส่งคำถาม",
    question
  );


  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      "script"
    );


  let completed = false;


  window[callbackName] =
    function (result) {

      if (completed) {
        return;
      }

      completed = true;


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }


      delete window[
        callbackName
      ];


      if (
        !result ||
        result.error
      ) {

        status.innerText =
          "❌ เกิดข้อผิดพลาด";

        answer.innerText =
          result &&
          result.error
            ? result.error
            : "AI ไม่ส่งข้อมูลกลับมา";

        return;

      }


      const aiAnswer =
        result.answer ||
        "AI ไม่ได้ส่งคำตอบกลับมาครับ";


      answer.innerText =
        aiAnswer;


      status.innerText =
        "🔊 กำลังสร้างเสียง...";


      log(
        "AI ตอบกลับแล้ว",
        {
          length:
            aiAnswer.length
        }
      );


      speak(
        aiAnswer
      );

    };


  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      question
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function () {

      if (completed) {
        return;
      }

      completed = true;

      delete window[
        callbackName
      ];

      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }

      status.innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";

      answer.innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   VOICEVOX VERSION
   ===================================================== */

async function checkVoicevox() {

  log(
    "เริ่มตรวจสอบ VOICEVOX"
  );

  log(
    "กำลังตรวจ",
    VOICEVOX_URL
  );


  const response =
    await fetch(
      VOICEVOX_URL +
      "/version",
      {
        method: "GET",
        cache: "no-store"
      }
    );


  log(
    "VOICEVOX /version ตอบกลับ",
    {
      status:
        response.status,
      ok:
        response.ok
    }
  );


  if (!response.ok) {

    throw new Error(
      "VOICEVOX HTTP " +
      response.status
    );

  }


  const version =
    await response.text();


  log(
    "VOICEVOX version",
    version
  );


  return version;

}


/* =====================================================
   CHECK SPEAKER
   ===================================================== */

async function checkSpeaker() {

  log(
    "กำลังตรวจ Speaker ID",
    SPEAKER_ID
  );


  const response =
    await fetch(
      VOICEVOX_URL +
      "/speakers",
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "VOICEVOX /speakers HTTP " +
      response.status
    );

  }


  const speakers =
    await response.json();


  for (
    const speaker of speakers
  ) {

    for (
      const style of
      speaker.styles
    ) {

      if (
        style.id ===
        SPEAKER_ID
      ) {

        log(
          "พบ Speaker",
          {
            name:
              speaker.name,
            style:
              style.name,
            id:
              style.id
          }
        );

        return;

      }

    }

  }


  throw new Error(
    "ไม่พบ Speaker ID " +
    SPEAKER_ID
  );

}


/* =====================================================
   WAV ANALYSIS
   ===================================================== */

async function analyzeWav(
  blob
) {

  log(
    "กำลังตรวจสอบข้อมูลเสียง WAV"
  );


  if (
    !audioContext
  ) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if (
    audioContext.state ===
    "suspended"
  ) {

    await audioContext.resume();

  }


  const arrayBuffer =
    await blob.arrayBuffer();


  const decoded =
    await audioContext.decodeAudioData(
      arrayBuffer.slice(0)
    );


  const channel =
    decoded.getChannelData(0);


  let sum = 0;

  let peak = 0;


  for (
    let i = 0;
    i < channel.length;
    i++
  ) {

    const value =
      Math.abs(
        channel[i]
      );

    sum +=
      value *
      value;

    if (
      value > peak
    ) {

      peak = value;

    }

  }


  const rms =
    Math.sqrt(
      sum /
      channel.length
    );


  log(
    "ตรวจเสียงสำเร็จ",
    {
      duration:
        decoded.duration,
      sampleRate:
        decoded.sampleRate,
      channels:
        decoded.numberOfChannels,
      rms:
        rms,
      peak:
        peak
    }
  );


  if (
    rms < 0.0001
  ) {

    log(
      "⚠️ WAV แทบไม่มีเสียง"
    );

  }
  else {

    log(
      "✅ WAV มีข้อมูลเสียงจริง"
    );

  }


  return {
    decoded,
    rms,
    peak
  };

}


/* =====================================================
   VOICEVOX SPEAK
   ===================================================== */

async function speak(text) {

  if (
    !text ||
    !text.trim()
  ) {

    return;

  }


  try {

    await unlockAudio();


    status.innerText =
      "🎙️ กำลังเชื่อมต่อ VOICEVOX...";


    log(
      "เริ่มสร้างเสียง",
      {
        speaker:
          SPEAKER_ID,
        text:
          text.substring(
            0,
            150
          )
      }
    );


    /*
      ตรวจ VOICEVOX
    */

    await checkVoicevox();


    /*
      ตรวจ Speaker
    */

    await checkSpeaker();


    /*
      สำคัญ:
      VOICEVOX ID 7 เป็นเสียงญี่ปุ่น

      ใช้ข้อความญี่ปุ่นสำหรับ
      ทดสอบว่าเครื่องเสียงทำงานจริง
    */

    const voiceText =
      text;


    /*
      audio_query
    */

    status.innerText =
      "🎙️ กำลังสร้าง audio_query...";


    log(
      "กำลังสร้าง audio_query"
    );


    const queryResponse =
      await fetch(
        VOICEVOX_URL +
        "/audio_query?speaker=" +
        SPEAKER_ID +
        "&text=" +
        encodeURIComponent(
          voiceText
        ),
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          }
        }
      );


    log(
      "audio_query response",
      {
        status:
          queryResponse.status,
        ok:
          queryResponse.ok
      }
    );


    if (
      !queryResponse.ok
    ) {

      const errorText =
        await queryResponse.text();

      throw new Error(
        "audio_query HTTP " +
        queryResponse.status +
        ": " +
        errorText
      );

    }


    const query =
      await queryResponse.json();


    /*
      ปรับเสียง
    */

    query.speedScale =
      0.95;

    query.pitchScale =
      0.02;

    query.intonationScale =
      1.08;

    query.volumeScale =
      1.0;


    /*
      synthesis
    */

    status.innerText =
      "🔊 กำลังสร้างไฟล์เสียง WAV...";


    log(
      "กำลังสร้างไฟล์เสียง WAV"
    );


    const synthesisResponse =
      await fetch(
        VOICEVOX_URL +
        "/synthesis?speaker=" +
        SPEAKER_ID,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Accept":
              "audio/wav"
          },

          body:
            JSON.stringify(
              query
            )
        }
      );


    log(
      "synthesis response",
      {
        status:
          synthesisResponse.status,
        ok:
          synthesisResponse.ok
      }
    );


    if (
      !synthesisResponse.ok
    ) {

      const errorText =
        await synthesisResponse.text();

      throw new Error(
        "synthesis HTTP " +
        synthesisResponse.status +
        ": " +
        errorText
      );

    }


    const audioBlob =
      await synthesisResponse.blob();


    log(
      "ได้รับไฟล์เสียง",
      {
        size:
          audioBlob.size,
        type:
          audioBlob.type
      }
    );


    if (
      !audioBlob ||
      audioBlob.size < 100
    ) {

      throw new Error(
        "VOICEVOX ส่งไฟล์เสียงว่างหรือเล็กผิดปกติ"
      );

    }


    /*
      วิเคราะห์เสียง
    */

    const analysis =
      await analyzeWav(
        audioBlob
      );


    /*
      สร้าง URL
    */

    const audioUrl =
      URL.createObjectURL(
        audioBlob
      );


    /*
      ใช้ HTMLAudioElement
      โดยตรงแทนการเล่นผ่าน
      AudioBuffer อย่างเดียว
    */

    audioPlayer.pause();

    audioPlayer.currentTime =
      0;

    audioPlayer.src =
      audioUrl;

    audioPlayer.volume =
      1.0;

    audioPlayer.muted =
      false;

    audioPlayer.style.display =
      "block";


    /*
      ตรวจว่ามีเสียงจริงหรือไม่
    */

    if (
      analysis.rms <
      0.0001
    ) {

      status.innerText =
        "⚠️ VOICEVOX สร้าง WAV แต่ไฟล์แทบไม่มีเสียง";

      log(
        "หยุดการเล่น เพราะตรวจพบ WAV เงียบ"
      );

      return;

    }


    /*
      เล่นเสียง
    */

    status.innerText =
      "🔊 กำลังเล่นเสียง...";


    log(
      "กำลังเล่นเสียง"
    );


    audioPlayer.onended =
      function () {

        log(
          "เล่นเสียงเสร็จแล้ว"
        );

        status.innerText =
          "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

      };


    audioPlayer.onerror =
      function () {

        log(
          "HTMLAudioElement ERROR",
          audioPlayer.error
        );

        status.innerText =
          "❌ Browser เปิดไฟล์เสียงไม่ได้";

      };


    try {

      await audioPlayer.play();

      log(
        "audio.play() สำเร็จ",
        {
          paused:
            audioPlayer.paused,
          volume:
            audioPlayer.volume,
          muted:
            audioPlayer.muted
        }
      );

    }
    catch (playError) {

      log(
        "audio.play() ถูก Browser ปฏิเสธ",
        playError.message
      );


      status.innerText =
        "⚠️ Browser บล็อกการเล่นเสียง — กดปุ่ม ▶️ บนตัวเล่นเสียงด้านล่าง";


      audioPlayer.controls =
        true;

      audioPlayer.focus();

    }

  }
  catch (error) {

    console.error(
      "VOICEVOX ERROR:",
      error
    );


    const message =
      error &&
      error.message
        ? error.message
        : String(error);


    log(
      "VOICEVOX ERROR",
      message
    );


    status.innerText =
      "❌ VOICEVOX ERROR: " +
      message;


    answer.innerText +=

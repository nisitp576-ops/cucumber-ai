/* =====================================================

let audioContext =
  null;


function unlockAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();


      log(
        "สร้าง AudioContext",
        {
          state:
            audioContext.state
        }
      );

    if (
      audioContext.state ===

}


/* =====================================================
   BROWSER VOICES
   ===================================================== */

let thaiVoice =
  null;

let englishVoice =
  null;


function findThaiVoice(
  voices
) {

  /*
     เรียงลำดับความต้องการ

     1. th-TH
     2. th
     3. ชื่อที่มี Thai
  */


  let voice =
    voices.find(
      function(v) {

        return (
          v.lang &&
          v.lang
            .toLowerCase() ===
            "th-th"
        );

      }
    );


  if (voice) {

    return voice;

  }


  voice =
    voices.find(
      function(v) {

        return (
          v.lang &&
          v.lang
            .toLowerCase()
            .startsWith("th")
        );

      }
    );


  if (voice) {

    return voice;

  }


  voice =
    voices.find(
      function(v) {

        const text =
          (
            v.name +
            " " +
            v.lang
          )
            .toLowerCase();

        return (
          text.includes("thai") ||
          text.includes("ไทย")
        );

      }
    );


  return voice || null;

}


function loadBrowserVoices() {

  if (
    !("speechSynthesis" in window)
  ) {

    log(
      "Browser ไม่รองรับ Speech Synthesis"
    );

    thaiVoice =
      null;

    englishVoice =
      null;

    return;

  }


  const voices =
    window.speechSynthesis
      .getVoices();


  log(
    "ตรวจ Browser Voices",
    voices.length
  );


  thaiVoice =
    findThaiVoice(
      voices
    );


  englishVoice =
    voices.find(
      function(v) {

        return (
          v.lang &&
          v.lang
            .toLowerCase()
            .startsWith("en")
        );

      }
    ) || null;


  log(
    "Thai Voice",
    thaiVoice
      ? {
          name:
            thaiVoice.name,
          lang:
            thaiVoice.lang,
          localService:
            thaiVoice.localService
        }
      : "ไม่พบ"
  );


  log(
    "English Voice",
    englishVoice
      ? {
          name:
            englishVoice.name,
          lang:
            englishVoice.lang,
          localService:
            englishVoice.localService
        }
      : "ไม่พบ"
  );

}


if (
  "speechSynthesis" in window
) {

  loadBrowserVoices();


  window.speechSynthesis
    .onvoiceschanged =
    function() {

      log(
        "Browser voices เปลี่ยนแปลง"
      );

      loadBrowserVoices();

    };

}


/* =====================================================
   DETECT LANGUAGE
   ===================================================== */

function detectLanguage(
  text
) {

  const value =
    String(
      text || ""
    ).trim();


  if (!value) {

    return "unknown";

  }


  const japaneseMatches =
    value.match(
      /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/g
    );


  const thaiMatches =
    value.match(
      /[\u0E00-\u0E7F]/g
    );


  const englishMatches =
    value.match(
      /[A-Za-z]/g
    );


  const japaneseCount =
    japaneseMatches
      ? japaneseMatches.length
      : 0;


  const thaiCount =
    thaiMatches
      ? thaiMatches.length
      : 0;


  const englishCount =
    englishMatches
      ? englishMatches.length
      : 0;


  log(
    "ตรวจภาษา",
    {
      thai:
        thaiCount,
      japanese:
        japaneseCount,
      english:
        englishCount
    }
  );


  if (
    japaneseCount >
      thaiCount &&
    japaneseCount >
      englishCount
  ) {

    return "ja";

  }


  if (
    thaiCount >=
      japaneseCount &&
    thaiCount >=
      englishCount
  ) {

    return "th";

  }


  if (
    englishCount > 0
  ) {

    return "en";

  }


  return "th";

}


/* =====================================================
   BROWSER TTS
   ===================================================== */

function speakBrowser(
  text,
  language
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      if (
        !("speechSynthesis" in window)
      ) {

        reject(
          new Error(
            "Browser ไม่รองรับ Speech Synthesis"
          )
        );

        return;

      }


      if (
        !text ||
        !text.trim()
      ) {

        resolve();

        return;

      }


      window.speechSynthesis.cancel();


      loadBrowserVoices();


      if (
        language === "th" &&
        !thaiVoice
      ) {

        reject(
          new Error(
            "ไม่พบ Thai Voice ใน Browser"
          )
        );

        return;

      }


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      if (
        language === "th"
      ) {

        utterance.lang =
          "th-TH";

        utterance.voice =
          thaiVoice;

        utterance.rate =
          0.95;

        utterance.pitch =
          1.0;

        utterance.volume =
          1.0;


        log(
          "ใช้ Thai Browser Voice",
          {
            name:
              thaiVoice.name,
            lang:
              thaiVoice.lang
          }
        );

      }


      else {

        utterance.lang =
          "en-US";


        if (
          englishVoice
        ) {

          utterance.voice =
            englishVoice;

        }


        utterance.rate =
          0.95;

        utterance.pitch =
          1.0;

        utterance.volume =
          1.0;

      }


      utterance.onstart =
        function() {

          log(
            "Browser TTS เริ่มพูด",
            {
              language:
                language
            }
          );


          statusElement.innerText =
            language === "th"
              ? "🔊 กำลังพูดภาษาไทย..."
              : "🔊 กำลังพูดภาษาอังกฤษ...";

        };


      utterance.onend =
        function() {

          log(
            "Browser TTS พูดเสร็จแล้ว"
          );


          statusElement.innerText =
            "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";


          resolve();

        };


      utterance.onerror =
        function(event) {

          log(
            "Browser TTS ERROR",
            event.error
          );


          reject(
            new Error(
              "Browser TTS: " +
              event.error
            )
          );

        };


      try {

        window.speechSynthesis
          .speak(
            utterance
          );

      }

      catch (error) {

        reject(
          error
        );

      }

    }
  );

}


/* =====================================================
   SPLIT TEXT FOR GOOGLE TTS
   ===================================================== */

function splitText(
  text,
  maxLength = 180
) {

  const clean =
    String(
      text || ""
    )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if (
    clean.length <=
    maxLength
  ) {

    return [
      clean
    ];

  }


  const result =
    [];


  let current =
    "";


  const sentences =
    clean.split(
      /(?<=[.!?。！？])\s+/
    );


  for (
    const sentence
    of sentences
  ) {

    if (
      !sentence
    ) {

      continue;

    }


    if (
      (
        current +
        " " +
        sentence
      ).trim().length <=
      maxLength
    ) {

      current =
        (
          current +
          " " +
          sentence
        ).trim();

    }

    else {

      if (current) {

        result.push(
          current
        );

      }


      /*
         ถ้าประโยคยาวมาก
         ให้ตัดเป็นคำ
      */

      if (
        sentence.length >
        maxLength
      ) {

        let start =
          0;


        while (
          start <
          sentence.length
        ) {

          result.push(
            sentence.substring(
              start,
              start +
                maxLength
            )
          );


          start +=
            maxLength;

        }


        current =
          "";

      }

      else {

        current =
          sentence;

      }

    }

  }


  if (current) {

    result.push(
      current
    );

  }


  return result;

}


/* =====================================================
   GOOGLE THAI TTS
   =====================================================

   จุดสำคัญของเวอร์ชันนี้:

   ❌ ไม่ fetch()
   ❌ ไม่ blob()
   ❌ ไม่ decode WAV

   ✅ ใช้ HTMLAudioElement โดยตรง

   เพราะ log ก่อนหน้านี้พบว่า
   MEDIA_ELEMENT_ERROR: Format error
   ตอนนำ response ไปเล่นผ่าน Blob
*/


function speakGoogleThaiChunk(
  text,
  index,
  total
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      log(
        "สร้าง Google Thai TTS",
        {
          part:
            index +
            "/" +
            total,
          length:
            text.length
        }
      );


      statusElement.innerText =
        "🔊 กำลังสร้างเสียงไทย " +
        index +
        "/" +
        total +
        "...";


      const params =
        new URLSearchParams();


      params.set(
        "ie",
        "UTF-8"
      );


      params.set(
        "client",
        "tw-ob"
      );


      params.set(
        "tl",
        "th"
      );


      params.set(
        "q",
        text
      );


      const url =
        GOOGLE_TTS_URL +
        "?" +
        params.toString();


      log(
        "Google TTS URL พร้อม"
      );


      const audio =
        new Audio();


      audio.preload =
        "auto";


      audio.volume =
        1.0;


      let finished =
        false;


      function cleanup() {

        audio.onended =
          null;

        audio.onerror =
          null;

        audio.oncanplay =
          null;

        audio.onloadeddata =
          null;

      }


      function fail(
        message
      ) {

        if (finished) {

          return;

        }


        finished =
          true;


        cleanup();


        log(
          "Google Thai TTS ERROR",
          {
            part:
              index +
              "/" +
              total,
            error:
              message
          }
        );


        reject(
          new Error(
            message
          )
        );

      }


      audio.oncanplay =
        function() {

          log(
            "Google TTS โหลดเสียงสำเร็จ",
            {
              part:
                index +
                "/" +
                total
            }
          );

        };


      audio.onloadeddata =
        function() {

          log(
            "Google TTS ได้ข้อมูลเสียง",
            {
              part:
                index +
                "/" +
                total,
              duration:
                audio.duration
            }
          );

        };


      audio.onended =
        function() {

          if (finished) {

            return;

          }


          finished =
            true;


          cleanup();


          log(
            "Google TTS เล่นเสร็จ",
            {
              part:
                index +
                "/" +
                total
            }
          );


          resolve();

        };


      audio.onerror =
        function() {

          let message =
            "HTML Audio error";


          if (
            audio.error
          ) {

            message +=
              " | code=" +
              audio.error.code;


            if (
              audio.error.message
            ) {

              message +=
                " | " +
                audio.error.message;

            }

          }


          fail(
            message
          );

        };


      /*
         ตั้ง src โดยตรง

         ไม่ใช้ fetch()
      */

      audio.src =
        url;


      log(
        "กำลังโหลด Google Thai TTS"
      );


      audio.load();


      /*
         ให้ Browser เริ่มเล่น
      */

      audio.play()
        .then(
          function() {

            log(
              "Google TTS เริ่มเล่น",
              {
                part:
                  index +
                  "/" +
                  total
              }
            );


            statusElement.innerText =
              "🔊 กำลังพูดภาษาไทย " +
              index +
              "/" +
              total +
              "...";

          }
        )
        .catch(
          function(error) {

            fail(
              "audio.play() ไม่สำเร็จ: " +
              error.message
            );

          }
        );

    }
  );

}


/* =====================================================
   GOOGLE THAI TTS
   ===================================================== */

async function speakGoogleThai(
  text
) {

  const chunks =
    splitText(
      text,
      180
    );


  if (
    !chunks.length
  ) {

    return;

  }


  log(
    "เริ่ม Google Thai TTS",
    {
      chunks:
        chunks.length
    }
  );


  for (
    let i = 0;
    i < chunks.length;
    i++
  ) {

    await speakGoogleThaiChunk(
      chunks[i],
      i + 1,
      chunks.length
    );

  }


  statusElement.innerText =
    "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";


  log(
    "Google Thai TTS พูดเสร็จแล้ว"
  );

}


/* =====================================================
   VOICEVOX
   ===================================================== */

async function speakVoicevox(
  text
) {

  statusElement.innerText =
    "🎙️ กำลังสร้างเสียง VOICEVOX...";


  log(
    "เริ่มสร้างเสียง VOICEVOX",
    {
      speaker:
        VOICEVOX_SPEAKER_ID,
      text:
        text
    }
  );


  /*
     ตรวจ Engine
  */

  const versionResponse =
    await fetch(
      VOICEVOX_URL +
      "/version",
      {
        method:
          "GET"
      }
    );


  log(
    "VOICEVOX /version",
    {
      status:
        versionResponse.status,
      ok:
        versionResponse.ok
    }
  );


  if (
    !versionResponse.ok
  ) {

    throw new Error(
      "VOICEVOX /version HTTP " +
      versionResponse.status
    );

  }


  const version =
    await versionResponse.text();


  log(
    "VOICEVOX version",
    version
  );


  /*
     ตรวจ Speaker
  */

  const speakersResponse =
    await fetch(
      VOICEVOX_URL +
      "/speakers"
    );


  if (
    !speakersResponse.ok
  ) {

    throw new Error(
      "VOICEVOX /speakers HTTP " +
      speakersResponse.status
    );

  }


  const speakers =
    await speakersResponse.json();


  let speakerFound =
    null;


  for (
    const speaker
    of speakers
  ) {

    if (
      !speaker.styles
    ) {

      continue;

    }


    for (
      const style
      of speaker.styles
    ) {

      if (
        style.id ===
        VOICEVOX_SPEAKER_ID
      ) {

        speakerFound = {

          name:
            speaker.name,

          style:
            style.name,

          id:
            style.id

        };

      }

    }

  }


  if (
    !speakerFound
  ) {

    throw new Error(
      "ไม่พบ VOICEVOX Speaker ID " +
      VOICEVOX_SPEAKER_ID
    );

  }


  log(
    "พบ Speaker",
    speakerFound
  );


  /*
     audio_query
  */

  log(
    "กำลังสร้าง audio_query"
  );


  const queryResponse =
    await fetch(
      VOICEVOX_URL +
      "/audio_query?speaker=" +
      VOICEVOX_SPEAKER_ID +
      "&text=" +
      encodeURIComponent(
        text
      ),
      {
        method:
          "POST"
      }
    );


  log(
    "audio_query response",
    {
      status:
        queryResponse.status,
      ok:
        queryResponse.ok
    }
  );


  if (
    !queryResponse.ok
  ) {

    const errorText =
      await queryResponse.text();


    throw new Error(
      "VOICEVOX audio_query HTTP " +
      queryResponse.status +
      ": " +
      errorText
    );

  }


  const query =
    await queryResponse.json();


  /*
     ปรับเสียง
  */

  query.speedScale =
    1.0;

  query.pitchScale =
    0.02;

  query.intonationScale =
    1.08;

  query.volumeScale =
    1.0;


  /*
     synthesis
  */

  log(
    "กำลังสร้างไฟล์เสียง WAV"
  );


  const synthesisResponse =
    await fetch(
      VOICEVOX_URL +
      "/synthesis?speaker=" +
      VOICEVOX_SPEAKER_ID,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json",

          "Accept":
            "audio/wav"

        },

        body:
          JSON.stringify(
            query
          )

      }
    );


  log(
    "synthesis response",
    {
      status:
        synthesisResponse.status,
      ok:
        synthesisResponse.ok
    }
  );


  if (
    !synthesisResponse.ok
  ) {

    const errorText =
      await synthesisResponse.text();


    throw new Error(
      "VOICEVOX synthesis HTTP " +
      synthesisResponse.status +
      ": " +
      errorText
    );

  }


  const audioBlob =
    await synthesisResponse.blob();


  log(
    "ได้รับไฟล์เสียง VOICEVOX",
    {
      size:
        audioBlob.size,
      type:
        audioBlob.type
    }
  );


  if (
    !audioBlob ||
    audioBlob.size === 0
  ) {

    throw new Error(
      "VOICEVOX ส่งไฟล์เสียงว่าง"
    );

  }


  /*
     เล่นเสียง VOICEVOX
  */

  const audioUrl =
    URL.createObjectURL(
      audioBlob
    );


  const audio =
    new Audio(
      audioUrl
    );


  audio.volume =
    1.0;


  return new Promise(
    function(
      resolve,
      reject
    ) {

      audio.onplay =
        function() {

          log(
            "VOICEVOX เริ่มเล่นเสียง"
          );


          statusElement.innerText =
            "🔊 ずんだもん กำลังพูด...";

        };


      audio.onended =
        function() {

          log(
            "VOICEVOX พูดเสร็จแล้ว"
          );


          URL.revokeObjectURL(
            audioUrl
          );


          statusElement.innerText =
            "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";


          resolve();

        };


      audio.onerror =
        function() {

          URL.revokeObjectURL(
            audioUrl
          );


          log(
            "VOICEVOX audio ERROR"
          );


          reject(
            new Error(
              "เปิดไฟล์เสียง VOICEVOX ไม่ได้"
            )
          );

        };


      audio.play()
        .then(
          function() {

            log(
              "VOICEVOX audio.play() สำเร็จ",
              {
                paused:
                  audio.paused,
                volume:
                  audio.volume,
                muted:
                  audio.muted
              }
            );

          }
        )
        .catch(
          function(error) {

            URL.revokeObjectURL(
              audioUrl
            );


            log(
              "VOICEVOX audio.play() ERROR",
              error.message
            );


            reject(
              error
            );

          }
        );

    }
  );

}


/* =====================================================
   MAIN SPEAK
   ===================================================== */

async function speak(
  text
) {

  if (
    !text ||
    !text.trim()
  ) {

    return;

  }


  unlockAudio();


  const language =
    detectLanguage(
      text
    );


  log(
    "เลือกระบบเสียง",
    {
      language:
        language
    }
  );


  try {

    /*
       🇹🇭 THAI
    */

    if (
      language === "th"
    ) {

      loadBrowserVoices();


      /*
         ถ้ามี Thai Voice จริง
         ใช้ Browser ก่อน
      */

      if (
        thaiVoice
      ) {

        log(
          "พบ Thai Voice → ใช้ Browser TTS"
        );


        await speakBrowser(
          text,
          "th"
        );


        return;

      }


      /*
         ไม่มี Thai Voice

         → Google Thai TTS
      */

      log(
        "ไม่พบ Thai Voice → ใช้ Google Thai TTS"
      );


      try {

        await speakGoogleThai(
          text
        );


        return;

      }

      catch (
        googleError
      ) {

        log(
          "Google Thai TTS ERROR",
          googleError.message
        );


        throw new Error(
          "❌ ไม่สามารถพูดภาษาไทยได้\n\n" +
          "ไม่พบ Thai Voice ใน Browser และ Google Thai TTS ก็เล่นเสียงไม่ได้\n\n" +
          "สาเหตุล่าสุด:\n" +
          googleError.message
        );

      }

    }


    /*
       🇯🇵 JAPANESE
    */

    if (
      language === "ja"
    ) {

      log(
        "ภาษาญี่ปุ่น → VOICEVOX ID 7"
      );


      await speakVoicevox(
        text
      );


      return;

    }


    /*
       🇺🇸 ENGLISH
    */

    if (
      language === "en"
    ) {

      log(
        "ภาษาอังกฤษ → Browser TTS"
      );


      await speakBrowser(
        text,
        "en"
      );


      return;

    }


    /*
       UNKNOWN
    */

    log(
      "ไม่ทราบภาษา → ใช้ Browser Thai"
    );


    await speakBrowser(
      text,
      "th"
    );

  }

  catch (error) {

    log(
      "ระบบเสียง ERROR",
      {
        message:
          error.message
      }
    );


    statusElement.innerText =
      "❌ ระบบเสียงมีปัญหา";


    answerElement.innerText =
      answerElement.innerText +
      "\n\n[VOICE ERROR]\n" +
      error.message;

  }

}


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

let recognition =
  null;

let listening =
  false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (
  !SpeechRecognition
) {

  statusElement.innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";


  log(
    "ไม่พบ SpeechRecognition"
  );

}

else {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "th-TH";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      listening =
        true;


      micButton
        .classList
        .add(
          "listening"
        );


      statusElement.innerText =
        "🎙️ กำลังฟังครับ...";


      log(
        "เริ่มรับเสียง"
      );

    };


  recognition.onresult =
    function(event) {

      const text =
        event
          .results[0][0]
          .transcript;


      questionElement.value =
        text;


      log(
        "รับคำถามจากไมค์",
        text
      );


      stopListening();


      askAI(
        text
      );

    };


  recognition.onerror =
    function(event) {

      log(
        "Speech Recognition ERROR",
        event.error
      );


      stopListening();


      let message =
        "รับเสียงไม่ได้ครับ";


      if (
        event.error ===
        "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      }

      else if (
        event.error ===
        "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      }

      else if (
        event.error ===
        "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }


      statusElement.innerText =
        message;

    };


  recognition.onend =
    function() {

      stopListening();

    };

}


function startListening() {

  unlockAudio();


  if (!recognition) {

    return;

  }


  if (
    listening
  ) {

    recognition.stop();

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    log(
      "เริ่มไมค์ ERROR",
      error.message
    );

  }

}


function stopListening() {

  listening =
    false;


  micButton
    .classList
    .remove(
      "listening"
    );

}


micButton
  .addEventListener(
    "click",
    function() {

      unlockAudio();

      startListening();

    }
  );


/* =====================================================
   GEMINI / APPS SCRIPT
   JSONP
   ===================================================== */

function askAI(
  question
) {

  if (
    !question ||
    !question.trim()
  ) {

    return;

  }


  unlockAudio();


  const cleanQuestion =
    question.trim();


  log(
    "ส่งคำถาม",
    cleanQuestion
  );


  statusElement.innerText =
    "🤖 กำลังวิเคราะห์...";


  answerElement.innerText =
    "กำลังอ่านข้อมูลจากสวน...";


  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      "script"
    );


  let completed =
    false;


  window[callbackName] =
    function(result) {

      if (
        completed
      ) {

        return;

      }


      completed =
        true;


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }


      delete window[
        callbackName
      ];


      if (
        !result
      ) {

        statusElement.innerText =
          "❌ AI ไม่ส่งข้อมูลกลับมา";


        answerElement.innerText =
          "ไม่ได้รับคำตอบจาก AI";


        return;

      }


      if (
        result.error
      ) {

        log(
          "AI ERROR",
          result.error
        );


        statusElement.innerText =
          "❌ เกิดข้อผิดพลาด";


        answerElement.innerText =
          result.error;


        return;

      }


      const answer =
        result.answer ||
        "AI ไม่ได้ส่งคำตอบกลับมาครับ";


      log(
        "AI ตอบกลับแล้ว",
        {
          length:
            answer.length
        }
      );


      answerElement.innerText =
        answer;


      /*
         สำคัญมาก

         ต้องพูดหลังจาก AI ตอบแล้ว
      */

      unlockAudio();


      speak(
        answer
      );

    };


  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      cleanQuestion
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      if (
        completed
      ) {

        return;

      }


      completed =
        true;


      delete window[
        callbackName
      ];


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }


      log(
        "เชื่อมต่อ Apps Script ERROR"
      );


      statusElement.innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";


      answerElement.innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";

    };


  document.body
    .appendChild(
      script
    );

}

<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cucumber AI</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #1b2630 0%,
          #0f1115 45%,
          #090a0c 100%
        );

      color: white;

      font-family:
        Arial,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;
    }


    .app {

      width: 100%;

      max-width: 600px;

      padding: 30px 20px 40px;

      text-align: center;
    }


    .robot {

      font-size: 70px;

      margin-bottom: 5px;
    }


    h1 {

      margin: 0;

      font-size: 30px;

      font-weight: 600;
    }


    #status {

      margin:
        18px
        0
        30px;

      color: #aaa;

      min-height: 25px;
    }


    #micButton {

      width: 180px;

      height: 180px;

      border-radius: 50%;

      border: none;

      background: #20252b;

      color: white;

      font-size: 70px;

      cursor: pointer;

      transition: 0.2s;

      box-shadow:
        0 0 35px
        rgba(
          255,
          255,
          255,
          0.12
        );
    }


    #micButton:active {

      transform:
        scale(0.94);
    }


    #micButton.listening {

      background:
        #b71c1c;

      box-shadow:
        0 0 60px
        rgba(
          244,
          67,
          54,
          0.65
        );

      animation:
        pulse
        1.1s
        infinite;
    }


    @keyframes pulse {

      0% {
        transform:
          scale(1);
      }

      50% {
        transform:
          scale(1.06);
      }

      100% {
        transform:
          scale(1);
      }

    }


    #question {

      width: 100%;

      margin-top: 30px;

      padding: 15px;

      border-radius: 12px;

      border:
        1px solid
        #333;

      background:
        #191c20;

      color: white;

      font-size: 18px;

      outline: none;
    }


    #question::placeholder {

      color: #777;
    }


    #answer {

      margin-top: 25px;

      padding: 20px;

      border-radius: 15px;

      background:
        rgba(
          255,
          255,
          255,
          0.06
        );

      text-align: left;

      line-height: 1.7;

      font-size: 18px;

      min-height: 100px;

      white-space: pre-wrap;
    }


    .hint {

      margin-top: 20px;

      color: #666;

      font-size: 14px;
    }

  </style>

</head>


<body>


<div class="app">


  <div class="robot">
    🤖
  </div>


  <h1>
    Cucumber AI
  </h1>


  <div id="status">

    พร้อมครับ
    กดไมค์แล้วพูดได้เลย

  </div>


  <button
    id="micButton"
    type="button"
  >

    🎙️

  </button>


  <input
    id="question"
    type="text"
    placeholder="หรือพิมพ์คำถาม..."
    autocomplete="off"
  >


  <div id="answer">

    รอคำถามจากคุณ...

  </div>


  <div class="hint">

    กดไมค์ →
    พูด →
    AI วิเคราะห์ →
    AI พูดตอบ

  </div>


</div>



<script>


/* =====================================================
   URL ของ Google Apps Script
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";



/* =====================================================
   Speech Recognition
   ===================================================== */

let recognition =
  null;

let listening =
  false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;



if (!SpeechRecognition) {

  document.getElementById(
    "status"
  ).innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";


} else {


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "th-TH";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;



  recognition.onstart =
    function () {


      listening =
        true;


      document
        .getElementById(
          "micButton"
        )
        .classList
        .add(
          "listening"
        );


      document
        .getElementById(
          "status"
        )
        .innerText =
        "🎙️ กำลังฟังครับ...";

    };



  recognition.onresult =
    function (event) {


      const text =
        event
          .results[0][0]
          .transcript;


      document
        .getElementById(
          "question"
        )
        .value =
        text;


      stopListening();


      askAI(text);

    };



  recognition.onerror =
    function (event) {


      console.log(
        "Speech error:",
        event.error
      );


      stopListening();


      let message =
        "รับเสียงไม่ได้ครับ";


      if (
        event.error ===
        "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      }

      else if (
        event.error ===
        "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      }

      else if (
        event.error ===
        "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }


      document
        .getElementById(
          "status"
        )
        .innerText =
        message;

    };



  recognition.onend =
    function () {

      stopListening();

    };

}



function startListening() {


  if (!recognition) {

    return;

  }


  if (listening) {

    recognition.stop();

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    console.log(error);

  }

}



function stopListening() {


  listening =
    false;


  document
    .getElementById(
      "micButton"
    )
    .classList
    .remove(
      "listening"
    );

}



document
  .getElementById(
    "micButton"
  )
  .addEventListener(
    "click",
    startListening
  );



/* =====================================================
   ส่งคำถามไป Apps Script
   ใช้ JSONP
   ===================================================== */

function askAI(question) {


  if (
    !question ||
    !question.trim()
  ) {

    return;

  }


  document
    .getElementById(
      "status"
    )
    .innerText =
    "🤖 กำลังวิเคราะห์...";


  document
    .getElementById(
      "answer"
    )
    .innerText =
    "กำลังอ่านข้อมูลจากสวน...";



  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );



  let script =
    document.createElement(
      "script"
    );



  let completed =
    false;



  window[callbackName] =
    function (result) {


      if (completed) {

        return;

      }


      completed =
        true;



      if (
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }



      delete window[
        callbackName
      ];



      if (
        result.error
      ) {


        document
          .getElementById(
            "status"
          )
          .innerText =
          "❌ เกิดข้อผิดพลาด";


        document
          .getElementById(
            "answer"
          )
          .innerText =
          result.error;


        return;

      }



      const answer =
        result.answer ||
        "AI ไม่ได้ส่งคำตอบกลับมาครับ";


      document
        .getElementById(
          "answer"
        )
        .innerText =
        answer;


      document
        .getElementById(
          "status"
        )
        .innerText =
        "🔊 กำลังพูดตอบ...";


      speak(こんにちは、ずんだもんです。今日のキュウリの様子を確認するのだ。);

    };



  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      question
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );



  script.src =
    url;



  script.onerror =
    function () {


      if (completed) {

        return;

      }


      completed =
        true;


      delete window[
        callbackName
      ];



      if (
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }



      document
        .getElementById(
          "status"
        )
        .innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";


      document
        .getElementById(
          "answer"
        )
        .innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";

    };



  document
    .body
    .appendChild(
      script
    );

}



/* =====================================================
   Text → Speech
   ===================================================== */

# speak() สำหรับทดสอบ VOICEVOX ID 7

async function speak(text) {

if (!text || !text.trim()) {
return;
}

const status =
document.getElementById("status");

status.innerText =
"🎙️ กำลังเชื่อมต่อ VOICEVOX...";

const VOICEVOX_URL =
"http://127.0.0.1:50021";

const SPEAKER_ID = 7;
try {

```
console.log(
  "VOICEVOX เริ่มสร้างเสียง",
  {
    url: VOICEVOX_URL,
    speaker: SPEAKER_ID,
    text: text
  }
);

// 1. ตรวจว่า VOICEVOX Engine เปิดอยู่หรือไม่
const versionResponse =
  await fetch(
    VOICEVOX_URL + "/version",
    {
      method: "GET"
    }
  );

if (!versionResponse.ok) {

  throw new Error(
    "VOICEVOX /version HTTP " +
    versionResponse.status
  );
}

const version =
  await versionResponse.text();

console.log(
  "VOICEVOX version:",
  version
);

status.innerText =
  "🎙️ VOICEVOX " +
  version +
  " เชื่อมต่อแล้ว กำลังสร้างเสียง...";


// 2. สร้าง audio_query
const queryResponse =
  await fetch(
    VOICEVOX_URL +
    "/audio_query?speaker=" +
    SPEAKER_ID +
    "&text=" +
    encodeURIComponent(text),
    {
      method: "POST"
    }
  );

if (!queryResponse.ok) {

  const errorText =
    await queryResponse.text();

  throw new Error(
    "VOICEVOX audio_query HTTP " +
    queryResponse.status +
    ": " +
    errorText
  );
}

const query =
  await queryResponse.json();


// 3. ปรับบุคลิกเสียง ずんだもん ID 7
query.speedScale = 1.0;

query.pitchScale = 0.02;

query.intonationScale = 1.08;

query.volumeScale = 1.0;


// 4. สร้างไฟล์ WAV
const synthesisResponse =
  await fetch(
    VOICEVOX_URL +
    "/synthesis?speaker=" +
    SPEAKER_ID,
    {
      method: "POST",

      headers: {
        "Content-Type":
          "application/json",

        "Accept":
          "audio/wav"
      },

      body:
        JSON.stringify(query)
    }
  );

if (!synthesisResponse.ok) {

  const errorText =
    await synthesisResponse.text();

  throw new Error(
    "VOICEVOX synthesis HTTP " +
    synthesisResponse.status +
    ": " +
    errorText
  );
}


// 5. รับ WAV
const audioBlob =
  await synthesisResponse.blob();

if (
  !audioBlob ||
  audioBlob.size === 0
) {

  throw new Error(
    "VOICEVOX ส่งไฟล์เสียงว่างกลับมา"
  );
}


// 6. เล่นเสียง
const audioUrl =
  URL.createObjectURL(
    audioBlob
  );

const audio =
  new Audio(audioUrl);

audio.volume = 1.0;

status.innerText =
  "🔊 ずんだもん กำลังพูด...";


audio.onended =
  function () {

    URL.revokeObjectURL(
      audioUrl
    );

    status.innerText =
      "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";
  };


audio.onerror =
  function () {

    URL.revokeObjectURL(
      audioUrl
    );

    status.innerText =
      "❌ สร้างเสียงสำเร็จ แต่เปิดไฟล์เสียงไม่ได้";

    console.error(
      "VOICEVOX audio playback error"
    );
  };


await audio.play();
```

} catch (error) {

```
console.error(
  "VOICEVOX ERROR:",
  error
);

const message =
  error &&
  error.message
    ? error.message
    : String(error);


// แสดงสาเหตุจริงบนหน้าเว็บ
status.innerText =
  "❌ VOICEVOX ERROR: " +
  message;


// แสดงใน answer ด้วย
const answer =
  document.getElementById(
    "answer"
  );

if (answer) {

  answer.innerText =
    answer.innerText +
    "\n\n[VOICEVOX ERROR]\n" +
    message;
}
```

}
}



/* =====================================================
   Enter เพื่อส่งคำถาม
   ===================================================== */

document
  .getElementById(
    "question"
  )
  .addEventListener(
    "keydown",
    function (event) {


      if (
        event.key ===
        "Enter"
      ) {


        askAI(
          this.value
        );


      }

    }
  );



</script>


</body>

</html>

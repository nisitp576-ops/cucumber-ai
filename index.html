<!DOCTYPE html>

<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cucumber AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #1b2630 0%, #0f1115 45%, #090a0c 100%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 100%;
  max-width: 650px;
  padding: 30px 20px 40px;
  text-align: center;
}

.robot {
  font-size: 70px;
  margin-bottom: 5px;
}

h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 600;
}

#status {
  margin: 18px 0 25px;
  color: #aaa;
  min-height: 25px;
}

#micButton {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: none;
  background: #20252b;
  color: white;
  font-size: 70px;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 0 35px rgba(255,255,255,0.12);
}

#micButton:active {
  transform: scale(0.94);
}

#micButton.listening {
  background: #b71c1c;
  box-shadow: 0 0 60px rgba(244,67,54,0.65);
  animation: pulse 1.1s infinite;
}

@keyframes pulse {
  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.06);
  }

  100% {
    transform: scale(1);
  }
}

#question {
  width: 100%;
  margin-top: 30px;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #191c20;
  color: white;
  font-size: 18px;
  outline: none;
}

#question::placeholder {
  color: #777;
}

#answer {
  margin-top: 25px;
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.06);
  text-align: left;
  line-height: 1.7;
  font-size: 18px;
  min-height: 100px;
  white-space: pre-wrap;
}

.hint {
  margin-top: 20px;
  color: #666;
  font-size: 14px;
}

#debug {
  margin-top: 25px;
  padding: 15px;
  border-radius: 12px;
  background: rgba(0,0,0,0.45);
  color: #888;
  text-align: left;
  font-family: Consolas, monospace;
  font-size: 12px;
  line-height: 1.5;
  max-height: 250px;
  overflow-y: auto;
  white-space: pre-wrap;
}
</style>

</head>

<body>

<div class="app">

  <div class="robot">🤖</div>

  <h1>Cucumber AI</h1>

  <div id="status">
    ระบบพร้อมทำงาน
  </div>

<button id="micButton" type="button">🎙️</button>

<input
id="question"
type="text"
placeholder="หรือพิมพ์คำถาม..."
autocomplete="off"

>

  <div id="answer">
    รอคำถามจากคุณ...
  </div>

  <div class="hint">
    กดไมค์ → พูด → Gemini วิเคราะห์ → AI พูดตอบ
  </div>

  <div id="debug"></div>

</div>

<script>

/* =====================================================
   CONFIG
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";


const VOICEVOX_URL =
  "http://127.0.0.1:50021";


const VOICEVOX_SPEAKER_ID =
  7;


/*
   Google Translate TTS
   ใช้เฉพาะภาษาไทย
*/

const GOOGLE_TTS_URL =
  "https://translate.google.com/translate_tts";


/* =====================================================
   ELEMENTS
   ===================================================== */

const statusElement =
  document.getElementById("status");

const answerElement =
  document.getElementById("answer");

const questionElement =
  document.getElementById("question");

const micButton =
  document.getElementById("micButton");

const debugElement =
  document.getElementById("debug");


/* =====================================================
   DEBUG
   ===================================================== */

function log(message, data) {

  const time =
    new Date().toLocaleTimeString(
      "th-TH",
      {
        hour12: false
      }
    );

  let line =
    "[" +
    time +
    "] " +
    message;

  if (data !== undefined) {

    try {

      line +=
        " | " +
        JSON.stringify(
          data,
          null,
          2
        );

    } catch (error) {

      line +=
        " | " +
        String(data);

    }

  }

  console.log(line);

  debugElement.textContent +=
    line +
    "\n";

  debugElement.scrollTop =
    debugElement.scrollHeight;
}


/* =====================================================
   AUDIO CONTEXT
   ===================================================== */

let audioContext = null;


function unlockAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      log(
        "สร้าง AudioContext",
        {
          state:
            audioContext.state
        }
      );

    }

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

    log("ปลดล็อกระบบเสียงแล้ว");

  } catch (error) {

    log(
      "ปลดล็อกเสียง ERROR",
      error.message
    );

  }
}


/* =====================================================
   BROWSER ENGLISH TTS
   ===================================================== */

let englishVoice = null;


function loadEnglishVoice() {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }

  const voices =
    window.speechSynthesis.getVoices();

  log(
    "ตรวจ Browser Voices",
    voices.length
  );

  englishVoice =
    voices.find(
      function(voice) {

        return (
          voice.lang &&
          voice.lang
            .toLowerCase()
            .startsWith("en")
        );

      }
    ) || null;

  log(
    "English Voice",
    englishVoice
      ? {
          name:
            englishVoice.name,
          lang:
            englishVoice.lang
        }
      : "ไม่พบ"
  );
}


if (
  "speechSynthesis" in window
) {

  loadEnglishVoice();

  window.speechSynthesis.onvoiceschanged =
    function() {

      log(
        "Browser voices เปลี่ยนแปลง"
      );

      loadEnglishVoice();

    };

}


/* =====================================================
   ตรวจภาษา
   ===================================================== */

function detectLanguage(text) {

  const value =
    String(text || "").trim();

  if (!value) {

    return "unknown";

  }

  const japaneseMatches =
    value.match(
      /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/g
    );

  const thaiMatches =
    value.match(
      /[\u0E00-\u0E7F]/g
    );

  const englishMatches =
    value.match(
      /[A-Za-z]/g
    );

  const japaneseCount =
    japaneseMatches
      ? japaneseMatches.length
      : 0;

  const thaiCount =
    thaiMatches
      ? thaiMatches.length
      : 0;

  const englishCount =
    englishMatches
      ? englishMatches.length
      : 0;

  log(
    "ตรวจภาษา",
    {
      thai:
        thaiCount,
      japanese:
        japaneseCount,
      english:
        englishCount
    }
  );

  if (
    japaneseCount >
    thaiCount &&
    japaneseCount >
    englishCount
  ) {

    return "ja";

  }

  if (
    thaiCount >=
    japaneseCount &&
    thaiCount >=
    englishCount
  ) {

    return "th";

  }

  if (
    englishCount > 0
  ) {

    return "en";

  }

  return "th";
}


/* =====================================================
   GOOGLE THAI TTS
   ===================================================== */

/*
   จำกัดข้อความต่อหนึ่งเสียง
   เพื่อป้องกัน URL ยาวเกินไป
*/

function splitThaiText(text) {

  const maxLength = 180;

  const clean =
    String(text || "")
      .replace(/\s+/g, " ")
      .trim();

  if (!clean) {

    return [];

  }

  const sentences =
    clean.split(
      /(?<=[.!?。！？])\s+/
    );

  const chunks = [];

  let current = "";

  for (
    const sentence
    of sentences
  ) {

    if (
      !current
    ) {

      current =
        sentence;

      continue;

    }

    if (
      (
        current.length +
        sentence.length +
        1
      ) <= maxLength
    ) {

      current +=
        " " +
        sentence;

    } else {

      chunks.push(
        current
      );

      current =
        sentence;

    }

  }

  if (current) {

    chunks.push(
      current
    );

  }


  /*
     ถ้าประโยคยาวมาก
     ให้ตัดเป็นช่วงย่อย
  */

  const finalChunks = [];

  for (
    const chunk
    of chunks
  ) {

    if (
      chunk.length <=
      maxLength
    ) {

      finalChunks.push(
        chunk
      );

      continue;

    }

    for (
      let i = 0;
      i < chunk.length;
      i += maxLength
    ) {

      finalChunks.push(
        chunk.substring(
          i,
          i + maxLength
        )
      );

    }

  }

  return finalChunks;
}


function createGoogleThaiAudioUrl(text) {

  return (
    GOOGLE_TTS_URL +
    "?ie=UTF-8" +
    "&client=tw-ob" +
    "&tl=th" +
    "&q=" +
    encodeURIComponent(text)
  );
}


function playAudioElement(audio) {

  return new Promise(
    function(resolve, reject) {

      let finished =
        false;


      function cleanup() {

        audio.onended =
          null;

        audio.onerror =
          null;

      }


      audio.onended =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          resolve();

        };


      audio.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          reject(
            new Error(
              "เปิดไฟล์เสียง Thai TTS ไม่ได้"
            )
          );

        };


      audio.play()
        .then(
          function() {

            log(
              "Thai TTS audio.play() สำเร็จ",
              {
                paused:
                  audio.paused,
                volume:
                  audio.volume
              }
            );

          }
        )
        .catch(
          function(error) {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            reject(error);

          }
        );

    }
  );
}


async function speakThai(text) {

  const chunks =
    splitThaiText(text);


  if (
    chunks.length === 0
  ) {

    throw new Error(
      "ไม่มีข้อความภาษาไทยสำหรับสร้างเสียง"
    );

  }


  log(
    "เริ่ม Thai TTS",
    {
      chunks:
        chunks.length
    }
  );


  statusElement.innerText =
    "🔊 กำลังพูดภาษาไทย...";


  /*
     เล่นทีละช่วง
  */

  for (
    let i = 0;
    i < chunks.length;
    i++
  ) {

    const chunk =
      chunks[i];


    log(
      "สร้างเสียงไทยช่วงที่ " +
      (i + 1) +
      "/" +
      chunks.length,
      chunk
    );


    const url =
      createGoogleThaiAudioUrl(
        chunk
      );


    const audio =
      new Audio(url);


    audio.volume =
      1.0;


    audio.preload =
      "auto";


    log(
      "กำลังเล่น Thai TTS",
      {
        part:
          i + 1,
        total:
          chunks.length
      }
    );


    await playAudioElement(
      audio
    );


    log(
      "Thai TTS ช่วงที่ " +
      (i + 1) +
      " เสร็จแล้ว"
    );

  }


  statusElement.innerText =
    "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";


  log(
    "Thai TTS พูดเสร็จแล้ว"
  );
}


/* =====================================================
   ENGLISH BROWSER TTS
   ===================================================== */

function speakEnglish(text) {

  return new Promise(
    function(resolve, reject) {

      if (
        !("speechSynthesis" in window)
      ) {

        reject(
          new Error(
            "Browser ไม่รองรับ Speech Synthesis"
          )
        );

        return;

      }


      window.speechSynthesis.cancel();

      loadEnglishVoice();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      utterance.lang =
        "en-US";


      if (
        englishVoice
      ) {

        utterance.voice =
          englishVoice;

      }


      utterance.rate =
        0.95;

      utterance.pitch =
        1.0;

      utterance.volume =
        1.0;


      utterance.onstart =
        function() {

          log(
            "English TTS เริ่มพูด"
          );

          statusElement.innerText =
            "🔊 กำลังพูดภาษาอังกฤษ...";

        };


      utterance.onend =
        function() {

          log(
            "English TTS พูดเสร็จแล้ว"
          );

          statusElement.innerText =
            "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

          resolve();

        };


      utterance.onerror =
        function(event) {

          log(
            "English TTS ERROR",
            event.error
          );

          reject(
            new Error(
              "English TTS: " +
              event.error
            )
          );

        };


      window.speechSynthesis.speak(
        utterance
      );

    }
  );
}


/* =====================================================
   VOICEVOX
   ===================================================== */

async function speakVoicevox(text) {

  statusElement.innerText =
    "🎙️ กำลังสร้างเสียง VOICEVOX...";


  log(
    "เริ่มสร้างเสียง VOICEVOX",
    {
      speaker:
        VOICEVOX_SPEAKER_ID,
      text:
        text
    }
  );


  /*
     ตรวจ Engine
  */

  const versionResponse =
    await fetch(
      VOICEVOX_URL +
      "/version",
      {
        method:
          "GET"
      }
    );


  if (
    !versionResponse.ok
  ) {

    throw new Error(
      "VOICEVOX /version HTTP " +
      versionResponse.status
    );

  }


  const version =
    await versionResponse.text();


  log(
    "VOICEVOX version",
    version
  );


  /*
     ตรวจ Speaker
  */

  const speakersResponse =
    await fetch(
      VOICEVOX_URL +
      "/speakers",
      {
        method:
          "GET"
      }
    );


  if (
    !speakersResponse.ok
  ) {

    throw new Error(
      "VOICEVOX /speakers HTTP " +
      speakersResponse.status
    );

  }


  const speakers =
    await speakersResponse.json();


  let speakerFound =
    null;


  for (
    const speaker
    of speakers
  ) {

    if (
      !speaker.styles
    ) {

      continue;

    }


    for (
      const style
      of speaker.styles
    ) {

      if (
        style.id ===
        VOICEVOX_SPEAKER_ID
      ) {

        speakerFound = {

          name:
            speaker.name,

          style:
            style.name,

          id:
            style.id

        };

      }

    }

  }


  if (
    !speakerFound
  ) {

    throw new Error(
      "ไม่พบ VOICEVOX Speaker ID " +
      VOICEVOX_SPEAKER_ID
    );

  }


  log(
    "พบ VOICEVOX Speaker",
    speakerFound
  );


  /*
     audio_query
  */

  const queryResponse =
    await fetch(
      VOICEVOX_URL +
      "/audio_query?speaker=" +
      VOICEVOX_SPEAKER_ID +
      "&text=" +
      encodeURIComponent(text),
      {
        method:
          "POST"
      }
    );


  log(
    "audio_query response",
    {
      status:
        queryResponse.status,
      ok:
        queryResponse.ok
    }
  );


  if (
    !queryResponse.ok
  ) {

    const errorText =
      await queryResponse.text();

    throw new Error(
      "VOICEVOX audio_query HTTP " +
      queryResponse.status +
      ": " +
      errorText
    );

  }


  const query =
    await queryResponse.json();


  query.speedScale =
    1.0;

  query.pitchScale =
    0.02;

  query.intonationScale =
    1.08;

  query.volumeScale =
    1.0;


  /*
     synthesis
  */

  const synthesisResponse =
    await fetch(
      VOICEVOX_URL +
      "/synthesis?speaker=" +
      VOICEVOX_SPEAKER_ID,
      {
        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json",

          "Accept":
            "audio/wav"

        },

        body:
          JSON.stringify(query)

      }
    );


  log(
    "synthesis response",
    {
      status:
        synthesisResponse.status,
      ok:
        synthesisResponse.ok
    }
  );


  if (
    !synthesisResponse.ok
  ) {

    const errorText =
      await synthesisResponse.text();

    throw new Error(
      "VOICEVOX synthesis HTTP " +
      synthesisResponse.status +
      ": " +
      errorText
    );

  }


  const audioBlob =
    await synthesisResponse.blob();


  log(
    "ได้รับ WAV",
    {
      size:
        audioBlob.size,
      type:
        audioBlob.type
    }
  );


  if (
    !audioBlob ||
    audioBlob.size === 0
  ) {

    throw new Error(
      "VOICEVOX ส่งไฟล์เสียงว่าง"
    );

  }


  const audioUrl =
    URL.createObjectURL(
      audioBlob
    );


  const audio =
    new Audio(audioUrl);


  audio.volume =
    1.0;


  return new Promise(
    function(resolve, reject) {

      audio.onplay =
        function() {

          log(
            "VOICEVOX เริ่มเล่นเสียง"
          );

          statusElement.innerText =
            "🔊 ずんだもん กำลังพูด...";

        };


      audio.onended =
        function() {

          log(
            "VOICEVOX พูดเสร็จแล้ว"
          );

          URL.revokeObjectURL(
            audioUrl
          );

          statusElement.innerText =
            "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

          resolve();

        };


      audio.onerror =
        function() {

          URL.revokeObjectURL(
            audioUrl
          );

          reject(
            new Error(
              "เปิดไฟล์เสียง VOICEVOX ไม่ได้"
            )
          );

        };


      audio.play()
        .then(
          function() {

            log(
              "VOICEVOX audio.play() สำเร็จ",
              {
                paused:
                  audio.paused,
                volume:
                  audio.volume
              }
            );

          }
        )
        .catch(
          function(error) {

            URL.revokeObjectURL(
              audioUrl
            );

            reject(error);

          }
        );

    }
  );
}


/* =====================================================
   ระบบเสียงหลัก
   Gemini → ตรวจภาษา → TTS
   ===================================================== */

async function speak(text) {

  if (
    !text ||
    !text.trim()
  ) {

    return;

  }


  unlockAudio();


  const language =
    detectLanguage(text);


  log(
    "เลือกภาษาเสียง",
    {
      language:
        language
    }
  );


  try {

    /*
       ภาษาไทย
       → Google Thai TTS
    */

    if (
      language === "th"
    ) {

      log(
        "ภาษาไทย → Google Thai TTS"
      );

      await speakThai(text);

      return;

    }


    /*
       ภาษาญี่ปุ่น
       → VOICEVOX ID 7
    */

    if (
      language === "ja"
    ) {

      log(
        "ภาษาญี่ปุ่น → VOICEVOX ID 7"
      );

      await speakVoicevox(text);

      return;

    }


    /*
       ภาษาอังกฤษ
       → Browser TTS
    */

    if (
      language === "en"
    ) {

      log(
        "ภาษาอังกฤษ → Browser TTS"
      );

      await speakEnglish(text);

      return;

    }


    /*
       ไม่ทราบภาษา
       → ให้ลอง Thai TTS
    */

    log(
      "ไม่ทราบภาษา → Thai TTS"
    );

    await speakThai(text);

  }

  catch (error) {

    log(
      "ระบบเสียง ERROR",
      {
        message:
          error.message
      }
    );


    statusElement.innerText =
      "❌ ระบบเสียงมีปัญหา";


    answerElement.innerText =
      answerElement.innerText +
      "\n\n[VOICE ERROR]\n" +
      error.message;

  }

}


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

let recognition =
  null;

let listening =
  false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (
  !SpeechRecognition
) {

  statusElement.innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";

  log(
    "ไม่พบ SpeechRecognition"
  );

} else {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "th-TH";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      listening =
        true;

      micButton.classList.add(
        "listening"
      );

      statusElement.innerText =
        "🎙️ กำลังฟังครับ...";

      log(
        "เริ่มรับเสียง"
      );

    };


  recognition.onresult =
    function(event) {

      const text =
        event.results[0][0]
          .transcript;


      questionElement.value =
        text;


      log(
        "รับคำถามจากไมค์",
        text
      );


      stopListening();

      askAI(text);

    };


  recognition.onerror =
    function(event) {

      log(
        "Speech Recognition ERROR",
        event.error
      );


      stopListening();


      let message =
        "รับเสียงไม่ได้ครับ";


      if (
        event.error ===
        "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      }


      else if (
        event.error ===
        "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      }


      else if (
        event.error ===
        "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }


      statusElement.innerText =
        message;

    };


  recognition.onend =
    function() {

      stopListening();

    };

}


function startListening() {

  unlockAudio();


  if (!recognition) {

    return;

  }


  if (listening) {

    recognition.stop();

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    log(
      "เริ่มไมค์ ERROR",
      error.message
    );

  }

}


function stopListening() {

  listening =
    false;

  micButton.classList.remove(
    "listening"
  );

}


micButton.addEventListener(
  "click",
  function() {

    unlockAudio();

    startListening();

  }
);


/* =====================================================
   GEMINI / APPS SCRIPT
   JSONP
   ===================================================== */

function askAI(question) {

  if (
    !question ||
    !question.trim()
  ) {

    return;

  }


  unlockAudio();


  const cleanQuestion =
    question.trim();


  log(
    "ส่งคำถาม",
    cleanQuestion
  );


  statusElement.innerText =
    "🤖 กำลังวิเคราะห์...";


  answerElement.innerText =
    "กำลังอ่านข้อมูลจากสวน...";


  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      "script"
    );


  let completed =
    false;


  window[callbackName] =
    function(result) {

      if (completed) {

        return;

      }


      completed =
        true;


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }


      delete window[
        callbackName
      ];


      if (!result) {

        statusElement.innerText =
          "❌ AI ไม่ส่งข้อมูลกลับมา";

        answerElement.innerText =
          "ไม่ได้รับคำตอบจาก AI";

        return;

      }


      if (result.error) {

        log(
          "AI ERROR",
          result.error
        );


        statusElement.innerText =
          "❌ เกิดข้อผิดพลาด";


        answerElement.innerText =
          result.error;


        return;

      }


      const answer =
        result.answer ||
        "AI ไม่ได้ส่งคำตอบกลับมาครับ";


      log(
        "AI ตอบกลับแล้ว",
        {
          length:
            answer.length
        }
      );


      answerElement.innerText =
        answer;


      /*
         สำคัญมาก
         ต้องเรียกเสียงจาก callback
         หลัง Gemini ตอบกลับ
      */

      unlockAudio();


      speak(answer);

    };


  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      cleanQuestion
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      if (completed) {

        return;

      }


      completed =
        true;


      delete window[
        callbackName
      ];


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }


      log(
        "Apps Script ERROR"
      );


      statusElement.innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";


      answerElement.innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   ENTER = SEND
   ===================================================== */

questionElement.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      unlockAudio();

      askAI(
        this.value
      );

    }

  }
);


/* =====================================================
   CLICK = UNLOCK AUDIO
   ===================================================== */

document.addEventListener(
  "click",
  function() {

    unlockAudio();

  }
);


/* =====================================================
   STARTUP
   ===================================================== */

log(
  "Cucumber AI พร้อมทำงาน"
);


log(
  "โหมดเสียง",
  {
    thai:
      "Google Thai TTS",
    japanese:
      "VOICEVOX ID 7",
    english:
      "Browser English TTS"
  }
);

</script>

<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cucumber AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #1b2630 0%, #0f1115 45%, #090a0c 100%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 100%;
  max-width: 650px;
  padding: 30px 20px 40px;
  text-align: center;
}

.robot {
  font-size: 70px;
  margin-bottom: 5px;
}

h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 600;
}

#status {
  margin: 18px 0 25px;
  color: #aaa;
  min-height: 25px;
}

#micButton {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: none;
  background: #20252b;
  color: white;
  font-size: 70px;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 0 35px rgba(255,255,255,0.12);
}

#micButton:active {
  transform: scale(0.94);
}

#micButton.listening {
  background: #b71c1c;
  box-shadow: 0 0 60px rgba(244,67,54,0.65);
  animation: pulse 1.1s infinite;
}

@keyframes pulse {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.06); }
  100% { transform: scale(1); }
}

#question {
  width: 100%;
  margin-top: 30px;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #191c20;
  color: white;
  font-size: 18px;
  outline: none;
}

#question::placeholder {
  color: #777;
}

#answer {
  margin-top: 25px;
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.06);
  text-align: left;
  line-height: 1.7;
  font-size: 18px;
  min-height: 100px;
  white-space: pre-wrap;
}

.hint {
  margin-top: 20px;
  color: #666;
  font-size: 14px;
}

#debug {
  margin-top: 25px;
  padding: 15px;
  border-radius: 12px;
  background: rgba(0,0,0,0.45);
  color: #888;
  text-align: left;
  font-family: Consolas, monospace;
  font-size: 12px;
  line-height: 1.5;
  max-height: 260px;
  overflow-y: auto;
  white-space: pre-wrap;
}
</style>

</head>

<body>

<div class="app">

  <div class="robot">🤖</div>

  <h1>Cucumber AI</h1>

  <div id="status">
    ระบบพร้อมทำงาน
  </div>

<button id="micButton" type="button">🎙️</button>

<input
id="question"
type="text"
placeholder="หรือพิมพ์คำถาม..."
autocomplete="off"

>

  <div id="answer">
    รอคำถามจากคุณ...
  </div>

  <div class="hint">
    กดไมค์ → พูด → Gemini วิเคราะห์ → AI พูดตอบ
  </div>

  <div id="debug"></div>

</div>

<script>

/* =====================================================
   CONFIG
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";

const VOICEVOX_URL =
  "http://127.0.0.1:50021";

const VOICEVOX_SPEAKER_ID = 7;


/* =====================================================
   ELEMENTS
   ===================================================== */

const statusElement =
  document.getElementById("status");

const answerElement =
  document.getElementById("answer");

const questionElement =
  document.getElementById("question");

const micButton =
  document.getElementById("micButton");

const debugElement =
  document.getElementById("debug");


/* =====================================================
   DEBUG
   ===================================================== */

function log(message, data) {

  const time =
    new Date().toLocaleTimeString("th-TH", {
      hour12: false
    });

  let line =
    "[" + time + "] " + message;

  if (data !== undefined) {

    try {

      line +=
        " | " +
        JSON.stringify(data, null, 2);

    } catch {

      line +=
        " | " +
        String(data);

    }

  }

  console.log(line);

  debugElement.textContent +=
    line + "\n";

  debugElement.scrollTop =
    debugElement.scrollHeight;
}


/* =====================================================
   AUDIO CONTEXT
   ===================================================== */

let audioContext = null;

function unlockAudio() {

  try {

    if (!audioContext) {

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {

        log("เบราว์เซอร์ไม่มี AudioContext");
        return;

      }

      audioContext =
        new AudioContextClass();

      log(
        "สร้าง AudioContext",
        {
          state: audioContext.state
        }
      );
    }

    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume()
        .catch(function(error) {

          log(
            "AudioContext resume ERROR",
            error.message
          );

        });

    }

    log("ปลดล็อกระบบเสียงแล้ว");

  } catch (error) {

    log(
      "AudioContext ERROR",
      error.message
    );

  }
}


/* =====================================================
   BROWSER VOICES
   ===================================================== */

let thaiVoice = null;
let englishVoice = null;

let voicesReady = false;


/*
  ฟังก์ชันนี้สำคัญมาก

  เราจะไม่ถือว่า th-TH ใช้ได้
  จนกว่าจะพบ voice ที่มี lang เป็น th
*/

function loadBrowserVoices() {

  if (
    !("speechSynthesis" in window)
  ) {

    log(
      "Browser ไม่รองรับ speechSynthesis"
    );

    thaiVoice = null;
    englishVoice = null;

    return;

  }


  const voices =
    window.speechSynthesis.getVoices();


  log(
    "พบเสียง Browser",
    voices.length
  );


  /*
    หาเสียงไทยจริง ๆ
  */

  thaiVoice =
    voices.find(function(voice) {

      const lang =
        String(voice.lang || "")
          .toLowerCase();

      return (
        lang === "th-th" ||
        lang.startsWith("th-") ||
        lang === "th"
      );

    }) || null;


  /*
    หาเสียงอังกฤษ
  */

  englishVoice =
    voices.find(function(voice) {

      const lang =
        String(voice.lang || "")
          .toLowerCase();

      return (
        lang === "en-us" ||
        lang.startsWith("en-")
      );

    }) || null;


  voicesReady = true;


  log(
    "เสียงไทย",
    thaiVoice
      ? {
          name: thaiVoice.name,
          lang: thaiVoice.lang,
          localService: thaiVoice.localService
        }
      : "ไม่พบ"
  );


  log(
    "เสียงอังกฤษ",
    englishVoice
      ? {
          name: englishVoice.name,
          lang: englishVoice.lang,
          localService: englishVoice.localService
        }
      : "ไม่พบ"
  );


  /*
    แสดงสถานะให้ผู้ใช้รู้ตั้งแต่ต้น
  */

  if (!thaiVoice) {

    log(
      "⚠️ เครื่องนี้ไม่มี Thai Voice"
    );

  }

}


if (
  "speechSynthesis" in window
) {

  loadBrowserVoices();

  window.speechSynthesis.onvoiceschanged =
    function() {

      log(
        "Browser แจ้งว่า voices เปลี่ยนแปลง"
      );

      loadBrowserVoices();

    };

}


/* =====================================================
   ตรวจว่ามี Thai Voice หรือไม่
   ===================================================== */

function getThaiVoice() {

  /*
    โหลดใหม่ทุกครั้ง
    เพราะ Chrome/Edge บางครั้ง
    voices จะมาไม่พร้อมตอนเปิดหน้า
  */

  loadBrowserVoices();

  return thaiVoice;
}


/* =====================================================
   ตรวจภาษา
   ===================================================== */

function detectLanguage(text) {

  const value =
    String(text || "").trim();


  if (!value) {
    return "unknown";
  }


  const japaneseMatches =
    value.match(
      /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/g
    );


  const thaiMatches =
    value.match(
      /[\u0E00-\u0E7F]/g
    );


  const englishMatches =
    value.match(
      /[A-Za-z]/g
    );


  const japaneseCount =
    japaneseMatches
      ? japaneseMatches.length
      : 0;


  const thaiCount =
    thaiMatches
      ? thaiMatches.length
      : 0;


  const englishCount =
    englishMatches
      ? englishMatches.length
      : 0;


  log(
    "ตรวจภาษา",
    {
      thai: thaiCount,
      japanese: japaneseCount,
      english: englishCount
    }
  );


  /*
    ญี่ปุ่น
  */

  if (
    japaneseCount > thaiCount &&
    japaneseCount > englishCount
  ) {

    return "ja";

  }


  /*
    ไทย
  */

  if (
    thaiCount >= japaneseCount &&
    thaiCount >= englishCount
  ) {

    return "th";

  }


  /*
    อังกฤษ
  */

  if (
    englishCount > 0
  ) {

    return "en";

  }


  return "th";
}


/* =====================================================
   BROWSER TTS ภาษาไทย
   ===================================================== */

function speakThai(text) {

  return new Promise(function(resolve, reject) {

    if (
      !("speechSynthesis" in window)
    ) {

      reject(
        new Error(
          "เบราว์เซอร์ไม่รองรับ speechSynthesis"
        )
      );

      return;

    }


    if (
      !text ||
      !text.trim()
    ) {

      reject(
        new Error(
          "ไม่มีข้อความภาษาไทยสำหรับอ่าน"
        )
      );

      return;

    }


    /*
      ตรวจ Thai Voice ก่อนพูด
    */

    const voice =
      getThaiVoice();


    if (!voice) {

      const message =
        "❌ ไม่พบเสียงภาษาไทยใน Browser\n" +
        "ระบบจึงไม่พูดข้อความไทย\n" +
        "กรุณาติดตั้งหรือเปิดใช้งาน Thai Voice ใน Windows/Browser";

      log(
        "THAI VOICE ERROR",
        message
      );


      statusElement.innerText =
        "❌ ไม่พบเสียงภาษาไทย";


      answerElement.innerText =
        answerElement.innerText +
        "\n\n[VOICE ERROR]\n" +
        message;


      reject(
        new Error(message)
      );

      return;

    }


    log(
      "พบ Thai Voice พร้อมใช้งาน",
      {
        name: voice.name,
        lang: voice.lang,
        localService: voice.localService
      }
    );


    /*
      หยุดเสียงเก่าก่อน
    */

    window.speechSynthesis.cancel();


    /*
      สร้างข้อความพูด
    */

    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.voice =
      voice;

    utterance.lang =
      voice.lang;

    utterance.rate =
      0.95;

    utterance.pitch =
      1.0;

    utterance.volume =
      1.0;


    let started = false;


    utterance.onstart =
      function() {

        started = true;

        log(
          "Browser Thai TTS เริ่มพูด",
          {
            voice: voice.name,
            lang: voice.lang
          }
        );

        statusElement.innerText =
          "🔊 กำลังพูดภาษาไทย...";

      };


    utterance.onend =
      function() {

        log(
          "Browser Thai TTS พูดเสร็จแล้ว"
        );

        statusElement.innerText =
          "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

        resolve();

      };


    utterance.onerror =
      function(event) {

        log(
          "Browser Thai TTS ERROR",
          {
            error: event.error,
            started: started,
            voice: voice.name
          }
        );


        statusElement.innerText =
          "❌ Thai Voice เกิดข้อผิดพลาด";


        reject(
          new Error(
            "Thai Voice: " +
            event.error
          )
        );

      };


    try {

      log(
        "กำลังส่งข้อความเข้า Thai Voice"
      );


      window.speechSynthesis.speak(
        utterance
      );


      /*
        ตรวจซ้ำหลังเรียก speak
      */

      setTimeout(function() {

        log(
          "สถานะ speechSynthesis",
          {
            speaking:
              window.speechSynthesis.speaking,

            pending:
              window.speechSynthesis.pending,

            paused:
              window.speechSynthesis.paused
          }
        );

      }, 300);


    } catch (error) {

      log(
        "เรียก Thai TTS ไม่สำเร็จ",
        error.message
      );

      reject(error);

    }

  });

}


/* =====================================================
   BROWSER TTS ภาษาอังกฤษ
   ===================================================== */

function speakEnglish(text) {

  return new Promise(function(resolve, reject) {

    if (
      !("speechSynthesis" in window)
    ) {

      reject(
        new Error(
          "เบราว์เซอร์ไม่รองรับ speechSynthesis"
        )
      );

      return;

    }


    const voice =
      englishVoice ||
      null;


    if (!voice) {

      reject(
        new Error(
          "ไม่พบเสียงภาษาอังกฤษใน Browser"
        )
      );

      return;

    }


    window.speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(

      );


    utterance.voice =
      voice;

    utterance.lang =

    utterance.pitch =

      1.0;


    utterance.onstart =
      function() {

        log(
          "English TTS เริ่มพูด",
          {
            voice: voice.name
          }
        );

        statusElement.innerText =
          "🔊 กำลังพูดภาษาอังกฤษ...";

    );

/* =====================================================
   VOICEVOX
   ญี่ปุ่นเท่านั้น
   ===================================================== */

async function speakVoicevox(text) {

  statusElement.innerText =
    "🎙️ กำลังสร้างเสียง VOICEVOX...";


  log(
    "เริ่มสร้างเสียง VOICEVOX",
    {
      speaker: VOICEVOX_SPEAKER_ID,
      text: text
    }
  );


  /*
    ตรวจ Engine
  */

  const versionResponse =
    await fetch(
      VOICEVOX_URL + "/version"
    );


  if (!versionResponse.ok) {

    throw new Error(
      "VOICEVOX /version HTTP " +
      versionResponse.status
    );

  }


  const version =
    await versionResponse.text();


  log(
    "VOICEVOX version",
    version
  );


  /*
    ตรวจ Speaker
  */

  const speakersResponse =
    await fetch(
      VOICEVOX_URL + "/speakers"
    );


  if (!speakersResponse.ok) {

    throw new Error(
      "VOICEVOX /speakers HTTP " +
      speakersResponse.status
    );

  }


  const speakers =
    await speakersResponse.json();


  let speakerFound = null;


  for (
    const speaker of speakers
  ) {

    if (!speaker.styles) {
      continue;
    }


    for (
      const style of speaker.styles
    ) {

      if (
        style.id ===
        VOICEVOX_SPEAKER_ID
      ) {

        speakerFound = {
          name: speaker.name,
          style: style.name,
          id: style.id
        };

      }

    }

  }


  if (!speakerFound) {

    throw new Error(
      "ไม่พบ VOICEVOX Speaker ID " +
      VOICEVOX_SPEAKER_ID
    );

  }


  log(
    "พบ Speaker",
    speakerFound
  );


  /*
    audio_query
  */

  const queryResponse =
    await fetch(
      VOICEVOX_URL +
      "/audio_query?speaker=" +
      VOICEVOX_SPEAKER_ID +
      "&text=" +
      encodeURIComponent(text),
      {
        method: "POST"
      }
    );


  log(
    "audio_query response",
    {
      status:
        queryResponse.status,
      ok:
        queryResponse.ok
    }
  );


  if (!queryResponse.ok) {

    const errorText =
      await queryResponse.text();

    throw new Error(
      "VOICEVOX audio_query HTTP " +
      queryResponse.status +
      ": " +
      errorText
    );

  }


  const query =
    await queryResponse.json();


  query.speedScale =
    1.0;

  query.pitchScale =
    0.02;

  query.intonationScale =
    1.08;

  query.volumeScale =
    1.0;


  /*
    synthesis
  */

  log(
    "กำลังสร้างไฟล์เสียง WAV"
  );


  const synthesisResponse =
    await fetch(
      VOICEVOX_URL +
      "/synthesis?speaker=" +
      VOICEVOX_SPEAKER_ID,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          "Accept":
            "audio/wav"
        },

        body:
          JSON.stringify(query)
      }
    );


  log(
    "synthesis response",
    {
      status:
        synthesisResponse.status,
      ok:
        synthesisResponse.ok
    }
  );


  if (!synthesisResponse.ok) {

    const errorText =
      await synthesisResponse.text();

    throw new Error(
      "VOICEVOX synthesis HTTP " +
      synthesisResponse.status +
      ": " +
      errorText
    );

  }


  const audioBlob =
    await synthesisResponse.blob();


  log(
    "ได้รับไฟล์เสียง",
    {
      size:
        audioBlob.size,
      type:
        audioBlob.type
    }
  );


  if (
    !audioBlob ||
    audioBlob.size === 0
  ) {

    throw new Error(
      "VOICEVOX ส่งไฟล์เสียงว่าง"
    );

  }


  /*
    เล่น WAV
  */

  const audioUrl =
    URL.createObjectURL(
      audioBlob
    );


  const audio =
    new Audio(audioUrl);


  audio.volume = 1.0;


  return new Promise(function(resolve, reject) {

    audio.onplay =
      function() {

        log(
          "VOICEVOX เริ่มเล่นเสียง"
        );

        statusElement.innerText =
          "🔊 ずんだもん กำลังพูด...";

      };


    audio.onended =
      function() {

        log(
          "VOICEVOX พูดเสร็จแล้ว"
        );

        URL.revokeObjectURL(
          audioUrl
        );

        statusElement.innerText =
          "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

        resolve();

      };


    audio.onerror =
      function() {

        log(
          "VOICEVOX audio playback ERROR"
        );

        URL.revokeObjectURL(
          audioUrl
        );

        reject(
          new Error(
            "เปิดไฟล์เสียง VOICEVOX ไม่ได้"
          )
        );

      };


    audio.play()
      .then(function() {

        log(
          "VOICEVOX audio.play() สำเร็จ",
          {
            paused:
              audio.paused,
            volume:
              audio.volume,
            muted:
              audio.muted
          }
        );

      })
      .catch(function(error) {

        log(
          "VOICEVOX audio.play() ERROR",
          error.message
        );

        URL.revokeObjectURL(
          audioUrl
        );

        reject(error);

      });

  });

}


/* =====================================================
   ระบบเลือกเสียง
   Gemini → ตรวจภาษา → TTS
   ===================================================== */

async function speak(text) {

  if (
    !text ||
    !text.trim()
  ) {

    return;

  }


  unlockAudio();


  const language =
    detectLanguage(text);


  log(
    "เลือกภาษาเสียง",
    {
      language: language
    }
  );


  try {

    /*
      ไทย
      → ต้องมี Thai Voice เท่านั้น
    */

    if (
      language === "th"
    ) {

      log(
        "ภาษาไทย → ตรวจ Thai Voice"
      );


      const voice =
        getThaiVoice();


      if (!voice) {

        const errorMessage =
          "❌ AI ตอบเป็นภาษาไทย แต่เครื่องนี้ไม่มี Thai Voice\n\n" +
          "จึงไม่สามารถอ่านคำตอบออกเสียงได้\n\n" +
          "ให้ติดตั้ง/เปิดใช้งานเสียงภาษาไทยใน Windows แล้วเปิดเว็บใหม่";


        log(
          "THAI VOICE ERROR",
          errorMessage
        );


        statusElement.innerText =
          "❌ ไม่มีเสียงภาษาไทย";


        answerElement.innerText =
          answerElement.innerText +
          "\n\n" +
          errorMessage;


        return;

      }


      log(
        "ภาษาไทย → ใช้ Thai Voice",
        {
          name:
            voice.name,
          lang:
            voice.lang
        }
      );


      await speakThai(text);

      return;

    }


    /*
      ญี่ปุ่น
      → VOICEVOX
    */

    if (
      language === "ja"
    ) {

      log(
        "ภาษาญี่ปุ่น → VOICEVOX ID 7"
      );

      await speakVoicevox(text);

      return;

    }


    /*
      อังกฤษ
    */

    if (
      language === "en"
    ) {

      log(
        "ภาษาอังกฤษ → Browser TTS"
      );

      await speakEnglish(text);

      return;

    }


    /*
      ไม่ทราบภาษา
    */

    log(
      "ไม่ทราบภาษา → ไม่พูด"
    );


    statusElement.innerText =
      "⚠️ ตรวจภาษาไม่ได้ จึงไม่เล่นเสียง";

  }

  catch (error) {

    log(
      "ระบบเสียง ERROR",
      {
        message:
          error.message
      }
    );


    statusElement.innerText =
      "❌ ระบบเสียงมีปัญหา";


    answerElement.innerText =
      answerElement.innerText +
      "\n\n[VOICE ERROR]\n" +
      error.message;

  }

}


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

let recognition = null;
let listening = false;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  statusElement.innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";

  log(
    "ไม่พบ SpeechRecognition"
  );

} else {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "th-TH";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      listening = true;

      micButton.classList.add(
        "listening"
      );

      statusElement.innerText =
        "🎙️ กำลังฟังครับ...";

      log(
        "เริ่มรับเสียง"
      );

    };


  recognition.onresult =
    function(event) {

      const text =
        event.results[0][0].transcript;


      questionElement.value =
        text;


      log(
        "รับคำถามจากไมค์",
        text
      );


      stopListening();


      askAI(text);

    };


  recognition.onerror =
    function(event) {

      log(
        "Speech Recognition ERROR",
        event.error
      );


      stopListening();


      let message =
        "รับเสียงไม่ได้ครับ";


      if (
        event.error ===
        "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      } else if (
        event.error ===
        "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      } else if (
        event.error ===
        "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }


      statusElement.innerText =
        message;

    };


  recognition.onend =
    function() {

      stopListening();

    };

}


function startListening() {

  unlockAudio();


  if (!recognition) {
    return;
  }


  if (listening) {

    recognition.stop();

    return;

  }


  try {

    recognition.start();

  } catch (error) {

    log(
      "เริ่มไมค์ ERROR",
      error.message
    );

  }

}


function stopListening() {

  listening = false;

  micButton.classList.remove(
    "listening"
  );

}


micButton.addEventListener(
  "click",
  function() {

    unlockAudio();

    startListening();

  }
);


/* =====================================================
   GEMINI / APPS SCRIPT
   JSONP
   ===================================================== */

function askAI(question) {

  if (
    !question ||
    !question.trim()
  ) {

    return;

  }


  unlockAudio();


  const cleanQuestion =
    question.trim();


  log(
    "ส่งคำถาม",
    cleanQuestion
  );


  statusElement.innerText =
    "🤖 กำลังวิเคราะห์...";


  answerElement.innerText =
    "กำลังอ่านข้อมูลจากสวน...";


  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement("script");


  let completed = false;


  window[callbackName] =
    function(result) {

      if (completed) {
        return;
      }


      completed = true;


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      delete window[callbackName];


      if (!result) {

        statusElement.innerText =
          "❌ AI ไม่ส่งข้อมูลกลับมา";

        answerElement.innerText =
          "ไม่ได้รับคำตอบจาก AI";

        return;

      }


      if (result.error) {

        log(
          "AI ERROR",
          result.error
        );


        statusElement.innerText =
          "❌ เกิดข้อผิดพลาด";


        answerElement.innerText =
          result.error;

        return;

      }


      /*
        ทำความสะอาดคำตอบ
        ป้องกัน ```html / ``` หลุดขึ้นเว็บ
      */

      let answer =
        String(
          result.answer ||
          ""
        );


      answer =
        answer
          .replace(/^```(?:html|htm|text|markdown)?\s*/i, "")
          .replace(/\s*```$/i, "")
          .trim();


      if (!answer) {

        answer =
          "AI ไม่ได้ส่งคำตอบกลับมาครับ";

      }


      log(
        "AI ตอบกลับแล้ว",
        {
          length:
            answer.length
        }
      );


      answerElement.innerText =
        answer;


      unlockAudio();


      /*
        สำคัญ:
        รอให้ Browser รับ event แล้วค่อยเรียก speak
      */

      setTimeout(function() {

        speak(answer);

      }, 50);

    };


  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      cleanQuestion
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      if (completed) {
        return;
      }


      completed = true;


      delete window[callbackName];


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      log(
        "เชื่อมต่อ Apps Script ERROR"
      );


      statusElement.innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";


      answerElement.innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   ENTER = SEND
   ===================================================== */

questionElement.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      unlockAudio();

      askAI(
        this.value
      );

    }

  }
);


/* =====================================================
   PAGE CLICK
   ===================================================== */

document.addEventListener(
  "click",
  function() {

    unlockAudio();

  }
);


/* =====================================================
   STARTUP
   ===================================================== */

log(
  "Cucumber AI พร้อมทำงาน"
);


log(
  "โหมดเสียง",
  {
    thai:
      "Browser Thai Voice",
    japanese:
      "VOICEVOX ID 7",
    english:
      "Browser English TTS"
  }
);


/*
  ตรวจเสียงไทยตอนเปิดหน้า
*/

setTimeout(function() {

  const voice =
    getThaiVoice();


  if (voice) {

    log(
      "✅ Thai Voice พร้อมใช้งาน",
      {
        name:
          voice.name,
        lang:
          voice.lang
      }
    );

  } else {

    log(
      "⚠️ ยังไม่พบ Thai Voice"
    );

  }

}, 1000);

<script>


/* =====================================================
   CONFIG
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";


const VOICEVOX_URL =
  "http://127.0.0.1:50021";


const SPEAKER_ID = 7;


/* =====================================================
   ELEMENTS
   ===================================================== */

const statusElement =
  document.getElementById("status");


const answerElement =
  document.getElementById("answer");


const questionElement =
  document.getElementById("question");


const micButton =
  document.getElementById("micButton");


const debugElement =
  document.getElementById("debug");


const audioPlayer =
  document.getElementById("audioPlayer");


/* =====================================================
   DEBUG
   ===================================================== */

function log(message, data) {

  const time =
    new Date().toLocaleTimeString(
      "th-TH",
      {
        hour12: false
      }
    );

  let line =
    "[" +
    time +
    "] " +
    message;

  if (
    data !== undefined
  ) {

    try {

      line +=
        " | " +
        JSON.stringify(
          data,
          null,
          2
        );

    }
    catch {

      line +=
        " | " +
        String(data);

    }

  }

  console.log(
    message,
    data
  );

  debugElement.textContent +=
    "\n" +
    line;

  debugElement.scrollTop =
    debugElement.scrollHeight;
}


/* =====================================================
   AUDIO SYSTEM
   ===================================================== */

let audioContext = null;

let audioUnlocked = false;


let currentSource = null;

let currentGain = null;


/* -----------------------------------------------------
   สร้าง AudioContext
   ----------------------------------------------------- */

function createAudioContext() {

  if (audioContext) {

    return audioContext;

  }

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContextClass) {

    log(
      "เบราว์เซอร์ไม่รองรับ Web Audio API"
    );

    return null;

  }


  audioContext =
    new AudioContextClass();


  log(
    "สร้าง AudioContext",
    {
      state:
        audioContext.state,
      sampleRate:
        audioContext.sampleRate
    }
  );


  return audioContext;
}


/* -----------------------------------------------------
   ปลดล็อกเสียงจาก user gesture
   ----------------------------------------------------- */

async function unlockAudio() {

  const ctx =
    createAudioContext();


  if (!ctx) {

    return false;

  }


  try {

    if (
      ctx.state ===
      "suspended"
    ) {

      await ctx.resume();

    }


    /*
      สร้าง buffer เงียบสั้น ๆ
      เพื่อปลด autoplay policy
    */

    const buffer =
      ctx.createBuffer(
        1,
        1,
        ctx.sampleRate
      );


    const source =
      ctx.createBufferSource();


    source.buffer =
      buffer;


    source.connect(
      ctx.destination
    );


    source.start(0);


    audioUnlocked =
      true;


    log(
      "AudioContext พร้อมใช้งาน",
      {
        state:
          ctx.state
      }
    );


    return true;

  }
  catch (error) {

    log(
      "ปลดล็อกเสียงไม่สำเร็จ",
      error.message
    );

    return false;

  }

}


/* =====================================================
   UNLOCK AUDIO เมื่อผู้ใช้กดปุ่ม
   ===================================================== */

document.addEventListener(
  "click",
  function () {

    unlockAudio();

  },
  {
    once: false
  }
);


document.addEventListener(
  "keydown",
  function () {

    unlockAudio();

  },
  {
    once: false
  }
);


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

let recognition =
  null;


let listening =
  false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  statusElement.innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";


  log(
    "ไม่พบ SpeechRecognition"
  );

}
else {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "th-TH";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function () {

      listening =
        true;


      micButton
        .classList
        .add(
          "listening"
        );


      statusElement.innerText =
        "🎙️ กำลังฟังครับ...";


      log(
        "เริ่มรับเสียง"
      );

    };


  recognition.onresult =
    function (event) {

      const text =
        event
          .results[0][0]
          .transcript
          .trim();


      log(
        "รับเสียงได้",
        text
      );


      questionElement.value =
        text;


      stopListening();


      askAI(text);

    };


  recognition.onerror =
    function (event) {

      log(
        "Speech error",
        event.error
      );


      stopListening();


      let message =
        "รับเสียงไม่ได้ครับ";


      if (
        event.error ===
        "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      }
      else if (
        event.error ===
        "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      }
      else if (
        event.error ===
        "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }


      statusElement.innerText =
        message;

    };


  recognition.onend =
    function () {

      stopListening();

      log(
        "สิ้นสุดการรับเสียง"
      );

    };

}


/* =====================================================
   START LISTENING
   ===================================================== */

async function startListening() {

  await unlockAudio();


  if (!recognition) {

    return;

  }


  if (listening) {

    recognition.stop();

    return;

  }


  try {

    recognition.start();

  }
  catch (error) {

    log(
      "เริ่มไมค์ไม่ได้",
      error.message
    );

  }

}


/* =====================================================
   STOP LISTENING
   ===================================================== */

function stopListening() {

  listening =
    false;


  micButton
    .classList
    .remove(
      "listening"
    );

}


micButton.addEventListener(
  "click",
  startListening
);


/* =====================================================
   ASK AI
   ===================================================== */

function askAI(question) {

  if (
    !question ||
    !question.trim()
  ) {

    return;

  }


  unlockAudio();


  statusElement.innerText =
    "🤖 กำลังวิเคราะห์...";


  answerElement.innerText =
    "กำลังอ่านข้อมูลจากสวน...";


  log(
    "ส่งคำถาม AI",
    question
  );


  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      "script"
    );


  let completed =
    false;


  window[callbackName] =
    function (result) {

      if (completed) {

        return;

      }


      completed =
        true;


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }


      delete window[
        callbackName
      ];


      if (
        !result
      ) {

        statusElement.innerText =
          "❌ AI ไม่ส่งข้อมูลกลับมา";

        return;

      }


      if (
        result.error
      ) {

        statusElement.innerText =
          "❌ เกิดข้อผิดพลาด";


        answerElement.innerText =
          result.error;


        log(
          "AI ERROR",
          result.error
        );


        return;

      }


      const answer =
        result.answer ||
        "AI ไม่ได้ส่งคำตอบกลับมาครับ";


      answerElement.innerText =
        answer;


      statusElement.innerText =
        "🔊 กำลังเตรียมเสียงตอบ...";


      log(
        "AI ตอบกลับแล้ว",
        {
          length:
            answer.length
        }
      );


      speak(answer);

    };


  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      question
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function () {

      if (completed) {

        return;

      }


      completed =
        true;


      delete window[
        callbackName
      ];


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }


      statusElement.innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";


      answerElement.innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";


      log(
        "Apps Script เชื่อมต่อไม่ได้"
      );

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   VOICEVOX
   ===================================================== */

async function speak(text) {

  if (
    !text ||
    !text.trim()
  ) {

    log(
      "ไม่มีข้อความให้พูด"
    );

    return;

  }


  statusElement.innerText =
    "🎙️ กำลังเชื่อมต่อ VOICEVOX...";


  log(
    "เริ่ม VOICEVOX",
    {
      url:
        VOICEVOX_URL,
      speaker:
        SPEAKER_ID,
      textLength:
        text.length
    }
  );


  /*
    สำคัญ:
    AudioContext ต้องถูก resume
    ก่อนเล่นเสียง
  */

  const ctx =
    createAudioContext();


  if (!ctx) {

    return;

  }


  try {

    if (
      ctx.state !==
      "running"
    ) {

      log(
        "AudioContext ยังไม่ running",
        ctx.state
      );


      await ctx.resume();


      log(
        "AudioContext หลัง resume",
        ctx.state
      );

    }


    /* =================================================
       1. ตรวจ VOICEVOX
       ================================================= */

    log(
      "กำลังตรวจ VOICEVOX"
    );


    const versionResponse =
      await fetch(
        VOICEVOX_URL +
        "/version",
        {
          method:
            "GET",
          cache:
            "no-store"
        }
      );


    if (
      !versionResponse.ok
    ) {

      throw new Error(
        "VOICEVOX /version HTTP " +
        versionResponse.status
      );

    }


    const version =
      await versionResponse.text();


    log(
      "VOICEVOX version",
      version
    );


    /* =================================================
       2. ตรวจ SPEAKER
       ================================================= */

    log(
      "กำลังตรวจ Speaker ID",
      SPEAKER_ID
    );


    const speakersResponse =
      await fetch(
        VOICEVOX_URL +
        "/speakers",
        {
          method:
            "GET",
          cache:
            "no-store"
        }
      );


    if (
      !speakersResponse.ok
    ) {

      throw new Error(
        "VOICEVOX /speakers HTTP " +
        speakersResponse.status
      );

    }


    const speakers =
      await speakersResponse.json();


    let foundSpeaker =
      null;


    for (
      const speaker
      of speakers
    ) {

      for (
        const style
        of speaker.styles
      ) {

        if (
          style.id ===
          SPEAKER_ID
        ) {

          foundSpeaker = {

            name:
              speaker.name,

            style:
              style.name,

            id:
              style.id

          };

          break;

        }

      }


      if (foundSpeaker) {

        break;

      }

    }


    if (!foundSpeaker) {

      throw new Error(
        "ไม่พบ Speaker ID " +
        SPEAKER_ID
      );

    }


    log(
      "พบ Speaker",
      foundSpeaker
    );


    /* =================================================
       3. AUDIO QUERY
       ================================================= */

    statusElement.innerText =
      "🎙️ กำลังสร้างเสียง...";


    log(
      "กำลังสร้าง audio_query"
    );


    const queryResponse =
      await fetch(
        VOICEVOX_URL +
        "/audio_query?speaker=" +
        SPEAKER_ID +
        "&text=" +
        encodeURIComponent(
          text
        ),
        {
          method:
            "POST",
          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded"
          }
        }
      );


    log(
      "audio_query response",
      {
        status:
          queryResponse.status,
        ok:
          queryResponse.ok
      }
    );


    if (
      !queryResponse.ok
    ) {

      const errorText =
        await queryResponse.text();


      throw new Error(
        "audio_query HTTP " +
        queryResponse.status +
        ": " +
        errorText
      );

    }


    const query =
      await queryResponse.json();


    /* =================================================
       4. ปรับเสียง
       ================================================= */

    query.speedScale =
      1.0;


    query.pitchScale =
      0.02;


    query.intonationScale =
      1.08;


    query.volumeScale =
      1.0;


    /* =================================================
       5. SYNTHESIS
       ================================================= */

    log(
      "กำลังสร้างไฟล์เสียง WAV"
    );


    const synthesisResponse =
      await fetch(
        VOICEVOX_URL +
        "/synthesis?speaker=" +
        SPEAKER_ID,
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Accept":
              "audio/wav"
          },

          body:
            JSON.stringify(
              query
            )
        }
      );


    log(
      "synthesis response",
      {
        status:
          synthesisResponse.status,
        ok:
          synthesisResponse.ok
      }
    );


    if (
      !synthesisResponse.ok
    ) {

      const errorText =
        await synthesisResponse.text();


      throw new Error(
        "synthesis HTTP " +
        synthesisResponse.status +
        ": " +
        errorText
      );

    }


    /* =================================================
       6. รับ WAV
       ================================================= */

    const audioBlob =
      await synthesisResponse.blob();


    log(
      "ได้รับไฟล์เสียง",
      {
        size:
          audioBlob.size,
        type:
          audioBlob.type
      }
    );


    if (
      !audioBlob ||
      audioBlob.size === 0
    ) {

      throw new Error(
        "VOICEVOX ส่งไฟล์เสียงว่าง"
      );

    }


    /* =================================================
       7. DECODE WAV
       ================================================= */

    statusElement.innerText =
      "🔊 กำลังเตรียมเสียง...";


    log(
      "กำลัง decode WAV"
    );


    const arrayBuffer =
      await audioBlob.arrayBuffer();


    const audioBuffer =
      await ctx.decodeAudioData(
        arrayBuffer.slice(0)
      );


    log(
      "Decode WAV สำเร็จ",
      {
        duration:
          audioBuffer.duration,
        sampleRate:
          audioBuffer.sampleRate,
        channels:
          audioBuffer.numberOfChannels,
        length:
          audioBuffer.length
      }
    );


    /* =================================================
       8. ตรวจว่ามีเสียงจริงหรือไม่
       ================================================= */

    let maxPeak =
      0;

    let sumSquares =
      0;

    let sampleCount =
      0;


    for (
      let channel = 0;
      channel <
      audioBuffer.numberOfChannels;
      channel++
    ) {

      const data =
        audioBuffer.getChannelData(
          channel
        );


      /*
        อ่านทุก ๆ 100 sample
        เพื่อลดภาระ CPU
      */

      for (
        let i = 0;
        i < data.length;
        i += 100
      ) {

        const value =
          data[i];


        const abs =
          Math.abs(value);


        if (
          abs >
          maxPeak
        ) {

          maxPeak =
            abs;

        }


        sumSquares +=
          value * value;


        sampleCount++;

      }

    }


    const rms =
      sampleCount > 0
        ? Math.sqrt(
            sumSquares /
            sampleCount
          )
        : 0;


    log(
      "ตรวจระดับเสียง",
      {
        peak:
          maxPeak,
        rms:
          rms,
        duration:
          audioBuffer.duration
      }
    );


    if (
      maxPeak <
      0.0001
    ) {

      throw new Error(
        "WAV ไม่มีสัญญาณเสียง หรือเสียงเบามากผิดปกติ"
      );

    }


    /* =================================================
       9. หยุดเสียงเดิม
       ================================================= */

    if (currentSource) {

      try {

        currentSource.stop();

      }
      catch {}

      currentSource =
        null;

    }


    /* =================================================
       10. สร้าง Gain
       ================================================= */

    currentGain =
      ctx.createGain();


    /*
      เพิ่มความดังเล็กน้อย
      ไม่ควรสูงเกินไปจนแตก
    */

    currentGain.gain.value =
      1.8;


    currentGain.connect(
      ctx.destination
    );


    /* =================================================
       11. PLAY ผ่าน Web Audio
       ================================================= */

    currentSource =
      ctx.createBufferSource();


    currentSource.buffer =
      audioBuffer;


    currentSource.connect(
      currentGain
    );


    currentSource.onended =
      function () {

        log(
          "เล่นเสียงเสร็จแล้ว"
        );


        currentSource =
          null;


        if (
          currentGain
        ) {

          try {

            currentGain.disconnect();

          }
          catch {}

          currentGain =
            null;

        }


        statusElement.innerText =
          "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

      };


    statusElement.innerText =
      "🔊 ずんだもん กำลังพูด...";


    log(
      "เริ่มเล่นเสียง",
      {
        audioContext:
          ctx.state,
        duration:
          audioBuffer.duration,
        gain:
          currentGain.gain.value
      }
    );


    currentSource.start(0);


    log(
      "VOICEVOX เล่นเสียงสำเร็จ"
    );


    /*
      สำรองด้วย HTML Audio
      แต่จะไม่เล่นซ้อนทันที
      ใช้เฉพาะกรณี Web Audio ล้มเหลว
    */

  }
  catch (error) {

    console.error(
      "VOICEVOX ERROR:",
      error
    );


    const message =
      error &&
      error.message
        ? error.message
        : String(error);


    log(
      "VOICEVOX ERROR",
      message
    );


    statusElement.innerText =
      "❌ " +
      message;


    answerElement.innerText =
      answerElement.innerText +
      "\n\n[VOICEVOX ERROR]\n" +
      message;

  }

}


/* =====================================================
   FALLBACK HTML AUDIO
   ===================================================== */

async function fallbackHTMLAudio(
  audioBlob
) {

  log(
    "เริ่ม Fallback HTML Audio"
  );


  return new Promise(
    async function (
      resolve,
      reject
    ) {

      try {

        const url =
          URL.createObjectURL(
            audioBlob
          );


        audioPlayer.src =
          url;


        audioPlayer.volume =
          1.0;


        audioPlayer.onended =
          function () {

            log(
              "Fallback เล่นเสร็จแล้ว"
            );


            URL.revokeObjectURL(
              url
            );


            resolve();

          };


        audioPlayer.onerror =
          function () {

            log(
              "Fallback HTML Audio เล่นไม่ได้"
            );


            URL.revokeObjectURL(
              url
            );


            reject(
              new Error(
                "HTML Audio playback failed"
              )
            );

          };


        await audioPlayer.play();


        log(
          "Fallback HTML Audio เริ่มเล่น"
        );

      }
      catch (error) {

        reject(
          error
        );

      }

    }
  );

}

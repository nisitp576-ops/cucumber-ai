<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cucumber AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #1b2630 0%,
          #0f1115 45%,
          #090a0c 100%
        );

      color: white;

      font-family:
        Arial,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;
    }

    .app {

      width: 100%;

      max-width: 600px;

      padding: 30px 20px 40px;

      text-align: center;
    }

    .robot {

      font-size: 70px;

      margin-bottom: 5px;
    }

    h1 {

      margin: 0;

      font-size: 30px;

      font-weight: 600;
    }

    #status {

      margin:
        18px
        0
        30px;

      color: #aaa;

      min-height: 25px;
    }

    #micButton {

      width: 180px;

      height: 180px;

      border-radius: 50%;

      border: none;

      background: #20252b;

      color: white;

      font-size: 70px;

      cursor: pointer;

      transition: 0.2s;

      box-shadow:
        0 0 35px
        rgba(
          255,
          255,
          255,
          0.12
        );
    }

    #micButton:active {

      transform:
        scale(0.94);
    }

    #micButton.listening {

      background:
        #b71c1c;

      box-shadow:
        0 0 60px
        rgba(
          244,
          67,
          54,
          0.65
        );

      animation:
        pulse
        1.1s
        infinite;
    }

    @keyframes pulse {

      0% {
        transform:
          scale(1);
      }

      50% {
        transform:
          scale(1.06);
      }

      100% {
        transform:
          scale(1);
      }

    }

    #question {

      width: 100%;

      margin-top: 30px;

      padding: 15px;

      border-radius: 12px;

      border:
        1px solid
        #333;

      background:
        #191c20;

      color: white;

      font-size: 18px;

      outline: none;
    }

    #question::placeholder {

      color: #777;
    }

    #answer {

      margin-top: 25px;

      padding: 20px;

      border-radius: 15px;

      background:
        rgba(
          255,
          255,
          255,
          0.06
        );

      text-align: left;

      line-height: 1.7;

      font-size: 18px;

      min-height: 100px;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }

    .hint {

      margin-top: 20px;

      color: #666;

      font-size: 14px;
    }

    #voiceTestButton {

      margin-top: 18px;

      padding:
        10px
        18px;

      border-radius: 10px;

      border:
        1px solid
        #444;

      background:
        #191c20;

      color: #ddd;

      cursor: pointer;

      font-size: 14px;
    }

    #voiceTestButton:hover {

      background:
        #252a30;
    }

    #debug {

      margin-top: 20px;

      padding: 12px;

      border-radius: 10px;

      background:
        rgba(
          0,
          0,
          0,
          0.35
        );

      color: #777;

      font-size: 12px;

      text-align: left;

      white-space: pre-wrap;

      max-height: 180px;

      overflow-y: auto;
    }

  </style>

</head>


<body>


<div class="app">


  <div class="robot">
    🤖
  </div>


  <h1>
    Cucumber AI
  </h1>


  <div id="status">

    พร้อมครับ
    กดไมค์แล้วพูดได้เลย

  </div>


  <button
    id="micButton"
    type="button"
  >

    🎙️

  </button>


  <input
    id="question"
    type="text"
    placeholder="หรือพิมพ์คำถาม..."
    autocomplete="off"
  >


  <div id="answer">

    รอคำถามจากคุณ...

  </div>


  <button
    id="voiceTestButton"
    type="button"
  >

    🔊 ทดสอบ VOICEVOX

  </button>


  <div class="hint">

    กดไมค์ →
    พูด →
    AI วิเคราะห์ →
    AI พูดตอบ

  </div>


  <div id="debug"></div>


</div>



<script>


/* =====================================================
   Google Apps Script
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";



/* =====================================================
   VOICEVOX
   ===================================================== */

const VOICEVOX_URLS = [

  "http://127.0.0.1:50021",

  "http://localhost:50021"

];

const SPEAKER_ID = 7;



/* =====================================================
   Audio Engine

   สำคัญมาก:
   ปลดล็อก AudioContext ตั้งแต่ผู้ใช้กดปุ่ม
   เพื่อหลีกเลี่ยง Browser Autoplay Block
   ===================================================== */

let audioContext = null;

let currentAudioSource = null;



function logDebug(message, data) {

  const debug =
    document.getElementById(
      "debug"
    );

  const time =
    new Date()
      .toLocaleTimeString(
        "th-TH"
      );

  let line =
    "[" +
    time +
    "] " +
    message;

  if (
    data !== undefined
  ) {

    try {

      line +=
        " | " +
        JSON.stringify(
          data,
          null,
          2
        );

    }

    catch {

      line +=
        " | " +
        String(data);

    }

  }

  console.log(
    "[CUCUMBER_AI]",
    message,
    data
  );

  if (debug) {

    debug.textContent +=
      line +
      "\n";

    debug.scrollTop =
      debug.scrollHeight;

  }

}



async function unlockAudio() {

  try {

    if (!audioContext) {

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {

        throw new Error(
          "เบราว์เซอร์ไม่รองรับ AudioContext"
        );

      }

      audioContext =
        new AudioContextClass();

      logDebug(
        "สร้าง AudioContext",
        {
          state:
            audioContext.state
        }
      );

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();

      logDebug(
        "AudioContext resume แล้ว",
        {
          state:
            audioContext.state
        }
      );

    }


    return true;

  }

  catch (error) {

    logDebug(
      "ปลดล็อก AudioContext ไม่สำเร็จ",
      error.message
    );

    return false;

  }

}



/* =====================================================
   หยุดเสียงเดิม
   ===================================================== */

function stopCurrentAudio() {

  if (
    currentAudioSource
  ) {

    try {

      currentAudioSource.stop();

    }

    catch {

    }

    currentAudioSource =
      null;

  }

}



/* =====================================================
   ล้าง Markdown Code Fence

   ป้องกัน ```html / ```htm / ``` โผล่หน้าเว็บ
   ===================================================== */

function cleanAIText(text) {

  if (!text) {

    return "";

  }

  let clean =
    String(text);


  clean =
    clean.replace(
      /```(?:html?|javascript|js|css|json|text)?/gi,
      ""
    );


  clean =
    clean.replace(
      /```/g,
      ""
    );


  clean =
    clean.replace(
      /^\s*html\s*/i,
      ""
    );


  return clean.trim();

}



/* =====================================================
   Speech Recognition
   ===================================================== */

let recognition =
  null;

let listening =
  false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;



if (!SpeechRecognition) {

  document.getElementById(
    "status"
  ).innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";

}

else {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "th-TH";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;



  recognition.onstart =
    async function () {

      listening =
        true;


      await unlockAudio();


      document
        .getElementById(
          "micButton"
        )
        .classList
        .add(
          "listening"
        );


      document
        .getElementById(
          "status"
        )
        .innerText =
        "🎙️ กำลังฟังครับ...";

    };



  recognition.onresult =
    function (event) {

      const text =
        event
          .results[0][0]
          .transcript;


      document
        .getElementById(
          "question"
        )
        .value =
        text;


      stopListening();


      askAI(text);

    };



  recognition.onerror =
    function (event) {

      logDebug(
        "Speech Recognition Error",
        event.error
      );


      stopListening();


      let message =
        "รับเสียงไม่ได้ครับ";


      if (
        event.error ===
        "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      }

      else if (
        event.error ===
        "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      }

      else if (
        event.error ===
        "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }


      document
        .getElementById(
          "status"
        )
        .innerText =
        message;

    };



  recognition.onend =
    function () {

      stopListening();

    };

}



async function startListening() {

  if (!recognition) {

    return;

  }


  /*
   * ต้องทำตอน user click โดยตรง
   * เพื่อปลดล็อกเสียงก่อน AI ทำงาน
   */

  await unlockAudio();


  if (listening) {

    recognition.stop();

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    logDebug(
      "เริ่มไมค์ไม่สำเร็จ",
      error.message
    );

  }

}



function stopListening() {

  listening =
    false;


  document
    .getElementById(
      "micButton"
    )
    .classList
    .remove(
      "listening"
    );

}



document
  .getElementById(
    "micButton"
  )
  .addEventListener(
    "click",
    startListening
  );



/* =====================================================
   ส่งคำถามไป Apps Script
   JSONP
   ===================================================== */

function askAI(question) {

  if (
    !question ||
    !question.trim()
  ) {

    return;

  }


  const cleanQuestion =
    question.trim();


  document
    .getElementById(
      "status"
    )
    .innerText =
    "🤖 กำลังวิเคราะห์...";


  document
    .getElementById(
      "answer"
    )
    .innerText =
    "กำลังอ่านข้อมูลจากสวน...";


  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      "script"
    );


  let completed =
    false;



  window[callbackName] =
    function (result) {

      if (completed) {

        return;

      }


      completed =
        true;


      if (
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }


      delete window[
        callbackName
      ];


      if (
        !result ||
        result.error
      ) {

        document
          .getElementById(
            "status"
          )
          .innerText =
          "❌ เกิดข้อผิดพลาด";


        document
          .getElementById(
            "answer"
          )
          .innerText =
          result &&
          result.error
            ? result.error
            : "AI ไม่ได้ส่งข้อมูลกลับมา";


        return;

      }


      const answer =
        cleanAIText(
          result.answer ||
          ""
        );


      document
        .getElementById(
          "answer"
        )
        .innerText =
        answer ||
        "AI ไม่ได้ส่งคำตอบกลับมาครับ";


      document
        .getElementById(
          "status"
        )
        .innerText =
        "🔊 กำลังเตรียมเสียง...";


      /*
       * AudioContext ถูก unlock ตั้งแต่กดไมค์แล้ว
       */

      speak(
        answer
      );

    };



  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      cleanQuestion
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function () {

      if (completed) {

        return;

      }


      completed =
        true;


      delete window[
        callbackName
      ];


      if (
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }


      document
        .getElementById(
          "status"
        )
        .innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";


      document
        .getElementById(
          "answer"
        )
        .innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";

    };


  document
    .body
    .appendChild(
      script
    );

}



/* =====================================================
   ตรวจ VOICEVOX
   ===================================================== */

async function getWorkingVoicevoxURL() {

  logDebug(
    "เริ่มตรวจสอบ VOICEVOX"
  );


  for (
    const baseURL
    of VOICEVOX_URLS
  ) {

    try {

      logDebug(
        "กำลังตรวจ",
        baseURL
      );


      const response =
        await fetch(
          baseURL +
          "/version",
          {
            method:
              "GET",

            cache:
              "no-store"
          }
        );


      logDebug(
        "VOICEVOX /version ตอบกลับ",
        {
          url:
            baseURL,

          status:
            response.status,

          ok:
            response.ok
        }
      );


      if (
        response.ok
      ) {

        const version =
          await response.text();


        logDebug(
          "VOICEVOX version",
          version
        );


        return baseURL;

      }

    }

    catch (error) {

      logDebug(
        "เชื่อมต่อไม่ได้",
        {
          url:
            baseURL,

          error:
            error.message
        }
      );

    }

  }


  throw new Error(
    "เบราว์เซอร์ไม่สามารถเชื่อมต่อ VOICEVOX ได้"
  );

}



/* =====================================================
   ตรวจ Speaker
   ===================================================== */

async function checkSpeaker(
  baseURL
) {

  logDebug(
    "กำลังตรวจ Speaker ID",
    SPEAKER_ID
  );


  const response =
    await fetch(
      baseURL +
      "/speakers",
      {
        method:
          "GET",

        cache:
          "no-store"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "VOICEVOX /speakers HTTP " +
      response.status
    );

  }


  const speakers =
    await response.json();


  for (
    const speaker
    of speakers
  ) {

    for (
      const style
      of speaker.styles
    ) {

      if (
        Number(
          style.id
        ) ===
        Number(
          SPEAKER_ID
        )
      ) {

        logDebug(
          "พบ Speaker",
          {
            name:
              speaker.name,

            style:
              style.name,

            id:
              style.id
          }
        );


        return;

      }

    }

  }


  throw new Error(
    "ไม่พบ Speaker ID " +
    SPEAKER_ID
  );

}



/* =====================================================
   Text → VOICEVOX

   ใช้ AudioContext โดยตรง
   ไม่ใช้ new Audio().play()
   ===================================================== */

async function speak(text) {

  if (
    !text ||
    !text.trim()
  ) {

    return;

  }


  const cleanText =
    cleanAIText(
      text
    );


  if (!cleanText) {

    return;

  }


  const status =
    document.getElementById(
      "status"
    );


  try {

    /*
     * ตรวจและปลดล็อก AudioContext
     */

    const audioReady =
      await unlockAudio();


    if (!audioReady) {

      throw new Error(
        "ไม่สามารถเปิด AudioContext ได้"
      );

    }


    stopCurrentAudio();


    status.innerText =
      "🎙️ กำลังเชื่อมต่อ VOICEVOX...";


    /*
     * 1. หา VOICEVOX ที่ใช้งานได้
     */

    const baseURL =
      await getWorkingVoicevoxURL();


    /*
     * 2. ตรวจ Speaker
     */

    await checkSpeaker(
      baseURL
    );


    /*
     * 3. audio_query
     */

    status.innerText =
      "🎙️ กำลังสร้าง audio_query...";


    logDebug(
      "กำลังสร้าง audio_query"
    );


    const queryResponse =
      await fetch(
        baseURL +
        "/audio_query?speaker=" +
        SPEAKER_ID +
        "&text=" +
        encodeURIComponent(
          cleanText
        ),
        {
          method:
            "POST",

          cache:
            "no-store"
        }
      );


    logDebug(
      "audio_query response",
      {
        status:
          queryResponse.status,

        ok:
          queryResponse.ok
      }
    );


    if (
      !queryResponse.ok
    ) {

      const errorText =
        await queryResponse.text();


      throw new Error(
        "VOICEVOX audio_query HTTP " +
        queryResponse.status +
        ": " +
        errorText
      );

    }


    const query =
      await queryResponse.json();


    /*
     * 4. ปรับเสียง
     */

    query.speedScale =
      1.0;

    query.pitchScale =
      0.02;

    query.intonationScale =
      1.08;

    query.volumeScale =
      1.0;


    /*
     * 5. synthesis
     */

    status.innerText =
      "🎙️ กำลังสร้างไฟล์เสียง WAV...";


    logDebug(
      "กำลังสร้างไฟล์เสียง WAV"
    );


    const synthesisResponse =
      await fetch(
        baseURL +
        "/synthesis?speaker=" +
        SPEAKER_ID,
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Accept":
              "audio/wav"
          },

          body:
            JSON.stringify(
              query
            )
        }
      );


    logDebug(
      "synthesis response",
      {
        status:
          synthesisResponse.status,

        ok:
          synthesisResponse.ok
      }
    );


    if (
      !synthesisResponse.ok
    ) {

      const errorText =
        await synthesisResponse.text();


      throw new Error(
        "VOICEVOX synthesis HTTP " +
        synthesisResponse.status +
        ": " +
        errorText
      );

    }


    /*
     * 6. รับ WAV
     */

    const audioBlob =
      await synthesisResponse.blob();


    logDebug(
      "ได้รับไฟล์เสียง",
      {
        size:
          audioBlob.size,

        type:
          audioBlob.type
      }
    );


    if (
      !audioBlob ||
      audioBlob.size === 0
    ) {

      throw new Error(
        "VOICEVOX ส่งไฟล์เสียงว่างกลับมา"
      );

    }


    /*
     * 7. แปลง WAV → ArrayBuffer
     */

    status.innerText =
      "🔊 กำลังเตรียมเสียง...";


    const arrayBuffer =
      await audioBlob.arrayBuffer();


    /*
     * 8. Decode WAV ด้วย AudioContext
     */

    logDebug(
      "กำลัง decode WAV"
    );


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();

    }


    const audioBuffer =
      await audioContext.decodeAudioData(
        arrayBuffer
      );


    logDebug(
      "Decode WAV สำเร็จ",
      {
        duration:
          audioBuffer.duration,

        sampleRate:
          audioBuffer.sampleRate,

        channels:
          audioBuffer.numberOfChannels
      }
    );


    /*
     * 9. สร้าง Source
     */

    const source =
      audioContext.createBufferSource();


    source.buffer =
      audioBuffer;


    /*
     * 10. เพิ่ม Gain
     */

    const gainNode =
      audioContext.createGain();


    gainNode.gain.value =
      1.0;


    source.connect(
      gainNode
    );


    gainNode.connect(
      audioContext.destination
    );


    currentAudioSource =
      source;


    /*
     * 11. เริ่มเล่น
     */

    status.innerText =
      "🔊 ずんだもん กำลังพูด...";


    logDebug(
      "เริ่มเล่นเสียง"
    );


    source.onended =
      function () {

        if (
          currentAudioSource ===
          source
        ) {

          currentAudioSource =
            null;

        }


        status.innerText =
          "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";


        logDebug(
          "เล่นเสียงเสร็จแล้ว"
        );

      };


    source.start(
      0
    );


    logDebug(
      "VOICEVOX เล่นเสียงสำเร็จ"
    );


  }

  catch (error) {

    console.error(
      "VOICEVOX ERROR:",
      error
    );


    const message =
      error &&
      error.message
        ? error.message
        : String(error);


    logDebug(
      "VOICEVOX ERROR",
      message
    );


    status.innerText =
      "❌ VOICEVOX ERROR: " +
      message;


    const answer =
      document.getElementById(
        "answer"
      );


    if (answer) {

      /*
       * ไม่เอา Error ไปต่อท้ายคำตอบ
       * เพื่อไม่ให้ AI อ่าน Error ออกเสียง
       */

      answer.innerText =
        cleanText;

    }

  }

}



/* =====================================================
   ปุ่มทดสอบ VOICEVOX
   ===================================================== */

document
  .getElementById(
    "voiceTestButton"
  )
  .addEventListener(
    "click",
    async function () {

      /*
       * สำคัญ:
       * การคลิกปุ่มนี้เป็น User Gesture
       * จึง unlock AudioContext ได้แน่นอนกว่า
       */

      await unlockAudio();


      const testText =
        "สวัสดีครับ วันนี้เรามาตรวจสอบแตงกวาญี่ปุ่นกันครับ";


      document
        .getElementById(
          "answer"
        )
        .innerText =
        testText;


      await speak(
        testText
      );

    }
  );



/* =====================================================
   Enter เพื่อส่งคำถาม
   ===================================================== */

document
  .getElementById(
    "question"
  )
  .addEventListener(
    "keydown",
    async function (event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();


        /*
         * Enter ถือเป็น User Gesture
         * ปลดล็อกเสียงก่อนเรียก AI
         */

        await unlockAudio();


        askAI(
          this.value
        );

      }

    }
  );



/* =====================================================
   เริ่มต้น
   ===================================================== */

logDebug(
  "Cucumber AI พร้อมทำงาน"
);


</script>

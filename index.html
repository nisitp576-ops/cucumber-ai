<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cucumber AI</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #1b2630 0%,
          #0f1115 45%,
          #090a0c 100%
        );

      color: white;

      font-family:
        Arial,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;
    }


    .app {

      width: 100%;

      max-width: 600px;

      padding: 30px 20px 40px;

      text-align: center;
    }


    .robot {

      font-size: 70px;

      margin-bottom: 5px;
    }


    h1 {

      margin: 0;

      font-size: 30px;

      font-weight: 600;
    }


    #status {

      margin:
        18px
        0
        30px;

      color: #aaa;

      min-height: 25px;
    }


    #micButton {

      width: 180px;

      height: 180px;

      border-radius: 50%;

      border: none;

      background: #20252b;

      color: white;

      font-size: 70px;

      cursor: pointer;

      transition: 0.2s;

      box-shadow:
        0 0 35px
        rgba(
          255,
          255,
          255,
          0.12
        );
    }


    #micButton:active {

      transform:
        scale(0.94);
    }


    #micButton.listening {

      background:
        #b71c1c;

      box-shadow:
        0 0 60px
        rgba(
          244,
          67,
          54,
          0.65
        );

      animation:
        pulse
        1.1s
        infinite;
    }


    @keyframes pulse {

      0% {
        transform:
          scale(1);
      }

      50% {
        transform:
          scale(1.06);
      }

      100% {
        transform:
          scale(1);
      }

    }


    #question {

      width: 100%;

      margin-top: 30px;

      padding: 15px;

      border-radius: 12px;

      border:
        1px solid
        #333;

      background:
        #191c20;

      color: white;

      font-size: 18px;

      outline: none;
    }


    #question::placeholder {

      color: #777;
    }


    #answer {

      margin-top: 25px;

      padding: 20px;

      border-radius: 15px;

      background:
        rgba(
          255,
          255,
          255,
          0.06
        );

      text-align: left;

      line-height: 1.7;

      font-size: 18px;

      min-height: 100px;

      white-space: pre-wrap;
    }


    .hint {

      margin-top: 20px;

      color: #666;

      font-size: 14px;
    }

  </style>

</head>


<body>


<div class="app">


  <div class="robot">
    🤖
  </div>


  <h1>
    Cucumber AI
  </h1>


  <div id="status">

    พร้อมครับ
    กดไมค์แล้วพูดได้เลย

  </div>


  <button
    id="micButton"
    type="button"
  >

    🎙️

  </button>


  <input
    id="question"
    type="text"
    placeholder="หรือพิมพ์คำถาม..."
    autocomplete="off"
  >


  <div id="answer">

    รอคำถามจากคุณ...

  </div>


  <div class="hint">

    กดไมค์ →
    พูด →
    AI วิเคราะห์ →
    AI พูดตอบ

  </div>


</div>



<script>


/* =====================================================
   URL ของ Google Apps Script
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";



/* =====================================================
   Speech Recognition
   ===================================================== */

let recognition =
  null;

let listening =
  false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;



if (!SpeechRecognition) {

  document.getElementById(
    "status"
  ).innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";


} else {


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "th-TH";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;



  recognition.onstart =
    function () {


      listening =
        true;


      document
        .getElementById(
          "micButton"
        )
        .classList
        .add(
          "listening"
        );


      document
        .getElementById(
          "status"
        )
        .innerText =
        "🎙️ กำลังฟังครับ...";

    };



  recognition.onresult =
    function (event) {


      const text =
        event
          .results[0][0]
          .transcript;


      document
        .getElementById(
          "question"
        )
        .value =
        text;


      stopListening();


      askAI(text);

    };



  recognition.onerror =
    function (event) {


      console.log(
        "Speech error:",
        event.error
      );


      stopListening();


      let message =
        "รับเสียงไม่ได้ครับ";


      if (
        event.error ===
        "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      }

      else if (
        event.error ===
        "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      }

      else if (
        event.error ===
        "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }


      document
        .getElementById(
          "status"
        )
        .innerText =
        message;

    };



  recognition.onend =
    function () {

      stopListening();

    };

}



function startListening() {


  if (!recognition) {

    return;

  }


  if (listening) {

    recognition.stop();

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    console.log(error);

  }

}



function stopListening() {


  listening =
    false;


  document
    .getElementById(
      "micButton"
    )
    .classList
    .remove(
      "listening"
    );

}



document
  .getElementById(
    "micButton"
  )
  .addEventListener(
    "click",
    startListening
  );



/* =====================================================
   ส่งคำถามไป Apps Script
   ใช้ JSONP
   ===================================================== */

function askAI(question) {


  if (
    !question ||
    !question.trim()
  ) {

    return;

  }


  document
    .getElementById(
      "status"
    )
    .innerText =
    "🤖 กำลังวิเคราะห์...";


  document
    .getElementById(
      "answer"
    )
    .innerText =
    "กำลังอ่านข้อมูลจากสวน...";



  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );



  let script =
    document.createElement(
      "script"
    );



  let completed =
    false;



  window[callbackName] =
    function (result) {


      if (completed) {

        return;

      }


      completed =
        true;



      if (
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }



      delete window[
        callbackName
      ];



      if (
        result.error
      ) {


        document
          .getElementById(
            "status"
          )
          .innerText =
          "❌ เกิดข้อผิดพลาด";


        document
          .getElementById(
            "answer"
          )
          .innerText =
          result.error;


        return;

      }



      const answer =
        result.answer ||
        "AI ไม่ได้ส่งคำตอบกลับมาครับ";


      document
        .getElementById(
          "answer"
        )
        .innerText =
        answer;


      document
        .getElementById(
          "status"
        )
        .innerText =
        "🔊 กำลังพูดตอบ...";


      speak(answer);

    };



  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      question
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );



  script.src =
    url;



  script.onerror =
    function () {


      if (completed) {

        return;

      }


      completed =
        true;


      delete window[
        callbackName
      ];



      if (
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }



      document
        .getElementById(
          "status"
        )
        .innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";


      document
        .getElementById(
          "answer"
        )
        .innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";

    };



  document
    .body
    .appendChild(
      script
    );

}



/* =====================================================
   Text → Speech
   ===================================================== */

async function speak(text) {

  if (!text || !text.trim()) {
    return;
  }

  const status =
    document.getElementById("status");

  status.innerText =
    "🎙️ กำลังสร้างเสียงตอบ...";

  try {

    // 1. ขอข้อมูลการออกเสียงจาก VOICEVOX
    const queryResponse =
      await fetch(
        "http://127.0.0.1:50021/audio_query?speaker=7&text=" +
        encodeURIComponent(text),
        {
          method: "POST"
        }
      );

    if (!queryResponse.ok) {
      throw new Error(
        "VOICEVOX audio_query HTTP " +
        queryResponse.status
      );
    }

    const query =
      await queryResponse.json();


    // 2. ปรับเสียงเล็กน้อย
    query.speedScale = 1.0;
    query.pitchScale = 0;
    query.intonationScale = 1.05;
    query.volumeScale = 1.0;


    // 3. ขอไฟล์เสียงจาก VOICEVOX
    const synthesisResponse =
      await fetch(
        "http://127.0.0.1:50021/synthesis?speaker=7",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(query)
        }
      );

    if (!synthesisResponse.ok) {
      throw new Error(
        "VOICEVOX synthesis HTTP " +
        synthesisResponse.status
      );
    }


    // 4. รับเสียง WAV
    const audioBlob =
      await synthesisResponse.blob();


    // 5. เล่นเสียง
    const audioUrl =
      URL.createObjectURL(audioBlob);

    const audio =
      new Audio(audioUrl);

    audio.volume = 1.0;


    status.innerText =
      "🔊 ずんだもんกำลังพูด...";


    audio.onended =
      function () {

        URL.revokeObjectURL(
          audioUrl
        );

        status.innerText =
          "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

      };


    audio.onerror =
      function () {

        URL.revokeObjectURL(
          audioUrl
        );

        status.innerText =
          "สร้างเสียงได้ แต่เปิดเสียงไม่ได้";

      };


    await audio.play();


  } catch (error) {

    console.error(
      "VOICEVOX error:",
      error
    );


    status.innerText =
      "⚠️ VOICEVOX เชื่อมต่อไม่ได้";


    // ถ้า VOICEVOX ใช้งานไม่ได้
    // ให้กลับไปใช้เสียงของ Browser
    if (
      "speechSynthesis" in window
    ) {

      speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(
          text
        );

      utterance.lang =
        "th-TH";

      utterance.rate =
        0.95;

      utterance.pitch =
        1;

      utterance.volume =
        1;


      utterance.onend =
        function () {

          status.innerText =
            "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

        };


      speechSynthesis.speak(
        utterance
      );

    }

  }

}


/* =====================================================
   Enter เพื่อส่งคำถาม
   ===================================================== */

document
  .getElementById(
    "question"
  )
  .addEventListener(
    "keydown",
    function (event) {


      if (
        event.key ===
        "Enter"
      ) {


        askAI(
          this.value
        );


      }

    }
  );



</script>


</body>

</html>

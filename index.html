<script>

const VOICEVOX_URL =
  "http://127.0.0.1:50021";

const VOICEVOX_SPEAKER_ID = 7;

const statusElement =

/* =====================================================
   DEBUG

function log(message, data) {

  const time =
    new Date().toLocaleTimeString("th-TH", {
      hour12: false
    });

  let line =
    "[" + time + "] " + message;

  if (data !== undefined) {

    try {
      line +=
        " | " +
        JSON.stringify(data, null, 2);
    }

    catch {
      line +=
        " | " +
        String(data);
    }
  }

  console.log(line);

  debugElement.textContent +=
    line + "\n";

  debugElement.scrollTop =
    debugElement.scrollHeight;
}


/* =====================================================
   AUDIO CONTEXT
===================================================== */

let audioContext = null;

function unlockAudio() {

  try {

    if (!audioContext) {

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (AudioContextClass) {

        audioContext =
          new AudioContextClass();

        log(
          "สร้าง AudioContext",
          {
            state:
              audioContext.state
          }
        );
      }
    }

    if (
      audioContext &&
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }

    if ("speechSynthesis" in window) {

      window.speechSynthesis.resume();

    }

    log("ปลดล็อกระบบเสียงแล้ว");

  }

  catch (error) {

    log(
      "ปลดล็อกเสียง ERROR",
      error.message
    );

  }
}


/* =====================================================
   BROWSER VOICES
===================================================== */

let browserVoices = [];
let thaiVoice = null;
let englishVoice = null;

function loadBrowserVoices() {

  if (!("speechSynthesis" in window)) {

    log(
      "Browser ไม่รองรับ speechSynthesis"
    );

    return;

  }

  browserVoices =
    window.speechSynthesis.getVoices();

  thaiVoice =
    browserVoices.find(function(voice) {

      const lang =
        String(voice.lang || "")
          .toLowerCase();

      return (
        lang === "th-th" ||
        lang.startsWith("th-") ||
        lang === "th"
      );

    }) || null;

  englishVoice =
    browserVoices.find(function(voice) {

      const lang =
        String(voice.lang || "")
          .toLowerCase();

      return (
        lang === "en-us" ||
        lang.startsWith("en-")
      );

    }) || null;


  log(
    "ตรวจ Browser Voices",
    browserVoices.length
  );


  log(
    "Thai Voice",
    thaiVoice
      ? {
          name: thaiVoice.name,
          lang: thaiVoice.lang,
          localService: thaiVoice.localService
        }
      : "ไม่พบ"
  );


  log(
    "English Voice",
    englishVoice
      ? {
          name: englishVoice.name,
          lang: englishVoice.lang,
          localService: englishVoice.localService
        }
      : "ไม่พบ"
  );
}


if ("speechSynthesis" in window) {

  loadBrowserVoices();

  window.speechSynthesis.onvoiceschanged =
    function() {

      log("Browser voices เปลี่ยนแปลง");

      loadBrowserVoices();

    };
}


/* =====================================================
   DETECT LANGUAGE
===================================================== */

function detectLanguage(text) {

  const value =
    String(text || "").trim();

  if (!value) {
    return "unknown";
  }

  const japaneseMatches =
    value.match(
      /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/g
    );

  const thaiMatches =
    value.match(
      /[\u0E00-\u0E7F]/g
    );

  const englishMatches =
    value.match(
      /[A-Za-z]/g
    );

  const japaneseCount =
    japaneseMatches
      ? japaneseMatches.length
      : 0;

  const thaiCount =
    thaiMatches
      ? thaiMatches.length
      : 0;

  const englishCount =
    englishMatches
      ? englishMatches.length
      : 0;


  log(
    "ตรวจภาษา",
    {
      thai: thaiCount,
      japanese: japaneseCount,
      english: englishCount
    }
  );


  if (
    japaneseCount > thaiCount &&
    japaneseCount > englishCount
  ) {
    return "ja";
  }


  if (
    thaiCount >= japaneseCount &&
    thaiCount >= englishCount
  ) {
    return "th";
  }


  if (englishCount > 0) {
    return "en";
  }


  return "th";
}


/* =====================================================
   BROWSER TTS
===================================================== */

function speakBrowser(text, language) {

  return new Promise(function(resolve, reject) {

    if (!("speechSynthesis" in window)) {

      reject(
        new Error(
          "เบราว์เซอร์ไม่รองรับ Speech Synthesis"
        )
      );

      return;
    }


    if (!text || !text.trim()) {

      resolve();

      return;
    }


    loadBrowserVoices();

    window.speechSynthesis.cancel();


    let selectedVoice = null;


    if (language === "th") {

      selectedVoice = thaiVoice;

      if (!selectedVoice) {

        reject(
          new Error(
            "ไม่มี Thai Voice ในเบราว์เซอร์"
          )
        );

        return;
      }
    }


    if (language === "en") {

      selectedVoice = englishVoice;

      if (!selectedVoice) {

        reject(
          new Error(
            "ไม่มี English Voice ในเบราว์เซอร์"
          )
        );

        return;
      }
    }


    const utterance =
      new SpeechSynthesisUtterance(text);


    utterance.voice =
      selectedVoice;


    utterance.lang =
      language === "th"
        ? "th-TH"
        : "en-US";


    utterance.rate = 0.95;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;


    utterance.onstart =
      function() {

        log(
          "Browser TTS เริ่มพูด",
          {
            language: language,
            voice: selectedVoice.name,
            voiceLang: selectedVoice.lang
          }
        );

        statusElement.innerText =
          "🔊 กำลังพูด...";

      };


    utterance.onend =
      function() {

        log(
          "Browser TTS พูดเสร็จแล้ว"
        );

        statusElement.innerText =
          "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

        resolve();

      };


    utterance.onerror =
      function(event) {

        log(
          "Browser TTS ERROR",
          {
            error:
              event.error,
            voice:
              selectedVoice
                ? selectedVoice.name
                : null
          }
        );

        reject(
          new Error(
            "Browser TTS: " +
            event.error
          )
        );

      };


    try {

      window.speechSynthesis.speak(
        utterance
      );

    }

    catch (error) {

      reject(error);

    }

  });
}


/* =====================================================
   GOOGLE THAI TTS
   ใช้เป็นตัวสำรองเมื่อไม่มี Thai Voice
===================================================== */

function splitThaiText(text, maxLength = 180) {

  const clean =
    String(text || "")
      .replace(/\s+/g, " ")
      .trim();

  if (!clean) {
    return [];
  }


  const sentences =
    clean.split(
      /(?<=[.!?。！？\n])/u
    );


  const chunks = [];

  let current = "";


  for (const sentence of sentences) {

    const part =
      sentence.trim();

    if (!part) {
      continue;
    }


    if (
      (current + " " + part).trim().length
      <= maxLength
    ) {

      current =
        (current + " " + part).trim();

    }

    else {

      if (current) {
        chunks.push(current);
      }

      if (part.length <= maxLength) {

        current = part;

      }

      else {

        for (
          let i = 0;
          i < part.length;
          i += maxLength
        ) {

          chunks.push(
            part.substring(
              i,
              i + maxLength
            )
          );
        }

        current = "";
      }
    }
  }


  if (current) {
    chunks.push(current);
  }


  return chunks;
}


/* =====================================================
   GOOGLE TTS URL
===================================================== */

function createGoogleThaiTTSUrl(text) {

  return (
    "https://translate.google.com/translate_tts" +
    "?ie=UTF-8" +
    "&client=tw-ob" +
    "&tl=th" +
    "&q=" +
    encodeURIComponent(text) +
    "&_=" +
    Date.now()
  );

}


/* =====================================================
   ตรวจว่า Audio โหลดได้จริง
===================================================== */

function testAudioUrl(url) {

  return new Promise(function(resolve, reject) {

    const audio =
      new Audio();

    let finished = false;


    const cleanup =
      function() {

        audio.onloadedmetadata = null;
        audio.oncanplay = null;
        audio.onerror = null;
        audio.onabort = null;

      };


    const fail =
      function(message) {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        reject(
          new Error(message)
        );

      };


    const success =
      function() {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        resolve(audio);

      };


    audio.preload = "auto";
    audio.volume = 1.0;
    audio.muted = false;


    audio.onloadedmetadata =
      function() {

        log(
          "Google TTS metadata",
          {
            duration:
              audio.duration
          }
        );

      };


    audio.oncanplay =
      function() {

        log(
          "Google TTS audio พร้อมเล่น"
        );

        success();

      };


    audio.onerror =
      function() {

        const mediaError =
          audio.error;

        let detail =
          "HTML Audio error";


        if (mediaError) {

          detail =
            "code=" +
            mediaError.code;

          if (mediaError.message) {

            detail +=
              " " +
              mediaError.message;

          }
        }


        fail(detail);

      };


    audio.onabort =
      function() {

        fail(
          "Audio ถูกยกเลิก"
        );

      };


    audio.src = url;

    audio.load();

  });
}


/* =====================================================
   เล่น Google Thai TTS
===================================================== */

async function playGoogleThaiChunk(
  text,
  part,
  total
) {

  log(
    "สร้างเสียงไทย",
    {
      part:
        part + "/" + total,
      length:
        text.length
    }
  );


  const url =
    createGoogleThaiTTSUrl(text);


  log(
    "Google TTS URL พร้อม"
  );


  let audio = null;


  try {

    audio =
      await testAudioUrl(url);

  }

  catch (error) {

    log(
      "Google TTS โหลดเสียง ERROR",
      error.message
    );

    throw new Error(
      "Google Thai TTS โหลดไฟล์เสียงไม่ได้: " +
      error.message
    );

  }


  return new Promise(function(resolve, reject) {

    let ended = false;


    const cleanup =
      function() {

        audio.onended = null;
        audio.onerror = null;
        audio.onpause = null;

      };


    audio.onended =
      function() {

        if (ended) {
          return;
        }

        ended = true;

        cleanup();

        log(
          "Thai TTS เล่นเสร็จ",
          {
            part:
              part + "/" + total
          }
        );

        resolve();

      };


    audio.onerror =
      function() {

        if (ended) {
          return;
        }

        ended = true;

        cleanup();

        reject(
          new Error(
            "HTML Audio error ขณะเล่น"
          )
        );

      };


    audio.onplay =
      function() {

        log(
          "Thai TTS เริ่มเล่น",
          {
            part:
              part + "/" + total
          }
        );

        statusElement.innerText =
          "🔊 กำลังพูดภาษาไทย... " +
          part +
          "/" +
          total;

      };


    audio.volume = 1.0;
    audio.muted = false;


    audio.play()
      .then(function() {

        log(
          "audio.play() สำเร็จ",
          {
            paused:
              audio.paused,
            muted:
              audio.muted,
            volume:
              audio.volume
          }
        );

      })
      .catch(function(error) {

        cleanup();

        reject(
          new Error(
            "Browser ไม่อนุญาตให้เล่น Google TTS: " +
            error.message
          )
        );

      });

  });

}


/* =====================================================
   GOOGLE THAI TTS MAIN
===================================================== */

async function speakGoogleThai(text) {

  const chunks =
    splitThaiText(text, 180);


  if (!chunks.length) {

    return;

  }


  log(
    "เริ่ม Google Thai TTS",
    {
      chunks:
        chunks.length
    }
  );


  for (
    let i = 0;
    i < chunks.length;
    i++
  ) {

    await playGoogleThaiChunk(
      chunks[i],
      i + 1,
      chunks.length
    );

  }


  statusElement.innerText =
    "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

  log(
    "Google Thai TTS พูดเสร็จทั้งหมด"
  );
}


/* =====================================================
   VOICEVOX
===================================================== */

async function speakVoicevox(text) {

  statusElement.innerText =
    "🎙️ กำลังสร้างเสียง VOICEVOX...";


  log(
    "เริ่มสร้างเสียง VOICEVOX",
    {
      speaker:
        VOICEVOX_SPEAKER_ID,
      text:
        text
    }
  );


  /* VERSION */

  const versionResponse =
    await fetch(
      VOICEVOX_URL + "/version",
      {
        method: "GET"
      }
    );


  if (!versionResponse.ok) {

    throw new Error(
      "VOICEVOX /version HTTP " +
      versionResponse.status
    );

  }


  const version =
    await versionResponse.text();


  log(
    "VOICEVOX version",
    version
  );


  /* SPEAKERS */

  const speakersResponse =
    await fetch(
      VOICEVOX_URL + "/speakers",
      {
        method: "GET"
      }
    );


  if (!speakersResponse.ok) {

    throw new Error(
      "VOICEVOX /speakers HTTP " +
      speakersResponse.status
    );

  }


  const speakers =
    await speakersResponse.json();


  let speakerFound = null;


  for (const speaker of speakers) {

    if (!speaker.styles) {
      continue;
    }


    for (const style of speaker.styles) {

      if (
        style.id ===
        VOICEVOX_SPEAKER_ID
      ) {

        speakerFound = {
          name:
            speaker.name,
          style:
            style.name,
          id:
            style.id
        };

      }

    }
  }


  if (!speakerFound) {

    throw new Error(
      "ไม่พบ VOICEVOX Speaker ID " +
      VOICEVOX_SPEAKER_ID
    );

  }


  log(
    "พบ Speaker",
    speakerFound
  );


  /* AUDIO QUERY */

  const queryResponse =
    await fetch(
      VOICEVOX_URL +
      "/audio_query?speaker=" +
      VOICEVOX_SPEAKER_ID +
      "&text=" +
      encodeURIComponent(text),
      {
        method: "POST"
      }
    );


  log(
    "audio_query response",
    {
      status:
        queryResponse.status,
      ok:
        queryResponse.ok
    }
  );


  if (!queryResponse.ok) {

    const errorText =
      await queryResponse.text();

    throw new Error(
      "VOICEVOX audio_query HTTP " +
      queryResponse.status +
      ": " +
      errorText
    );

  }


  const query =
    await queryResponse.json();


  query.speedScale = 1.0;
  query.pitchScale = 0.02;
  query.intonationScale = 1.08;
  query.volumeScale = 1.0;


  /* SYNTHESIS */

  log(
    "กำลังสร้างไฟล์เสียง WAV"
  );


  const synthesisResponse =
    await fetch(
      VOICEVOX_URL +
      "/synthesis?speaker=" +
      VOICEVOX_SPEAKER_ID,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          "Accept":
            "audio/wav"
        },

        body:
          JSON.stringify(query)
      }
    );


  log(
    "synthesis response",
    {
      status:
        synthesisResponse.status,
      ok:
        synthesisResponse.ok
    }
  );


  if (!synthesisResponse.ok) {

    const errorText =
      await synthesisResponse.text();

    throw new Error(
      "VOICEVOX synthesis HTTP " +
      synthesisResponse.status +
      ": " +
      errorText
    );

  }


  const audioBlob =
    await synthesisResponse.blob();


  log(
    "ได้รับไฟล์เสียง VOICEVOX",
    {
      size:
        audioBlob.size,
      type:
        audioBlob.type
    }
  );


  if (
    !audioBlob ||
    audioBlob.size === 0
  ) {

    throw new Error(
      "VOICEVOX ส่งไฟล์เสียงว่าง"
    );

  }


  const audioUrl =
    URL.createObjectURL(audioBlob);


  const audio =
    new Audio(audioUrl);


  audio.volume = 1.0;
  audio.muted = false;
  audio.preload = "auto";


  return new Promise(function(resolve, reject) {

    let finished = false;


    const cleanup =
      function() {

        audio.onended = null;
        audio.onerror = null;

      };


    audio.onplay =
      function() {

        log(
          "VOICEVOX เริ่มเล่นเสียง"
        );

        statusElement.innerText =
          "🔊 ずんだもん กำลังพูด...";

      };


    audio.onended =
      function() {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        URL.revokeObjectURL(
          audioUrl
        );

        log(
          "VOICEVOX พูดเสร็จแล้ว"
        );

        statusElement.innerText =
          "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

        resolve();

      };


    audio.onerror =
      function() {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        URL.revokeObjectURL(
          audioUrl
        );

        reject(
          new Error(
            "เปิดไฟล์เสียง VOICEVOX ไม่ได้"
          )
        );

      };


    audio.play()
      .then(function() {

        log(
          "VOICEVOX audio.play() สำเร็จ",
          {
            paused:
              audio.paused,
            muted:
              audio.muted,
            volume:
              audio.volume
          }
        );

      })
      .catch(function(error) {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        URL.revokeObjectURL(
          audioUrl
        );

        reject(error);

      });

  });
}


/* =====================================================
   SPEAK MAIN
===================================================== */

async function speak(text) {

  if (
    !text ||
    !text.trim()
  ) {
    return;
  }


  unlockAudio();


  const language =
    detectLanguage(text);


  log(
    "เลือกระบบเสียง",
    {
      language:
        language
    }
  );


  try {

    /* =========================
       THAI
    ========================= */

    if (language === "th") {

      loadBrowserVoices();


      if (thaiVoice) {

        log(
          "พบ Thai Voice → ใช้ Browser TTS",
          {
            name:
              thaiVoice.name,
            lang:
              thaiVoice.lang
          }
        );


        await speakBrowser(
          text,
          "th"
        );


        return;
      }


      /*
        ไม่มี Thai Voice
        → ใช้ Google Thai TTS
      */

      log(
        "ไม่พบ Thai Voice → ใช้ Google Thai TTS"
      );


      try {

        await speakGoogleThai(
          text
        );


        return;

      }

      catch (googleError) {

        log(
          "Google Thai TTS ERROR",
          googleError.message
        );


        throw new Error(
          "❌ ไม่สามารถพูดภาษาไทยได้\n\n" +
          "ไม่พบ Thai Voice ใน Browser และ Google Thai TTS ก็เล่นเสียงไม่ได้\n\n" +
          "สาเหตุล่าสุด:\n" +
          googleError.message
        );

      }
    }


    /* =========================
       JAPANESE
    ========================= */

    if (language === "ja") {

      log(
        "ภาษาญี่ปุ่น → VOICEVOX ID 7"
      );


      await speakVoicevox(
        text
      );


      return;
    }


    /* =========================
       ENGLISH
    ========================= */

    if (language === "en") {

      loadBrowserVoices();


      if (!englishVoice) {

        throw new Error(
          "ไม่พบ English Voice ใน Browser"
        );

      }


      log(
        "ภาษาอังกฤษ → Browser TTS",
        {
          voice:
            englishVoice.name
        }
      );


      await speakBrowser(
        text,
        "en"
      );


      return;
    }


    throw new Error(
      "ไม่สามารถตรวจภาษาได้"
    );

  }

  catch (error) {

    log(
      "ระบบเสียง ERROR",
      {
        message:
          error.message
      }
    );


    statusElement.innerText =
      "❌ ระบบเสียงมีปัญหา";


    answerElement.innerText =
      answerElement.innerText +
      "\n\n[VOICE ERROR]\n" +
      error.message;

  }
}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

let recognition = null;
let listening = false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  statusElement.innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";

  log(
    "ไม่พบ SpeechRecognition"
  );

}

else {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "th-TH";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      listening = true;

      micButton.classList.add(
        "listening"
      );

      statusElement.innerText =
        "🎙️ กำลังฟังครับ...";

      log(
        "เริ่มรับเสียง"
      );

    };


  recognition.onresult =
    function(event) {

      const text =
        event.results[0][0].transcript;


      questionElement.value =
        text;


      log(
        "รับคำถามจากไมค์",
        text
      );


      stopListening();

      askAI(text);

    };


  recognition.onerror =
    function(event) {

      log(
        "Speech Recognition ERROR",
        event.error
      );


      stopListening();


      let message =
        "รับเสียงไม่ได้ครับ";


      if (
        event.error === "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      }

      else if (
        event.error === "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      }

      else if (
        event.error === "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }


      statusElement.innerText =
        message;

    };


  recognition.onend =
    function() {

      stopListening();

    };

}


function startListening() {

  unlockAudio();


  if (!recognition) {
    return;
  }


  if (listening) {

    recognition.stop();

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    log(
      "เริ่มไมค์ ERROR",
      error.message
    );

  }
}


function stopListening() {

  listening = false;

  micButton.classList.remove(
    "listening"
  );
}


micButton.addEventListener(
  "click",
  function() {

    unlockAudio();

    startListening();

  }
);


/* =====================================================
   GEMINI / APPS SCRIPT JSONP
===================================================== */

function askAI(question) {

  if (
    !question ||
    !question.trim()
  ) {

    return;
  }


  unlockAudio();


  const cleanQuestion =
    question.trim();


  log(
    "ส่งคำถาม",
    cleanQuestion
  );


  statusElement.innerText =
    "🤖 กำลังวิเคราะห์...";


  answerElement.innerText =
    "กำลังอ่านข้อมูลจากสวน...";


  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      "script"
    );


  let completed = false;


  window[callbackName] =
    function(result) {

      if (completed) {
        return;
      }


      completed = true;


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      delete window[callbackName];


      if (!result) {

        statusElement.innerText =
          "❌ AI ไม่ส่งข้อมูลกลับมา";

        answerElement.innerText =
          "ไม่ได้รับคำตอบจาก AI";

        return;

      }


      if (result.error) {

        log(
          "AI ERROR",
          result.error
        );


        statusElement.innerText =
          "❌ เกิดข้อผิดพลาด";


        answerElement.innerText =
          result.error;


        return;

      }


      const answer =
        result.answer ||
        "AI ไม่ได้ส่งคำตอบกลับมาครับ";


      log(
        "AI ตอบกลับแล้ว",
        {
          length:
            answer.length
        }
      );


      answerElement.innerText =
        answer;


      /*
        สำคัญ:
        เรียก speak หลัง Gemini ตอบ
      */

      unlockAudio();


      speak(answer);

    };


  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      cleanQuestion
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src = url;


  script.onerror =
    function() {

      if (completed) {
        return;
      }


      completed = true;


      delete window[
        callbackName
      ];


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      log(
        "เชื่อมต่อ Apps Script ERROR"
      );


      statusElement.innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";


      answerElement.innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";

    };


  document.body.appendChild(
    script
  );
}


/* =====================================================
   ENTER = SEND
===================================================== */

questionElement.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      unlockAudio();

      askAI(
        this.value
      );

    }

  }
);


/* =====================================================
   PAGE CLICK
===================================================== */

document.addEventListener(
  "click",
  function() {

    unlockAudio();

  }
);


/* =====================================================
   STARTUP
===================================================== */

log(
  "Cucumber AI พร้อมทำงาน"
);

log(
  "โหมดเสียง",
  {
    thai:
      "Thai Voice → Google Thai TTS fallback",
    japanese:
      "VOICEVOX ID 7",
    english:
      "Browser English TTS"
  }
);

</script>

</body>
</html>

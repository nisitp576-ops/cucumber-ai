<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cucumber AI 🌸</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: "Segoe UI", "Prompt", Arial, sans-serif;
  color: #fff;
  overflow-x: hidden;
  min-height: 100vh;
  /* ภาพจริง + ชั้นมืดทับให้อ่านง่าย */
  background:
    linear-gradient(180deg, rgba(15,8,35,0.35), rgba(30,12,50,0.55)),
    url("bg.webp.jpg") center / cover no-repeat fixed;
}
@media (max-width: 768px) {
  body { background-attachment: scroll; }
}

/* ===== โคมไฟลอย ===== */
.lantern {
  position: fixed;
  bottom: -80px;
  z-index: 3;
  pointer-events: none;
  animation: lanternRise linear infinite;
  filter: drop-shadow(0 0 18px rgba(255,180,90,0.75));
}
@keyframes lanternRise {
  0%   { transform: translateY(0) translateX(0) rotate(-3deg); opacity: 0; }
  8%   { opacity: 1; }
  50%  { transform: translateY(-55vh) translateX(30px) rotate(3deg); }
  92%  { opacity: 1; }
  100% { transform: translateY(-110vh) translateX(-20px) rotate(-2deg); opacity: 0; }
}

/* ===== กลีบซากุระ ===== */
#petals {
  position: fixed; inset: 0;
  z-index: 4; pointer-events: none;
}

/* ===== กิ่งซากุระ ===== */
.branch {
  position: fixed; top: -20px;
  z-index: 5; pointer-events: none;
  filter: drop-shadow(0 4px 12px rgba(255,150,190,0.3));
}
.branch.left  { left: -40px; transform-origin: top left; animation: swayL 7s ease-in-out infinite; }
.branch.right { right: -40px; transform: scaleX(-1); transform-origin: top right; animation: swayR 8.5s ease-in-out infinite; }
@keyframes swayL { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(2.5deg);} }
@keyframes swayR { 0%,100%{transform:scaleX(-1) rotate(0deg);} 50%{transform:scaleX(-1) rotate(2.5deg);} }

/* ===== เนื้อหา ===== */
.app {
  position: relative;
  z-index: 10;
  max-width: 560px;
  margin: 0 auto;
  padding: 44px 20px 56px;
  text-align: center;
}

.card {
  position: relative;
  background: rgba(25, 12, 48, 0.5);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 28px;
  padding: 34px 26px;
  box-shadow:
    0 24px 70px rgba(10, 3, 25, 0.65),
    inset 0 1px 0 rgba(255,255,255,0.15);
}
.card::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: 28px;
  padding: 1.5px;
  background: linear-gradient(135deg, rgba(255,170,210,0.7), rgba(180,140,255,0.25), rgba(255,200,230,0.6));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.robot {
  width: 86px; height: 86px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,200,230,0.3), rgba(140,80,180,0.25));
  border: 1px solid rgba(255,190,220,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 46px;
  animation: float 4s ease-in-out infinite;
  box-shadow: 0 0 35px rgba(255,150,200,0.35);
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-9px); }
}

h1 {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 1.5px;
  background: linear-gradient(90deg, #ffd9ea, #ffb3d9, #d9b3ff, #ffd9ea);
  background-size: 250% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shimmer 5s linear infinite;
}
@keyframes shimmer {
  to { background-position: 250% center; }
}
.subtitle { margin-top: 6px; color: #eecfe4; font-size: 15px; letter-spacing: 0.5px; }

#status {
  margin: 18px 0 20px;
  color: #f2d8ea;
  min-height: 24px;
  font-size: 15px;
}

#micButton {
  width: 152px; height: 152px;
  border-radius: 50%;
  border: 2px solid rgba(255,175,210,0.55);
  background: radial-gradient(circle at 35% 30%, rgba(255,195,225,0.28), rgba(130,70,150,0.3));
  color: white; font-size: 56px; cursor: pointer;
  transition: 0.25s;
  box-shadow:
    0 0 45px rgba(255,145,195,0.4),
    inset 0 0 28px rgba(255,185,220,0.18);
}
#micButton:hover { transform: scale(1.05); box-shadow: 0 0 65px rgba(255,155,205,0.6); }
#micButton:active { transform: scale(0.94); }
#micButton.listening {
  background: radial-gradient(circle at 35% 30%, #ff8fb0, #c04a80);
  border-color: #ffc0d8;
  box-shadow: 0 0 80px rgba(255,95,150,0.85);
  animation: pulse 1.1s infinite;
}
@keyframes pulse {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.07); }
  100% { transform: scale(1); }
}
.micLabel { margin-top: 10px; color: #f0cfe4; font-size: 14px; letter-spacing: 0.5px; }

#question {
  width: 100%; margin-top: 24px; padding: 15px 18px;
  border-radius: 14px;
  border: 1px solid rgba(255,190,220,0.35);
  background: rgba(255,255,255,0.08);
  color: white; font-size: 17px; outline: none;
  transition: 0.25s;
}
#question::placeholder { color: rgba(255,220,238,0.5); }
#question:focus {
  border-color: #ffb8d8;
  box-shadow: 0 0 20px rgba(255,155,205,0.4);
  background: rgba(255,255,255,0.13);
}

#answer {
  margin-top: 20px; padding: 20px;
  border-radius: 16px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,190,220,0.2);
  text-align: left;
  line-height: 1.75; font-size: 17px;
  min-height: 90px; white-space: pre-wrap;
}

.hint { margin-top: 18px; color: rgba(255,222,238,0.6); font-size: 13px; }

#debug {
  margin-top: 20px; padding: 14px;
  border-radius: 12px;
  background: rgba(8, 4, 20, 0.6);
  color: #cdb6de;
  text-align: left;
  font-family: Consolas, monospace; font-size: 11.5px; line-height: 1.5;
  max-height: 200px; overflow-y: auto; white-space: pre-wrap;
  border: 1px solid rgba(255,190,220,0.12);
}

@media (max-width: 480px) {
  #micButton { width: 122px; height: 122px; font-size: 44px; }
  .card { padding: 26px 16px; }
}
</style>

<body>

<!-- กลีบซากุระ -->
<canvas id="petals"></canvas>

<div class="app">
  <div class="card">
    <div class="robot">🤖</div>
    <h1>Cucumber AI</h1>
    <div class="subtitle">🌸 ผู้ช่วยดูแลสวนแตงกวา ・ 夜桜</div>

    <div id="status">ระบบพร้อมทำงาน</div>

    <button id="micButton" type="button">🎙️</button>
    <div class="micLabel">แตะเพื่อพูด</div>

    <input id="question" type="text" placeholder="หรือพิมพ์คำถาม..." autocomplete="off">
    <div id="answer">รอคำถามจากคุณ...</div>

    <div class="hint">🌸 กดไมค์ → พูด → Gemini วิเคราะห์ → AI พูดตอบ</div>

    <div id="debug"></div>
  </div>

<script>
/* ================= CONFIG ================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";
const AI_TIMEOUT_MS = 25000;
const TTS_TIMEOUT_MS = 60000;

/* ================= ELEMENTS ================= */
const statusElement = document.getElementById("status");
const answerElement = document.getElementById("answer");
const questionElement = document.getElementById("question");
const micButton = document.getElementById("micButton");
const debugElement = document.getElementById("debug");

/* ================= SAKURA PETALS (2 ชั้น depth) ================= */
(function () {
  const canvas = document.getElementById("petals");
  const ctx = canvas.getContext("2d");
  let petals = [];

  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener("resize", resize); resize();

  const COUNT = Math.min(60, Math.floor(innerWidth / 18));
  const COLORS = ["#ffc4d6", "#ffb0cc", "#ffd6e4", "#f9a8c4", "#ffe0ec"];

  function newPetal(front) {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      size: front ? 7 + Math.random() * 9 : 4 + Math.random() * 5,
      speedY: front ? 1.0 + Math.random() * 1.6 : 0.5 + Math.random() * 0.8,
      drift: 0.4 + Math.random() * 1.0,
      phase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.05,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      opacity: front ? 0.7 + Math.random() * 0.3 : 0.3 + Math.random() * 0.3,
      blur: front ? 0 : 1
    };
  }

  for (let i = 0; i < COUNT; i++) {
    const p = newPetal(i % 2 === 0);
    p.y = Math.random() * canvas.height;
    petals.push(p);
  }

  function drawPetal(p) {
    ctx.save();
    if (p.blur) ctx.filter = "blur(1.5px)";
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = p.color;
    ctx.shadowColor = "rgba(255,170,205,0.5)";
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(0, -p.size / 2);
    ctx.bezierCurveTo(p.size / 2, -p.size / 2, p.size / 2, p.size / 3, 0, p.size / 2);
    ctx.bezierCurveTo(-p.size / 2, p.size / 3, -p.size / 2, -p.size / 2, 0, -p.size / 2);
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < petals.length; i++) {
      const p = petals[i];
      p.phase += 0.015;
      p.y += p.speedY;
      p.x += Math.sin(p.phase) * p.drift;
      p.rot += p.rotSpeed;
      if (p.y > canvas.height + 20) petals[i] = newPetal(i % 2 === 0);
      drawPetal(p);
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

/* ================= DEBUG ================= */
function log(message, data) {
  const time = new Date().toLocaleTimeString("th-TH", { hour12: false });
  let line = "[" + time + "] " + message;
  if (data !== undefined) {
    try { line += " | " + JSON.stringify(data); }
    catch (e) { line += " | " + String(data); }
  }
  console.log(line);
  debugElement.textContent += line + "\n";
  if (debugElement.textContent.length > 30000) {
    debugElement.textContent = debugElement.textContent.slice(-15000);
  }
  debugElement.scrollTop = debugElement.scrollHeight;
}

/* ================= AUDIO UNLOCK ================= */
let audioContext = null;
function unlockAudio() {
  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === "suspended") audioContext.resume();
  } catch (e) { log("unlockAudio ERROR", e.message); }
}

/* ================= BROWSER VOICES ================= */
let thaiVoice = null;
let englishVoice = null;

function loadBrowserVoices() {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  thaiVoice = voices.find(v => v.lang && v.lang.toLowerCase() === "th-th")
    || voices.find(v => v.lang && v.lang.toLowerCase().startsWith("th"))
    || voices.find(v => (v.name + " " + v.lang).toLowerCase().includes("thai"))
    || null;
  englishVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) || null;
  log("Voices", { thai: thaiVoice ? thaiVoice.name : "ไม่พบ", english: englishVoice ? englishVoice.name : "ไม่พบ" });
}
if ("speechSynthesis" in window) {
  loadBrowserVoices();
  window.speechSynthesis.onvoiceschanged = loadBrowserVoices;
}

/* ================= DETECT LANGUAGE ================= */
function detectLanguage(text) {
  const value = String(text || "").trim();
  if (!value) return "unknown";
  const count = (re) => (value.match(re) || []).length;
  const kana = count(/[\u3040-\u30ff]/g);
  const cjk = count(/[\u3400-\u4dbf\u4e00-\u9fff]/g);
  const thai = count(/[\u0E00-\u0E7F]/g);
  const eng = count(/[A-Za-z]/g);
  const jp = kana + cjk;
  if (kana > 0 && kana >= thai) return "ja";
  if (cjk > 0 && kana === 0 && cjk > thai && cjk >= eng) return "zh";
  if (jp > thai && jp > eng) return "ja";
  if (thai >= jp && thai >= eng) return "th";
  if (eng > 0) return "en";
  return "th";
}

/* ================= SPLIT TEXT ================= */
function splitSentences(clean) {
  const result = [];
  let current = "";
  for (let i = 0; i < clean.length; i++) {
    current += clean[i];
    if (".!?。！？".indexOf(clean[i]) !== -1) {
      result.push(current.trim());
      current = "";
    }
  }
  if (current.trim()) result.push(current.trim());
  return result.filter(s => s.length > 0);
}

function splitText(text, maxLength) {
  maxLength = maxLength || 450;
  const clean = String(text || "").replace(/\s+/g, " ").trim();
  if (clean.length <= maxLength) return [clean];
  const result = [];
  let current = "";
  for (const sentence of splitSentences(clean)) {
    if ((current + " " + sentence).trim().length <= maxLength) {
      current = (current + " " + sentence).trim();
    } else {
      if (current) { result.push(current); current = ""; }
      if (sentence.length > maxLength) {
        let start = 0;
        while (start < sentence.length) {
          result.push(sentence.substring(start, start + maxLength));
          start += maxLength;
        }
      } else {
        current = sentence;
      }
    }
  }
  if (current) result.push(current);
  return result;
}

/* ================= BROWSER TTS ================= */
function speakBrowser(text, language) {
  return new Promise(function (resolve, reject) {
    if (!("speechSynthesis" in window)) {
      reject(new Error("Browser ไม่รองรับ Speech Synthesis"));
      return;
    }
    if (!text || !text.trim()) { resolve(); return; }

    window.speechSynthesis.cancel();
    loadBrowserVoices();

    if (language === "th" && !thaiVoice) {
      reject(new Error("ไม่พบ Thai Voice ใน Browser"));
      return;
    }

    const utterance = new SpeechSynthesisUtterance(text);
    if (language === "th") {
      utterance.lang = "th-TH";
      utterance.voice = thaiVoice;
    } else {
      utterance.lang = language === "zh" ? "zh-CN" : language === "ja" ? "ja-JP" : "en-US";
      if (englishVoice && language === "en") utterance.voice = englishVoice;
    }
    utterance.rate = 0.95;

    let finished = false;
    let safetyTimer = null;

    function finish() {
      if (finished) return;
      finished = true;
      if (safetyTimer) clearTimeout(safetyTimer);
      statusElement.innerText = "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";
      resolve();
    }

    utterance.onstart = function () { statusElement.innerText = "🔊 กำลังพูด..."; };
    utterance.onend = finish;
    utterance.onerror = function (event) {
      if (finished) return;
      finished = true;
      if (safetyTimer) clearTimeout(safetyTimer);
      reject(new Error("Browser TTS: " + event.error));
    };

    safetyTimer = setTimeout(function () {
      window.speechSynthesis.cancel();
      finish();
    }, text.length * 120 + 5000);

    window.speechSynthesis.speak(utterance);
  });
}

/* ================= SERVER TTS (ผ่าน Apps Script) ============ */

function fetchServerTTS(text) {
  return new Promise(function (resolve, reject) {
    const callbackName = "ttsCb_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const script = document.createElement("script");
    let completed = false;

    function cleanup() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    const timer = setTimeout(function () {
      if (completed) return;
      completed = true;
      cleanup();
      reject(new Error("TTS timeout"));
    }, TTS_TIMEOUT_MS);

    window[callbackName] = function (result) {
      if (completed) return;
      completed = true;
      clearTimeout(timer);
      cleanup();

      if (!result || result.error) {
        reject(new Error(result ? result.error : "TTS ไม่ตอบกลับ"));
        return;
      }
      resolve(result.audio);
    };

    script.src = APPS_SCRIPT_URL +
      "?action=tts&text=" + encodeURIComponent(text) +
      "&callback=" + encodeURIComponent(callbackName);
    script.onerror = function () {
      if (completed) return;
      completed = true;
      clearTimeout(timer);
      cleanup();
      reject(new Error("เชื่อมต่อ TTS server ไม่ได้"));
    };
    document.body.appendChild(script);
  });
}

function playBase64Mp3(base64) {
  return new Promise(function (resolve, reject) {
    try {
      const byteString = atob(base64);
      const bytes = new Uint8Array(byteString.length);
      for (let i = 0; i < byteString.length; i++) {
        bytes[i] = byteString.charCodeAt(i);
      }
      const blob = new Blob([bytes], { type: "audio/wav" });
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.volume = 1.0;

      audio.onended = function () {
        URL.revokeObjectURL(url);
        resolve();
      };
      audio.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("เล่นไฟล์เสียงไม่ได้"));
      };
      audio.play().catch(function (e) {
        URL.revokeObjectURL(url);
        reject(e);
      });
    } catch (e) {
      reject(e);
    }
  });
}

async function speakThaiServer(text) {
  const chunks = splitText(text, 450);
  if (!chunks.length) return;
  log("Server Thai TTS", { chunks: chunks.length });

  statusElement.innerText = "🔊 กำลังสร้างเสียงไทย (" + chunks.length + " ส่วน)...";

  const promises = chunks.map(function (chunk, i) {
    log("TTS request", { part: i + 1, len: chunk.length });
    return fetchServerTTS(chunk);
  });

  const results = await Promise.all(promises);

  for (let i = 0; i < results.length; i++) {
    statusElement.innerText = "🔊 กำลังพูดภาษาไทย " + (i + 1) + "/" + results.length + "...";
    await playBase64Mp3(results[i]);
  }

  statusElement.innerText = "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";
}

/* ================= MAIN SPEAK ================= */
async function speak(text) {
  if (!text || !text.trim()) return;
  unlockAudio();
  const language = detectLanguage(text);
  log("เลือกระบบเสียง", { language: language });

  try {
    if (language === "th") {
      try {
        await speakThaiServer(text);
        return;
      } catch (serverError) {
        log("Server TTS ERROR", serverError.message);
        loadBrowserVoices();
        if (thaiVoice) {
          log("fallback → Browser Thai Voice");
          await speakBrowser(text, "th");
          return;
        }
        throw serverError;
      }
    }
    if (language === "ja") { await speakBrowser(text, "ja"); return; }
    if (language === "zh") { await speakBrowser(text, "zh"); return; }
    if (language === "en") { await speakBrowser(text, "en"); return; }
    await speakThaiServer(text);
  } catch (error) {
    log("ระบบเสียง ERROR", error.message);
    statusElement.innerText = "❌ ระบบเสียงมีปัญหา";
    answerElement.innerText += "\n\n[VOICE ERROR]\n" + error.message;
  }
}

/* ================= SPEECH RECOGNITION ================= */
let recognition = null;
let listening = false;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  statusElement.innerText = "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";
} else {
  recognition = new SpeechRecognition();
  recognition.lang = "th-TH";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function () {
    listening = true;
    micButton.classList.add("listening");
    statusElement.innerText = "🎙️ กำลังฟังครับ...";
  };
  recognition.onresult = function (event) {
    const text = event.results[0][0].transcript;
    questionElement.value = text;
    log("รับคำถามจากไมค์", text);
    stopListening();
    askAI(text);
  };
  recognition.onerror = function (event) {
    stopListening();
    let message = "รับเสียงไม่ได้ครับ";
    if (event.error === "not-allowed") message = "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";
    else if (event.error === "no-speech") message = "ไม่ได้ยินเสียงพูดครับ";
    else if (event.error === "network") message = "ระบบรับเสียงมีปัญหาเครือข่ายครับ";
    statusElement.innerText = message;
  };
  recognition.onend = function () { stopListening(); };
}

function startListening() {
  unlockAudio();
  if (!recognition) return;
  if (listening) { recognition.stop(); return; }
  try { recognition.start(); }
  catch (error) { log("เริ่มไมค์ ERROR", error.message); }
}
function stopListening() {
  listening = false;
  micButton.classList.remove("listening");
}

micButton.addEventListener("click", function () {
  unlockAudio();
  startListening();
});

/* ================= ASK AI (JSONP) ================= */
function askAI(question) {
  if (!question || !question.trim()) return;
  unlockAudio();

  const cleanQuestion = question.trim();
  log("ส่งคำถาม", cleanQuestion);
  statusElement.innerText = "🤖 กำลังวิเคราะห์...";
  answerElement.innerText = "กำลังอ่านข้อมูลจากสวน...";

  const callbackName = "aiCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
  const script = document.createElement("script");
  let completed = false;

  function cleanupScript() {
    delete window[callbackName];
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  window[callbackName] = function (result) {
    if (completed) return;
    completed = true;
    cleanupScript();

    if (!result) {
      statusElement.innerText = "❌ AI ไม่ส่งข้อมูลกลับมา";
      answerElement.innerText = "ไม่ได้รับคำตอบจาก AI";
      return;
    }
    if (result.error) {
      statusElement.innerText = "❌ เกิดข้อผิดพลาด";
      answerElement.innerText = result.error;
      return;
    }

    const answer = result.answer || "AI ไม่ได้ส่งคำตอบกลับมาครับ";
    answerElement.innerText = answer;
    unlockAudio();
    speak(answer);
  };

  script.src = APPS_SCRIPT_URL +
    "?action=ask&question=" + encodeURIComponent(cleanQuestion) +
    "&callback=" + encodeURIComponent(callbackName);

  script.onerror = function () {
    if (completed) return;
    completed = true;
    cleanupScript();
    statusElement.innerText = "❌ เชื่อมต่อ AI ไม่สำเร็จ";
    answerElement.innerText = "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";
  };

  document.body.appendChild(script);

  setTimeout(function () {
    if (completed) return;
    completed = true;
    cleanupScript();
    statusElement.innerText = "❌ AI ตอบช้าเกินไป";
    answerElement.innerText = "หมดเวลารับคำตอบ (timeout)";
  }, AI_TIMEOUT_MS);
}

/* ================= EVENTS ================= */
questionElement.addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    event.preventDefault();
    unlockAudio();
    askAI(this.value);
  }
});

document.addEventListener("click", unlockAudio);

log("Cucumber AI พร้อมทำงาน");
log("โหมดเสียง", { thai: "Server TTS (Apps Script)", japanese: "Browser TTS", english: "Browser TTS" });
</script>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<title>Cucumber AI 🌸</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: "Segoe UI", "Prompt", Arial, sans-serif;
  color: #fff;
  overflow-x: hidden;
  min-height: 100vh;
  /* ท้องฟ้ายามเย็นแบบญี่ปุ่น */
  background: linear-gradient(180deg,
    #2b1b4d 0%,
    #5a3a7e 30%,
    #b96b9e 55%,
    #e895a8 75%,
    #f4b8c4 100%);
}

/* ===== ดวงอาทิตย์ ===== */
.sun {
  position: fixed;
  top: 12%;
  left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 130px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff6e8 0%, #ffd9a8 45%, rgba(255,200,150,0) 72%);
  filter: blur(2px);
  animation: sunGlow 6s ease-in-out infinite;
  z-index: 1;
}
@keyframes sunGlow {
  0%,100% { opacity: 0.9; transform: translateX(-50%) scale(1); }
  50%     { opacity: 1;   transform: translateX(-50%) scale(1.05); }
}

/* ===== ภูเขาไฟฟูจิ ===== */
.fuji {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 42vh;
  z-index: 2;
  pointer-events: none;
}
.fuji svg { width: 100%; height: 100%; display: block; }

/* ===== เมฆลอย ===== */
.cloud {
  position: fixed;
  background: rgba(255,255,255,0.14);
  border-radius: 50px;
  filter: blur(6px);
  z-index: 1;
  animation: drift linear infinite;
}
.cloud.c1 { width: 220px; height: 40px; top: 18%; animation-duration: 55s; }
.cloud.c2 { width: 160px; height: 30px; top: 30%; animation-duration: 75s; animation-delay: -30s; }
.cloud.c3 { width: 300px; height: 50px; top: 10%; animation-duration: 90s; animation-delay: -60s; }
@keyframes drift {
  from { left: -320px; }
  to   { left: 105%; }
}

/* ===== กลีบซากุระร่วง (canvas) ===== */
#petals {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* ===== กิ่งซากุระมุมบน ===== */
.branch {
  position: fixed;
  top: -20px;
  z-index: 4;
  pointer-events: none;
  opacity: 0.9;
}
.branch.left  { left: -40px; animation: swayL 7s ease-in-out infinite; transform-origin: top left; }
.branch.right { right: -40px; transform: scaleX(-1); animation: swayR 8s ease-in-out infinite; transform-origin: top right; }
@keyframes swayL { 0%,100% { transform: rotate(0deg);} 50% { transform: rotate(2.5deg);} }
@keyframes swayR { 0%,100% { transform: scaleX(-1) rotate(0deg);} 50% { transform: scaleX(-1) rotate(2.5deg);} }

/* ===== เนื้อหาหลัก ===== */
.app {
  position: relative;
  z-index: 10;
  max-width: 560px;
  margin: 0 auto;
  padding: 40px 20px 50px;
  text-align: center;
}

.card {
  background: rgba(30, 15, 45, 0.45);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 190, 215, 0.25);
  border-radius: 26px;
  padding: 32px 26px;
  box-shadow:
    0 20px 60px rgba(20, 5, 35, 0.5),
    inset 0 1px 0 rgba(255,255,255,0.12);
}

.robot {
  width: 84px; height: 84px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,190,215,0.35);
  display: flex; align-items: center; justify-content: center;
  font-size: 46px;
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-8px); }
}

h1 {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 1px;
  background: linear-gradient(90deg, #ffd1e3, #ffb3d1, #f8c8ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 30px rgba(255,150,200,0.35);
}
.subtitle { margin-top: 6px; color: #f3cfe0; font-size: 15px; }

#status {
  margin: 18px 0 20px;
  color: #f0d5e5;
  min-height: 24px;
  font-size: 15px;
}

#micButton {
  width: 150px; height: 150px;
  border-radius: 50%;
  border: 2px solid rgba(255,170,205,0.5);
  background: radial-gradient(circle at 35% 30%, rgba(255,190,220,0.25), rgba(120,60,120,0.25));
  color: white; font-size: 56px; cursor: pointer;
  transition: 0.25s;
  box-shadow:
    0 0 40px rgba(255,140,190,0.35),
    inset 0 0 25px rgba(255,180,215,0.15);
}
#micButton:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(255,150,200,0.55); }
#micButton:active { transform: scale(0.94); }
#micButton.listening {
  background: radial-gradient(circle at 35% 30%, #ff8aa8, #c2447a);
  border-color: #ffb0c8;
  box-shadow: 0 0 70px rgba(255,90,140,0.8);
  animation: pulse 1.1s infinite;
}
@keyframes pulse {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.07); }
  100% { transform: scale(1); }
}
.micLabel { margin-top: 10px; color: #f3cfe0; font-size: 14px; }

#question {
  width: 100%; margin-top: 24px; padding: 15px 18px;
  border-radius: 14px;
  border: 1px solid rgba(255,190,215,0.35);
  background: rgba(255,255,255,0.08);
  color: white; font-size: 17px; outline: none;
  transition: 0.25s;
}
#question::placeholder { color: rgba(255,220,235,0.55); }
#question:focus {
  border-color: #ffb0d0;
  box-shadow: 0 0 18px rgba(255,150,200,0.35);
  background: rgba(255,255,255,0.12);
}

#answer {
  margin-top: 20px; padding: 20px;
  border-radius: 16px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,190,215,0.2);
  text-align: left;
  line-height: 1.75; font-size: 17px;
  min-height: 90px; white-space: pre-wrap;
}

.hint { margin-top: 18px; color: rgba(255,220,235,0.6); font-size: 13px; }

#debug {
  margin-top: 20px; padding: 14px;
  border-radius: 12px;
  background: rgba(10, 5, 20, 0.55);
  color: #c9b3d9;
  text-align: left;
  font-family: Consolas, monospace; font-size: 11.5px; line-height: 1.5;
  max-height: 200px; overflow-y: auto; white-space: pre-wrap;
  border: 1px solid rgba(255,190,215,0.12);
}

@media (max-width: 480px) {
  #micButton { width: 120px; height: 120px; font-size: 44px; }
  .card { padding: 24px 16px; }
}
</style>
</head>

<script>
/* ================= CONFIG ================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";

const statusElement = document.getElementById("status");

const debugElement = document.getElementById("debug");

/* ================= SAKURA PETALS ================= */
(function () {
  const canvas = document.getElementById("petals");
  const ctx = canvas.getContext("2d");
  let petals = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  const COUNT = Math.min(45, Math.floor(window.innerWidth / 25));

  function newPetal() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      size: 5 + Math.random() * 8,
      speedY: 0.7 + Math.random() * 1.4,
      drift: 0.4 + Math.random() * 0.9,
      phase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.04,
      color: ["#ffc4d6", "#ffb0cc", "#ffd6e4", "#f9a8c4"][Math.floor(Math.random() * 4)],
      opacity: 0.55 + Math.random() * 0.45
    };
  }

  for (let i = 0; i < COUNT; i++) {
    const p = newPetal();
    p.y = Math.random() * canvas.height; // เริ่มกระจายทั่วจอ
    petals.push(p);
  }

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    // รูปกลีบซากุระ
    ctx.moveTo(0, -p.size / 2);
    ctx.bezierCurveTo(p.size / 2, -p.size / 2, p.size / 2, p.size / 3, 0, p.size / 2);
    ctx.bezierCurveTo(-p.size / 2, p.size / 3, -p.size / 2, -p.size / 2, 0, -p.size / 2);
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < petals.length; i++) {
      const p = petals[i];
      p.phase += 0.015;
      p.y += p.speedY;
      p.x += Math.sin(p.phase) * p.drift; // แกว่งซ้ายขวา
      p.rot += p.rotSpeed;
      if (p.y > canvas.height + 20) petals[i] = newPetal();
      drawPetal(p);
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

  try {
    if (!audioContext) {

let thaiVoice = null;

function loadBrowserVoices() {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  thaiVoice = voices.find(v => v.lang && v.lang.toLowerCase() === "th-th")

    || voices.find(v => (v.name + " " + v.lang).toLowerCase().includes("thai"))
    || null;
  englishVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) || null;
  log("Voices", { thai: thaiVoice ? thaiVoice.name : "ไม่พบ", english: englishVoice ? englishVoice.name : "ไม่พบ" });
}

/* ================= DETECT LANGUAGE ================= */
function detectLanguage(text) {
  const value = String(text || "").trim();
  if (!value) return "unknown";
  const count = (re) => (value.match(re) || []).length;
  const kana = count(/[\u3040-\u30ff]/g);
  const cjk = count(/[\u3400-\u4dbf\u4e00-\u9fff]/g);
  const thai = count(/[\u0E00-\u0E7F]/g);
  const eng = count(/[A-Za-z]/g);
  const jp = kana + cjk;
  if (kana > 0 && kana >= thai) return "ja";
  if (cjk > 0 && kana === 0 && cjk > thai && cjk >= eng) return "zh";
  if (jp > thai && jp > eng) return "ja";
  if (thai >= jp && thai >= eng) return "th";
  if (eng > 0) return "en";
  return "th";
}

/* ================= SPLIT TEXT ================= */
function splitSentences(clean) {
  const result = [];
  let current = "";
  for (let i = 0; i < clean.length; i++) {
    current += clean[i];
    if (".!?。！？".indexOf(clean[i]) !== -1) {
      result.push(current.trim());
      current = "";
    }
  }
  if (current.trim()) result.push(current.trim());
  return result.filter(s => s.length > 0);
}

function splitText(text, maxLength) {
  maxLength = maxLength || 450;
  const clean = String(text || "").replace(/\s+/g, " ").trim();
  if (clean.length <= maxLength) return [clean];
  const result = [];

    if ((current + " " + sentence).trim().length <= maxLength) {
      current = (current + " " + sentence).trim();
    } else {
      if (current) { result.push(current); current = ""; }
      if (sentence.length > maxLength) {
        let start = 0;
        while (start < sentence.length) {
          result.push(sentence.substring(start, start + maxLength));
          start += maxLength;
        }
      } else {
        current = sentence;
      }
    }
  }
  if (current) result.push(current);
  return result;
}

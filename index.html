<body>

<div class="app">

  <div class="robot">
    🤖
  </div>

  <h1>
    Cucumber AI
  </h1>

  <div id="status">
    พร้อมครับ กดไมค์แล้วพูดได้เลย
  </div>

  <div id="answer">

  </div>

  <div class="hint">

  </div>

    🔊 ทดสอบ VOICEVOX
  </button>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";


/* =====================================================
   VOICEVOX
   ===================================================== */

const VOICEVOX_URLS = [
  "http://127.0.0.1:50021",
  "http://localhost:50021"
];

const SPEAKER_ID = 7;


/* =====================================================
   ELEMENTS
   ===================================================== */

const statusElement =
  document.getElementById("status");

const answerElement =
  document.getElementById("answer");

const questionElement =
  document.getElementById("question");

const micButton =
  document.getElementById("micButton");

const debugElement =
  document.getElementById("debug");

const voiceTestButton =
  document.getElementById("voiceTestButton");


/* =====================================================
   DEBUG
   ===================================================== */

function debugLog(message, data) {

  const time =
    new Date().toLocaleTimeString();

  let line =
    "[" + time + "] " + message;

  if (data !== undefined) {

    try {

      line +=
        " | " +
        JSON.stringify(
          data,
          null,
          2
        );

    } catch (error) {

      line +=
        " | " +
        String(data);

    }

  }

  console.log(line);

  debugElement.style.display =
    "block";

  debugElement.textContent +=
    line +
    "\n";

}


function clearDebug() {

  debugElement.textContent =
    "";

  debugElement.style.display =
    "none";

}


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

let recognition =
  null;

let listening =
  false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  statusElement.innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";

} else {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "th-TH";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function () {

      listening =
        true;

      micButton
        .classList
        .add("listening");

      statusElement.innerText =
        "🎙️ กำลังฟังครับ...";

    };


  recognition.onresult =
    function (event) {

      const text =
        event
          .results[0][0]
          .transcript
          .trim();

      questionElement.value =
        text;

      stopListening();

      if (text) {

        askAI(text);

      }

    };


  recognition.onerror =
    function (event) {

      console.log(
        "Speech error:",
        event.error
      );

      stopListening();

      let message =
        "รับเสียงไม่ได้ครับ";

      if (
        event.error ===
        "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      } else if (
        event.error ===
        "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      } else if (
        event.error ===
        "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }

      statusElement.innerText =
        message;

    };


  recognition.onend =
    function () {

      stopListening();

    };

}


/* =====================================================
   START LISTENING
   ===================================================== */

function startListening() {

  if (!recognition) {

    return;

  }

  if (listening) {

    recognition.stop();

    return;

  }

  try {

    recognition.start();

  } catch (error) {

    console.log(
      "Recognition start error:",
      error
    );

  }

}


/* =====================================================
   STOP LISTENING
   ===================================================== */

function stopListening() {

  listening =
    false;

  micButton
    .classList
    .remove("listening");

}


/* =====================================================
   MICROPHONE BUTTON
   ===================================================== */

micButton.addEventListener(
  "click",
  startListening
);


/* =====================================================
   GOOGLE APPS SCRIPT
   JSONP
   ===================================================== */

function askAI(question) {

  question =
    String(question || "")
      .trim();

  if (!question) {

    statusElement.innerText =
      "กรุณาพิมพ์คำถามก่อนครับ";

    return;

  }


  clearDebug();


  statusElement.innerText =
    "🤖 กำลังวิเคราะห์...";


  answerElement.innerText =
    "กำลังอ่านข้อมูลจากสวน...";


  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement("script");


  let completed =
    false;


  window[callbackName] =
    function (result) {

      if (completed) {

        return;

      }

      completed =
        true;


      if (script.parentNode) {

        script
          .parentNode
          .removeChild(
            script
          );

      }


      delete window[
        callbackName
      ];


      result =
        result || {};


      if (result.error) {

        statusElement.innerText =
          "❌ เกิดข้อผิดพลาด";

        answerElement.innerText =
          result.error;

        return;

      }


      const answer =
        result.answer ||
        "AI ไม่ได้ส่งคำตอบกลับมาครับ";


      answerElement.innerText =
        answer;


      statusElement.innerText =
        "🔊 กำลังตรวจสอบ VOICEVOX...";


      speak(answer);

    };


  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      question
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  debugLog(
    "ส่งคำถามไป Google Apps Script"
  );


  script.src =
    url;


  script.onerror =
    function () {

      if (completed) {

        return;

      }

      completed =
        true;


      delete window[
        callbackName
      ];


      if (script.parentNode) {

        script
          .parentNode
          .removeChild(
            script
          );

      }


      statusElement.innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";

      answerElement.innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";

    };


  document
    .body
    .appendChild(script);

}


/* =====================================================
   หา VOICEVOX URL ที่ใช้ได้
   ===================================================== */

async function findVoicevox() {

  debugLog(
    "เริ่มตรวจสอบ VOICEVOX"
  );


  for (
    const baseUrl of VOICEVOX_URLS
  ) {

    debugLog(
      "กำลังตรวจ",
      baseUrl
    );


    try {

      const response =
        await fetch(
          baseUrl +
          "/version",
          {
            method: "GET",

            cache: "no-store"
          }
        );


      debugLog(
        "VOICEVOX /version ตอบกลับ",
        {
          url: baseUrl,
          status: response.status,
          ok: response.ok
        }
      );


      if (!response.ok) {

        continue;

      }


      const version =
        await response.text();


      debugLog(
        "VOICEVOX version",
        version
      );


      return {
        baseUrl: baseUrl,
        version: version
      };


    } catch (error) {

      debugLog(
        "เชื่อมต่อไม่ได้",
        {
          url: baseUrl,
          error:
            error.message ||
            String(error)
        }
      );

    }

  }


  throw new Error(
    "เบราว์เซอร์ไม่สามารถเชื่อมต่อ VOICEVOX ได้"
  );

}


/* =====================================================
   ตรวจ SPEAKER ID
   ===================================================== */

async function checkSpeaker(
  baseUrl
) {

  debugLog(
    "กำลังตรวจ Speaker ID",
    SPEAKER_ID
  );


  const response =
    await fetch(
      baseUrl +
      "/speakers",
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "VOICEVOX /speakers HTTP " +
      response.status
    );

  }


  const speakers =
    await response.json();


  let found =
    null;


  for (
    const speaker of speakers
  ) {

    if (
      !speaker.styles
    ) {

      continue;

    }


    for (
      const style of speaker.styles
    ) {

      if (
        Number(style.id) ===
        Number(SPEAKER_ID)
      ) {

        found = {
          name:
            speaker.name,

          style:
            style.name,

          id:
            style.id
        };

        break;

      }

    }


    if (found) {

      break;

    }

  }


  if (!found) {

    throw new Error(
      "ไม่พบ Speaker ID " +
      SPEAKER_ID +
      " ใน VOICEVOX"
    );

  }


  debugLog(
    "พบ Speaker",
    found
  );


  return found;

}


/* =====================================================
   VOICEVOX SPEAK
   ===================================================== */

async function speak(text) {

  text =
    String(text || "")
      .trim();


  if (!text) {

    return;

  }


  clearDebug();


  statusElement.innerText =
    "🎙️ กำลังเชื่อมต่อ VOICEVOX...";


  try {


    /* -------------------------------------------------
       1. หา VOICEVOX
       ------------------------------------------------- */

    const engine =
      await findVoicevox();


    const baseUrl =
      engine.baseUrl;


    statusElement.innerText =
      "🎙️ VOICEVOX " +
      engine.version +
      " เชื่อมต่อแล้ว";


    /* -------------------------------------------------
       2. ตรวจ Speaker
       ------------------------------------------------- */

    await checkSpeaker(
      baseUrl
    );


    /* -------------------------------------------------
       3. audio_query
       ------------------------------------------------- */

    debugLog(
      "กำลังสร้าง audio_query"
    );


    const queryUrl =
      baseUrl +
      "/audio_query?speaker=" +
      encodeURIComponent(
        SPEAKER_ID
      ) +
      "&text=" +
      encodeURIComponent(
        text
      );


    const queryResponse =
      await fetch(
        queryUrl,
        {
          method: "POST",

          cache: "no-store"
        }
      );


    debugLog(
      "audio_query response",
      {
        status:
          queryResponse.status,

        ok:
          queryResponse.ok
      }
    );


    if (
      !queryResponse.ok
    ) {

      const errorText =
        await queryResponse.text();


      throw new Error(
        "VOICEVOX audio_query HTTP " +
        queryResponse.status +
        ": " +
        errorText
      );

    }


    const query =
      await queryResponse.json();


    /* -------------------------------------------------
       4. ปรับเสียง
       ------------------------------------------------- */

    query.speedScale =
      1.0;

    query.pitchScale =
      0.02;

    query.intonationScale =
      1.08;

    query.volumeScale =
      1.0;


    /* -------------------------------------------------
       5. synthesis
       ------------------------------------------------- */

    debugLog(
      "กำลังสร้างไฟล์เสียง WAV"
    );


    const synthesisUrl =
      baseUrl +
      "/synthesis?speaker=" +
      encodeURIComponent(
        SPEAKER_ID
      );


    const synthesisResponse =
      await fetch(
        synthesisUrl,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              query
            )
        }
      );


    debugLog(
      "synthesis response",
      {
        status:
          synthesisResponse.status,

        ok:
          synthesisResponse.ok
      }
    );


    if (
      !synthesisResponse.ok
    ) {

      const errorText =
        await synthesisResponse.text();


      throw new Error(
        "VOICEVOX synthesis HTTP " +
        synthesisResponse.status +
        ": " +
        errorText
      );

    }


    /* -------------------------------------------------
       6. WAV
       ------------------------------------------------- */

    const audioBlob =
      await synthesisResponse.blob();


    debugLog(
      "ได้รับไฟล์เสียง",
      {
        size:
          audioBlob.size,

        type:
          audioBlob.type
      }
    );


    if (
      !audioBlob ||
      audioBlob.size === 0
    ) {

      throw new Error(
        "VOICEVOX ส่งไฟล์เสียงว่างกลับมา"
      );

    }


    /* -------------------------------------------------
       7. เล่นเสียง
       ------------------------------------------------- */

    const audioUrl =
      URL.createObjectURL(
        audioBlob
      );


    const audio =
      new Audio(
        audioUrl
      );


    audio.volume =
      1.0;


    statusElement.innerText =
      "🔊 ずんだもん กำลังพูด...";


    audio.onended =
      function () {

        URL.revokeObjectURL(
          audioUrl
        );


        statusElement.innerText =
          "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

      };


    audio.onerror =
      function () {

        URL.revokeObjectURL(
          audioUrl
        );


        statusElement.innerText =
          "❌ ได้ไฟล์เสียงแล้ว แต่เปิดเสียงไม่ได้";


        debugLog(
          "Audio playback error"
        );

      };


    await audio.play();


  } catch (error) {


    console.error(
      "VOICEVOX ERROR:",
      error
    );


    const message =
      error &&
      error.message
        ? error.message
        : String(error);


    debugLog(
      "VOICEVOX ERROR",
      message
    );


    /*
      แยกกรณี Failed to fetch
    */

    if (
      message ===
      "Failed to fetch"
    ) {

      statusElement.innerText =
        "❌ VOICEVOX ติดต่อจากหน้าเว็บไม่ได้";


      answerElement.innerText +=
        "\n\n[VOICEVOX]\n" +
        "Failed to fetch\n\n" +
        "ให้เปิด VOICEVOX → http://127.0.0.1:50021/setting\n" +
        "แล้วตรวจ Allow Origin ของหน้าเว็บนี้";

    } else {

      statusElement.innerText =
        "❌ VOICEVOX ERROR";


      answerElement.innerText +=
        "\n\n[VOICEVOX ERROR]\n" +
        message;

    }

  }

}


/* =====================================================
   ปุ่มทดสอบ VOICEVOX
   ===================================================== */

voiceTestButton.addEventListener(
  "click",
  function () {

    speak(
      "สวัสดีครับ วันนี้เรามาตรวจแตงกวาญี่ปุ่นกันครับ"
    );

  }
);


/* =====================================================
   Enter ส่งคำถาม
   ===================================================== */

questionElement.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      askAI(
        this.value
      );

    }

  }
);


/* =====================================================
   F9 = ทดสอบ VOICEVOX
   ===================================================== */

document.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key ===
      "F9"
    ) {

      speak(
        "สวัสดีครับ ผมซุนดะมอน วันนี้เรามาตรวจดูแตงกวากันครับ"
      );

    }

  }
);


</script>

<script>

/* =====================================================
   CONFIG
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";


const VOICEVOX_URL =
  "http://127.0.0.1:50021";


const VOICEVOX_SPEAKER_ID =
  7;


/* =====================================================
   ELEMENTS
   ===================================================== */

const statusElement =
  document.getElementById(
    "status"
  );

const answerElement =
  document.getElementById(
    "answer"
  );

const questionElement =
  document.getElementById(
    "question"
  );

const micButton =
  document.getElementById(
    "micButton"
  );

const debugElement =
  document.getElementById(
    "debug"
  );


/* =====================================================
   DEBUG
   ===================================================== */

function log(message, data) {

  const time =
    new Date()
      .toLocaleTimeString(
        "th-TH",
        {
          hour12: false
        }
      );

  let line =
    "[" +
    time +
    "] " +
    message;

  if (
    data !== undefined
  ) {

    try {

      line +=
        " | " +
        JSON.stringify(
          data,
          null,
          2
        );

    }

    catch (e) {

      line +=
        " | " +
        String(data);

    }

  }

  console.log(
    line
  );

  debugElement.textContent +=
    line +
    "\n";

  debugElement.scrollTop =
    debugElement.scrollHeight;

}


/* =====================================================
   AUDIO CONTEXT
   ===================================================== */

let audioContext =
  null;


function unlockAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      log(
        "สร้าง AudioContext",
        {
          state:
            audioContext.state
        }
      );

    }

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

    log(
      "ปลดล็อกระบบเสียงแล้ว"
    );

  }

  catch (error) {

    log(
      "ปลดล็อกเสียงไม่สำเร็จ",
      error.message
    );

  }

}


/* =====================================================
   BROWSER TEXT TO SPEECH
   ภาษาไทย / ภาษาอังกฤษ
   ===================================================== */

let thaiVoice =
  null;

let englishVoice =
  null;


function loadBrowserVoices() {

  if (
    !("speechSynthesis" in window)
  ) {

    log(
      "เบราว์เซอร์ไม่รองรับ speechSynthesis"
    );

    return;

  }

  const voices =
    window.speechSynthesis
      .getVoices();

  log(
    "พบเสียงในเบราว์เซอร์",
    voices.length
  );


  thaiVoice =
    voices.find(
      function(voice) {

        return (
          voice.lang &&
          voice.lang
            .toLowerCase()
            .startsWith(
              "th"
            )
        );

      }
    ) || null;


  englishVoice =
    voices.find(
      function(voice) {

        return (
          voice.lang &&
          voice.lang
            .toLowerCase()
            .startsWith(
              "en"
            )
        );

      }
    ) || null;


  log(
    "เสียงภาษาไทย",
    thaiVoice
      ? {
          name:
            thaiVoice.name,
          lang:
            thaiVoice.lang
        }
      : "ไม่พบเสียงไทย"
  );


  log(
    "เสียงภาษาอังกฤษ",
    englishVoice
      ? {
          name:
            englishVoice.name,
          lang:
            englishVoice.lang
        }
      : "ไม่พบเสียงอังกฤษ"
  );

}


if (
  "speechSynthesis" in window
) {

  loadBrowserVoices();

  window.speechSynthesis
    .onvoiceschanged =
    loadBrowserVoices;

}


/* =====================================================
   ตรวจภาษา
   ===================================================== */

function detectLanguage(text) {

  const value =
    String(text || "")
      .trim();


  if (!value) {

    return "unknown";

  }


  const japaneseMatches =
    value.match(
      /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/g
    );


  const thaiMatches =
    value.match(
      /[\u0E00-\u0E7F]/g
    );


  const englishMatches =
    value.match(
      /[A-Za-z]/g
    );


  const japaneseCount =
    japaneseMatches
      ? japaneseMatches.length
      : 0;


  const thaiCount =
    thaiMatches
      ? thaiMatches.length
      : 0;


  const englishCount =
    englishMatches
      ? englishMatches.length
      : 0;


  log(
    "ตรวจภาษา",
    {
      thai:
        thaiCount,
      japanese:
        japaneseCount,
      english:
        englishCount
    }
  );


  if (
    japaneseCount >
    thaiCount &&
    japaneseCount >
    englishCount
  ) {

    return "ja";

  }


  if (
    thaiCount >=
    japaneseCount &&
    thaiCount >=
    englishCount
  ) {

    return "th";

  }


  if (
    englishCount >
    0
  ) {

    return "en";

  }


  return "th";

}


/* =====================================================
   พูดภาษาไทย / อังกฤษด้วย Browser TTS
   ===================================================== */

function speakBrowser(
  text,
  language
) {

  return new Promise(
    function(resolve, reject) {

      if (
        !("speechSynthesis" in window)
      ) {

        reject(
          new Error(
            "เบราว์เซอร์ไม่รองรับระบบพูด"
          )
        );

        return;

      }


      if (
        !text ||
        !text.trim()
      ) {

        resolve();

        return;

      }


      window.speechSynthesis
        .cancel();


      loadBrowserVoices();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      if (
        language === "th"
      ) {

        utterance.lang =
          "th-TH";

        if (thaiVoice) {

          utterance.voice =
            thaiVoice;

        }

        utterance.rate =
          0.95;

        utterance.pitch =
          1.0;

        utterance.volume =
          1.0;

        log(
          "เลือกเสียงภาษาไทย",
          thaiVoice
            ? thaiVoice.name
            : "ใช้เสียงเริ่มต้น th-TH"
        );

      }

      else {

        utterance.lang =
          "en-US";

        if (englishVoice) {

          utterance.voice =
            englishVoice;

        }

        utterance.rate =
          0.95;

        utterance.pitch =
          1.0;

        utterance.volume =
          1.0;

      }


      utterance.onstart =
        function() {

          log(
            "Browser TTS เริ่มพูด",
            {
              language:
                language
            }
          );

          statusElement.innerText =
            language === "th"
              ? "🔊 กำลังพูดภาษาไทย..."
              : "🔊 กำลังพูดภาษาอังกฤษ...";

        };


      utterance.onend =
        function() {

          log(
            "Browser TTS พูดเสร็จแล้ว"
          );

          statusElement.innerText =
            "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

          resolve();

        };


      utterance.onerror =
        function(event) {

          log(
            "Browser TTS ERROR",
            {
              error:
                event.error
            }
          );

          reject(
            new Error(
              "Browser TTS: " +
              event.error
            )
          );

        };


      try {

        window.speechSynthesis
          .speak(
            utterance
          );

      }

      catch (error) {

        reject(
          error
        );

      }

    }
  );

}


/* =====================================================
   VOICEVOX
   ใช้เฉพาะภาษาญี่ปุ่น
   ===================================================== */

async function speakVoicevox(
  text
) {

  statusElement.innerText =
    "🎙️ กำลังสร้างเสียง VOICEVOX...";


  log(
    "เริ่มสร้างเสียง VOICEVOX",
    {
      speaker:
        VOICEVOX_SPEAKER_ID,
      text:
        text
    }
  );


  /* ตรวจ Engine */

  log(
    "เริ่มตรวจสอบ VOICEVOX"
  );


  const versionResponse =
    await fetch(
      VOICEVOX_URL +
      "/version",
      {
        method:
          "GET"
      }
    );


  if (
    !versionResponse.ok
  ) {

    throw new Error(
      "VOICEVOX /version HTTP " +
      versionResponse.status
    );

  }


  const version =
    await versionResponse.text();


  log(
    "VOICEVOX version",
    version
  );


  /* ตรวจ Speaker */

  log(
    "กำลังตรวจ Speaker ID",
    VOICEVOX_SPEAKER_ID
  );


  const speakersResponse =
    await fetch(
      VOICEVOX_URL +
      "/speakers",
      {
        method:
          "GET"
      }
    );


  if (
    !speakersResponse.ok
  ) {

    throw new Error(
      "VOICEVOX /speakers HTTP " +
      speakersResponse.status
    );

  }


  const speakers =
    await speakersResponse.json();


  let speakerFound =
    null;


  for (
    const speaker
    of speakers
  ) {

    if (
      speaker.styles
    ) {

      for (
        const style
        of speaker.styles
      ) {

        if (
          style.id ===
          VOICEVOX_SPEAKER_ID
        ) {

          speakerFound = {

            name:
              speaker.name,

            style:
              style.name,

            id:
              style.id

          };

        }

      }

    }

  }


  if (
    !speakerFound
  ) {

    throw new Error(
      "ไม่พบ VOICEVOX Speaker ID " +
      VOICEVOX_SPEAKER_ID
    );

  }


  log(
    "พบ Speaker",
    speakerFound
  );


  /* audio_query */

  log(
    "กำลังสร้าง audio_query"
  );


  const queryResponse =
    await fetch(
      VOICEVOX_URL +
      "/audio_query?speaker=" +
      VOICEVOX_SPEAKER_ID +
      "&text=" +
      encodeURIComponent(
        text
      ),
      {
        method:
          "POST"
      }
    );


  log(
    "audio_query response",
    {
      status:
        queryResponse.status,
      ok:
        queryResponse.ok
    }
  );


  if (
    !queryResponse.ok
  ) {

    const errorText =
      await queryResponse.text();

    throw new Error(
      "VOICEVOX audio_query HTTP " +
      queryResponse.status +
      ": " +
      errorText
    );

  }


  const query =
    await queryResponse.json();


  /* ปรับเสียง */

  query.speedScale =
    1.0;

  query.pitchScale =
    0.02;

  query.intonationScale =
    1.08;

  query.volumeScale =
    1.0;


  /* synthesis */

  log(
    "กำลังสร้างไฟล์เสียง WAV"
  );


  const synthesisResponse =
    await fetch(
      VOICEVOX_URL +
      "/synthesis?speaker=" +
      VOICEVOX_SPEAKER_ID,
      {
        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json",

          "Accept":
            "audio/wav"

        },

        body:
          JSON.stringify(
            query
          )

      }
    );


  log(
    "synthesis response",
    {
      status:
        synthesisResponse.status,
      ok:
        synthesisResponse.ok
    }
  );


  if (
    !synthesisResponse.ok
  ) {

    const errorText =
      await synthesisResponse.text();

    throw new Error(
      "VOICEVOX synthesis HTTP " +
      synthesisResponse.status +
      ": " +
      errorText
    );

  }


  const audioBlob =
    await synthesisResponse.blob();


  log(
    "ได้รับไฟล์เสียง",
    {
      size:
        audioBlob.size,
      type:
        audioBlob.type
    }
  );


  if (
    !audioBlob ||
    audioBlob.size === 0
  ) {

    throw new Error(
      "VOICEVOX ส่งไฟล์เสียงว่าง"
    );

  }


  /* เล่นเสียง */

  const audioUrl =
    URL.createObjectURL(
      audioBlob
    );


  const audio =
    new Audio(
      audioUrl
    );


  audio.volume =
    1.0;


  return new Promise(
    function(resolve, reject) {

      audio.onplay =
        function() {

          log(
            "VOICEVOX เริ่มเล่นเสียง"
          );

          statusElement.innerText =
            "🔊 ずんだもん กำลังพูด...";

        };


      audio.onended =
        function() {

          log(
            "VOICEVOX พูดเสร็จแล้ว"
          );

          URL.revokeObjectURL(
            audioUrl
          );

          statusElement.innerText =
            "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

          resolve();

        };


      audio.onerror =
        function() {

          log(
            "VOICEVOX audio playback ERROR"
          );

          URL.revokeObjectURL(
            audioUrl
          );

          reject(
            new Error(
              "เปิดไฟล์เสียง VOICEVOX ไม่ได้"
            )
          );

        };


      audio.play()
        .then(
          function() {

            log(
              "audio.play() สำเร็จ",
              {
                paused:
                  audio.paused,
                volume:
                  audio.volume,
                muted:
                  audio.muted
              }
            );

          }
        )
        .catch(
          function(error) {

            log(
              "audio.play() ERROR",
              error.message
            );

            URL.revokeObjectURL(
              audioUrl
            );

            reject(
              error
            );

          }
        );

    }
  );

}


/* =====================================================
   ฟังก์ชันหลัก
   Gemini → ตรวจภาษา → TTS
   ===================================================== */

async function speak(text) {

  if (
    !text ||
    !text.trim()
  ) {

    return;

  }


  unlockAudio();


  const language =
    detectLanguage(
      text
    );


  log(
    "เลือกระบบเสียง",
    {
      language:
        language
    }
  );


  try {

    /*
      ภาษาไทย
      → Browser TTS
    */

    if (
      language === "th"
    ) {

      log(
        "ส่งข้อความไทยเข้า Browser TTS"
      );

      await speakBrowser(
        text,
        "th"
      );

      return;

    }


    /*
      ภาษาญี่ปุ่น
      → VOICEVOX ID 7
    */

    if (
      language === "ja"
    ) {

      log(
        "ส่งข้อความญี่ปุ่นเข้า VOICEVOX"
      );

      await speakVoicevox(
        text
      );

      return;

    }


    /*
      ภาษาอังกฤษ
      → Browser TTS
    */

    if (
      language === "en"
    ) {

      log(
        "ส่งข้อความอังกฤษเข้า Browser TTS"
      );

      await speakBrowser(
        text,
        "en"
      );

      return;

    }


    /*
      ไม่ทราบภาษา
      → ใช้ภาษาไทยเป็นค่าเริ่มต้น
    */

    log(
      "ไม่ทราบภาษา → ใช้เสียงไทย"
    );

    await speakBrowser(
      text,
      "th"
    );

  }

  catch (error) {

    log(
      "ระบบเสียง ERROR",
      {
        message:
          error.message
      }
    );


    statusElement.innerText =
      "❌ ระบบเสียงมีปัญหา";


    answerElement.innerText =
      answerElement.innerText +
      "\n\n[VOICE ERROR]\n" +
      error.message;

  }

}


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

let recognition =
  null;

let listening =
  false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (
  !SpeechRecognition
) {

  statusElement.innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";

  log(
    "ไม่พบ SpeechRecognition"
  );

}

else {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "th-TH";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      listening =
        true;

      micButton
        .classList
        .add(
          "listening"
        );

      statusElement.innerText =
        "🎙️ กำลังฟังครับ...";

      log(
        "เริ่มรับเสียง"
      );

    };


  recognition.onresult =
    function(event) {

      const text =
        event
          .results[0][0]
          .transcript;


      questionElement.value =
        text;


      log(
        "รับคำถามจากไมค์",
        text
      );


      stopListening();


      askAI(
        text
      );

    };


  recognition.onerror =
    function(event) {

      log(
        "Speech Recognition ERROR",
        event.error
      );


      stopListening();


      let message =
        "รับเสียงไม่ได้ครับ";


      if (
        event.error ===
        "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      }

      else if (
        event.error ===
        "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      }

      else if (
        event.error ===
        "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }


      statusElement.innerText =
        message;

    };


  recognition.onend =
    function() {

      stopListening();

    };

}


function startListening() {

  unlockAudio();


  if (!recognition) {

    return;

  }


  if (
    listening
  ) {

    recognition.stop();

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    log(
      "เริ่มไมค์ ERROR",
      error.message
    );

  }

}


function stopListening() {

  listening =
    false;


  micButton
    .classList
    .remove(
      "listening"
    );

}


micButton
  .addEventListener(
    "click",
    function() {

      unlockAudio();

      startListening();

    }
  );


/* =====================================================
   GEMINI / APPS SCRIPT
   JSONP
   ===================================================== */

function askAI(
  question
) {

  if (
    !question ||
    !question.trim()
  ) {

    return;

  }


  unlockAudio();


  const cleanQuestion =
    question.trim();


  log(
    "ส่งคำถาม",
    cleanQuestion
  );


  statusElement.innerText =
    "🤖 กำลังวิเคราะห์...";


  answerElement.innerText =
    "กำลังอ่านข้อมูลจากสวน...";


  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      "script"
    );


  let completed =
    false;


  window[callbackName] =
    function(result) {

      if (
        completed
      ) {

        return;

      }


      completed =
        true;


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }


      delete window[
        callbackName
      ];


      if (
        !result
      ) {

        statusElement.innerText =
          "❌ AI ไม่ส่งข้อมูลกลับมา";

        answerElement.innerText =
          "ไม่ได้รับคำตอบจาก AI";

        return;

      }


      if (
        result.error
      ) {

        log(
          "AI ERROR",
          result.error
        );


        statusElement.innerText =
          "❌ เกิดข้อผิดพลาด";


        answerElement.innerText =
          result.error;


        return;

      }


      const answer =
        result.answer ||
        "AI ไม่ได้ส่งคำตอบกลับมาครับ";


      log(
        "AI ตอบกลับแล้ว",
        {
          length:
            answer.length
        }
      );


      answerElement.innerText =
        answer;


      /*
        สำคัญ:
        ปลดล็อกเสียงอีกครั้งก่อนพูด
      */

      unlockAudio();


      speak(
        answer
      );

    };


  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      cleanQuestion
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      if (
        completed
      ) {

        return;

      }


      completed =
        true;


      delete window[
        callbackName
      ];


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }


      log(
        "เชื่อมต่อ Apps Script ERROR"
      );


      statusElement.innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";


      answerElement.innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";

    };


  document.body
    .appendChild(
      script
    );

}


/* =====================================================
   ENTER = SEND
   ===================================================== */

questionElement
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();


        unlockAudio();


        askAI(
          this.value
        );

      }

    }
  );

document

    },
    {
      once:

    }

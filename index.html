<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cucumber AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f1115;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 600px;
      padding: 30px 20px;
      text-align: center;
    }

    .robot {
      font-size: 70px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    #status {
      margin: 18px 0 30px;
      color: #aaa;
      min-height: 25px;
    }

    #micButton {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      background: #22262c;
      color: white;
      font-size: 70px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 35px rgba(255,255,255,0.12);
    }

    #micButton.listening {
      background: #b71c1c;
      box-shadow: 0 0 55px rgba(244,67,54,0.6);
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    #question {
      width: 100%;
      margin-top: 30px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1d22;
      color: white;
      font-size: 18px;
    }

    #answer {
      margin-top: 25px;
      padding: 20px;
      border-radius: 15px;
      background: #191c20;
      text-align: left;
      line-height: 1.7;
      font-size: 18px;
      min-height: 100px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="robot">🤖</div>

  <h1>Cucumber AI</h1>

  <div id="status">
    พร้อมครับ กดไมค์แล้วพูดได้เลย
  </div>

  <button id="micButton">🎙️</button>

  <input
    id="question"
    type="text"
    placeholder="หรือพิมพ์คำถาม..."
  >

  <div id="answer">
    รอคำถามจากคุณ...
  </div>

</div>


<script>

const APPS_SCRIPT_URL = "ใส่ Web App URL ของ Apps Script ตรงนี้";


let recognition;
let listening = false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  document.getElementById("status").innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";

} else {

  recognition = new SpeechRecognition();

  recognition.lang = "th-TH";

  recognition.continuous = false;

  recognition.interimResults = false;


  recognition.onstart = function () {

    listening = true;

    document
      .getElementById("micButton")
      .classList.add("listening");

    document.getElementById("status").innerText =
      "🎙️ กำลังฟังครับ...";

  };


  recognition.onresult = function (event) {

    const text =
      event.results[0][0].transcript;

    document.getElementById("question").value =
      text;

    stopListening();

    askAI(text);

  };


  recognition.onerror = function (event) {

    console.log(event);

    stopListening();

    document.getElementById("status").innerText =
      "รับเสียงไม่ได้ครับ ลองกดไมค์อีกครั้ง";

  };


  recognition.onend = function () {

    stopListening();

  };
}


function startListening() {

  if (!recognition) return;

  if (listening) {

    recognition.stop();

    return;
  }

  try {

    recognition.start();

  } catch (error) {

    console.log(error);

  }
}
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby-QeUFRGI4Kn_xu8LFA_2TY2xlZfZPMbHSqSCTMkhphU2dabLsfeLgs8mfZBQiH6aO/exec";

function stopListening() {

  listening = false;

  document
    .getElementById("micButton")
    .classList.remove("listening");

}


document
  .getElementById("micButton")
  .addEventListener("click", startListening);


function askAI(question) {

  if (!question || !question.trim()) {
    return;
  }

  document.getElementById("status").innerText =
    "🤖 กำลังวิเคราะห์...";

  document.getElementById("answer").innerText =
    "กำลังอ่านข้อมูลจากสวน...";


  // สร้างชื่อ callback แบบสุ่ม
  const callbackName =
    "aiCallback_" + Date.now();


  // สร้างฟังก์ชัน callback บน window
  window[callbackName] = function(result) {

    // ล้าง script ที่ใช้เรียก API
    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    delete window[callbackName];


    if (result.error) {

      document.getElementById("status").innerText =
        "❌ เกิดข้อผิดพลาด";

      document.getElementById("answer").innerText =
        result.error;

      return;
    }


    document.getElementById("answer").innerText =
      result.answer;


    document.getElementById("status").innerText =
      "🔊 กำลังพูดตอบ...";


    speak(result.answer);

  };


  // สร้าง script tag
  const script = document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(question) +
    "&callback=" +
    encodeURIComponent(callbackName);


  script.onerror = function() {

    document.getElementById("status").innerText =
      "❌ เชื่อมต่อ AI ไม่สำเร็จ";

    document.getElementById("answer").innerText =
      "ไม่สามารถเชื่อมต่อกับระบบ AI ได้ครับ";

    delete window[callbackName];

  };


  document.body.appendChild(script);
}


function speak(text) {

  if (!("speechSynthesis" in window)) {

    document.getElementById("status").innerText =
      "เบราว์เซอร์ไม่รองรับการอ่านเสียง";

    return;

  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(text);


  utterance.lang = "th-TH";

  utterance.rate = 0.95;

  utterance.pitch = 1;

  utterance.volume = 1;


  utterance.onend = function () {

    document.getElementById("status").innerText =
      "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";

  };


  speechSynthesis.speak(utterance);

}


document
  .getElementById("question")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      askAI(this.value);

    }

  });

</script>

</body>
</html>

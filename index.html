<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cucumber AI</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #1b2630 0%,
          #0f1115 45%,
          #090a0c 100%
        );

      color: white;

      font-family:
        Arial,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;
    }


    .app {

      width: 100%;

      max-width: 600px;

      padding: 30px 20px 40px;

      text-align: center;
    }


    .robot {

      font-size: 70px;

      margin-bottom: 5px;
    }


    h1 {

      margin: 0;

      font-size: 30px;

      font-weight: 600;
    }


    #status {

      margin:
        18px
        0
        30px;

      color: #aaa;

      min-height: 25px;
    }


    #micButton {

      width: 180px;

      height: 180px;

      border-radius: 50%;

      border: none;

      background: #20252b;

      color: white;

      font-size: 70px;

      cursor: pointer;

      transition: 0.2s;

      box-shadow:
        0 0 35px
        rgba(
          255,
          255,
          255,
          0.12
        );
    }


    #micButton:active {

      transform:
        scale(0.94);
    }


    #micButton.listening {

      background:
        #b71c1c;

      box-shadow:
        0 0 60px
        rgba(
          244,
          67,
          54,
          0.65
        );

      animation:
        pulse
        1.1s
        infinite;
    }


    @keyframes pulse {

      0% {
        transform:
          scale(1);
      }

      50% {
        transform:
          scale(1.06);
      }

      100% {
        transform:
          scale(1);
      }

    }


    #question {

      width: 100%;

      margin-top: 30px;

      padding: 15px;

      border-radius: 12px;

      border:
        1px solid
        #333;

      background:
        #191c20;

      color: white;

      font-size: 18px;

      outline: none;
    }


    #question::placeholder {

      color: #777;
    }


    #sendButton {

      width: 100%;

      margin-top: 12px;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background: #263238;

      color: white;

      font-size: 17px;

      cursor: pointer;
    }


    #sendButton:hover {

      background: #37474f;
    }


    #testVoiceButton {

      width: 100%;

      margin-top: 10px;

      padding: 12px;

      border: 1px solid #333;

      border-radius: 12px;

      background: #15181c;

      color: #aaa;

      font-size: 15px;

      cursor: pointer;
    }


    #answer {

      margin-top: 25px;

      padding: 20px;

      border-radius: 15px;

      background:
        rgba(
          255,
          255,
          255,
          0.06
        );

      text-align: left;

      line-height: 1.7;

      font-size: 18px;

      min-height: 100px;

      white-space: pre-wrap;
    }


    #audioPlayer {

      width: 100%;

      margin-top: 15px;

      display: none;
    }


    .hint {

      margin-top: 20px;

      color: #666;

      font-size: 14px;
    }


    #debug {

      margin-top: 20px;

      padding: 12px;

      border-radius: 10px;

      background: rgba(
        0,
        0,
        0,
        0.35
      );

      color: #777;

      text-align: left;

      font-size: 12px;

      line-height: 1.5;

      max-height: 180px;

      overflow-y: auto;

      white-space: pre-wrap;
    }

  </style>

</head>


<body>


<div class="app">


  <div class="robot">
    🤖
  </div>


  <h1>
    Cucumber AI
  </h1>


  <div id="status">

    ระบบพร้อมทำงาน

  </div>


  <button
    id="micButton"
    type="button"
  >

    🎙️

  </button>


  <input
    id="question"
    type="text"
    placeholder="หรือพิมพ์คำถาม..."
    autocomplete="off"
  >


  <button
    id="sendButton"
    type="button"
  >

    ส่งคำถาม
  </button>


  <button
    id="testVoiceButton"
    type="button"
  >

    🔊 ทดสอบ VOICEVOX

  </button>


  <div id="answer">

    รอคำถามจากคุณ...

  </div>


  <audio
    id="audioPlayer"
    controls
  ></audio>


  <div class="hint">

    กดไมค์ → พูด → Gemini วิเคราะห์ → VOICEVOX พูดตอบ

  </div>


  <div id="debug"></div>


</div>



<script>


/* =====================================================
   Google Apps Script
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxuuetkVQLCHCr0IF2RF_1o11jXsW9jaORL6UvoLV1g_d2x35k8wZoeIpai-nFpiHbv/exec";



/* =====================================================
   VOICEVOX
   ===================================================== */

const VOICEVOX_URL =
  "http://127.0.0.1:50021";


const SPEAKER_ID =
  7;



/* =====================================================
   ตัวแปรระบบ
   ===================================================== */

let recognition =
  null;


let listening =
  false;


let currentAudioUrl =
  null;



/* =====================================================
   Elements
   ===================================================== */

const status =
  document.getElementById(
    "status"
  );


const questionInput =
  document.getElementById(
    "question"
  );


const answerBox =
  document.getElementById(
    "answer"
  );


const micButton =
  document.getElementById(
    "micButton"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );


const testVoiceButton =
  document.getElementById(
    "testVoiceButton"
  );


const audioPlayer =
  document.getElementById(
    "audioPlayer"
  );


const debugBox =
  document.getElementById(
    "debug"
  );



/* =====================================================
   LOG
   ===================================================== */

function log(message, data) {

  const time =
    new Date()
      .toLocaleTimeString(
        "th-TH"
      );


  let line =
    "[" +
    time +
    "] " +
    message;


  if (
    data !== undefined
  ) {

    try {

      line +=
        " | " +
        JSON.stringify(
          data,
          null,
          2
        );

    }

    catch (e) {

      line +=
        " | " +
        String(data);

    }

  }


  console.log(
    line
  );


  debugBox.textContent +=
    line +
    "\n";


  debugBox.scrollTop =
    debugBox.scrollHeight;
}



/* =====================================================
   Speech Recognition
   ===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;



if (!SpeechRecognition) {

  status.innerText =
    "เบราว์เซอร์นี้ไม่รองรับการรับเสียง";


} else {


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "th-TH";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;



  recognition.onstart =
    function () {

      listening =
        true;


      micButton
        .classList
        .add(
          "listening"
        );


      status.innerText =
        "🎙️ กำลังฟังครับ...";


      log(
        "เริ่มรับเสียง"
      );

    };



  recognition.onresult =
    function (event) {

      const text =
        event
          .results[0][0]
          .transcript
          .trim();


      log(
        "รับเสียงสำเร็จ",
        text
      );


      questionInput.value =
        text;


      stopListening();


      if (text) {

        askAI(text);

      }

    };



  recognition.onerror =
    function (event) {

      log(
        "Speech Recognition ERROR",
        event.error
      );


      stopListening();


      let message =
        "รับเสียงไม่ได้ครับ";


      if (
        event.error ===
        "not-allowed"
      ) {

        message =
          "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนครับ";

      }

      else if (
        event.error ===
        "no-speech"
      ) {

        message =
          "ไม่ได้ยินเสียงพูดครับ";

      }

      else if (
        event.error ===
        "network"
      ) {

        message =
          "ระบบรับเสียงมีปัญหาเครือข่ายครับ";

      }


      status.innerText =
        message;

    };



  recognition.onend =
    function () {

      stopListening();

    };

}



/* =====================================================
   เริ่มฟัง
   ===================================================== */

function startListening() {

  if (!recognition) {

    return;

  }


  if (listening) {

    recognition.stop();

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    log(
      "เริ่มรับเสียงไม่ได้",
      error.message
    );

  }

}



/* =====================================================
   หยุดฟัง
   ===================================================== */

function stopListening() {

  listening =
    false;


  micButton
    .classList
    .remove(
      "listening"
    );

}



micButton.addEventListener(
  "click",
  startListening
);



/* =====================================================
   ส่งคำถาม Gemini
   JSONP
   ===================================================== */

function askAI(question) {

  question =
    String(
      question || ""
    ).trim();


  if (!question) {

    status.innerText =
      "กรุณาพิมพ์คำถามก่อนครับ";

    return;

  }


  log(
    "ส่งคำถามไป Gemini",
    question
  );


  status.innerText =
    "🤖 Gemini กำลังวิเคราะห์...";


  answerBox.innerText =
    "กำลังอ่านข้อมูลจากสวน...";


  const callbackName =
    "aiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      "script"
    );


  let completed =
    false;


  const timeout =
    setTimeout(
      function () {

        if (completed) {

          return;

        }


        completed =
          true;


        cleanup();


        status.innerText =
          "❌ Gemini ตอบช้าเกินไป";


        answerBox.innerText =
          "ระบบ AI ใช้เวลานานเกินกำหนดครับ";

      },
      60000
    );



  function cleanup() {

    clearTimeout(
      timeout
    );


    if (
      script.parentNode
    ) {

      script
        .parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {}

  }



  window[callbackName] =
    function (result) {

      if (completed) {

        return;

      }


      completed =
        true;


      cleanup();


      log(
        "Gemini ส่งคำตอบกลับแล้ว",
        result
      );


      if (
        !result ||
        result.error
      ) {

        status.innerText =
          "❌ Gemini เกิดข้อผิดพลาด";


        answerBox.innerText =
          result &&
          result.error
            ? result.error
            : "Gemini ไม่ได้ส่งคำตอบกลับครับ";


        return;

      }



      const answer =
        String(
          result.answer ||
          ""
        ).trim();



      if (!answer) {

        status.innerText =
          "❌ Gemini ไม่ได้ส่งข้อความตอบกลับ";


        answerBox.innerText =
          "AI ไม่ได้ส่งคำตอบกลับมาครับ";


        return;

      }



      /* ===============================================
         แสดงคำตอบ Gemini
         =============================================== */

      answerBox.innerText =
        answer;


      log(
        "คำตอบที่จะส่งเข้า VOICEVOX",
        answer
      );



      /* ===============================================
         สำคัญ:
         ส่งคำตอบ Gemini เข้า VOICEVOX
         =============================================== */

      speak(
        answer
      );

    };



  const url =
    APPS_SCRIPT_URL +
    "?question=" +
    encodeURIComponent(
      question
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;



  script.onerror =
    function () {

      if (completed) {

        return;

      }


      completed =
        true;


      cleanup();


      log(
        "เชื่อมต่อ Google Apps Script ไม่สำเร็จ"
      );


      status.innerText =
        "❌ เชื่อมต่อ AI ไม่สำเร็จ";


      answerBox.innerText =
        "ไม่สามารถเชื่อมต่อระบบ AI ได้ครับ";

    };


  document.body.appendChild(
    script
  );

}



/* =====================================================
   ตรวจ VOICEVOX
   ===================================================== */

async function checkVoicevox() {

  log(
    "เริ่มตรวจสอบ VOICEVOX"
  );


  log(
    "กำลังตรวจ",
    VOICEVOX_URL
  );


  const versionResponse =
    await fetch(
      VOICEVOX_URL +
      "/version",
      {
        method:
          "GET",

        cache:
          "no-store"
      }
    );


  log(
    "VOICEVOX /version ตอบกลับ",
    {
      status:
        versionResponse.status,

      ok:
        versionResponse.ok
    }
  );


  if (
    !versionResponse.ok
  ) {

    throw new Error(
      "VOICEVOX /version HTTP " +
      versionResponse.status
    );

  }


  const version =
    await versionResponse.text();


  log(
    "VOICEVOX version",
    version
  );


  return version;

}



/* =====================================================
   ตรวจ Speaker
   ===================================================== */

async function checkSpeaker() {

  log(
    "กำลังตรวจ Speaker ID",
    SPEAKER_ID
  );


  const response =
    await fetch(
      VOICEVOX_URL +
      "/speakers",
      {
        method:
          "GET",

        cache:
          "no-store"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "VOICEVOX /speakers HTTP " +
      response.status
    );

  }


  const speakers =
    await response.json();


  let found =
    null;


  for (
    const speaker of speakers
  ) {

    for (
      const style of
      (
        speaker.styles ||
        []
      )
    ) {

      if (
        Number(
          style.id
        ) ===
        Number(
          SPEAKER_ID
        )
      ) {

        found = {

          name:
            speaker.name,

          style:
            style.name,

          id:
            style.id

        };

      }

    }

  }


  if (!found) {

    throw new Error(
      "ไม่พบ Speaker ID " +
      SPEAKER_ID
    );

  }


  log(
    "พบ Speaker",
    found
  );


  return found;

}



/* =====================================================
   สร้างเสียง VOICEVOX
   ===================================================== */

async function speak(text) {

  text =
    String(
      text || ""
    ).trim();


  if (!text) {

    log(
      "ไม่มีข้อความสำหรับสร้างเสียง"
    );

    return;

  }



  status.innerText =
    "🎙️ กำลังเตรียมเสียง...";


  log(
    "เริ่มสร้างเสียง",
    {
      speaker:
        SPEAKER_ID,

      text:
        text
    }
  );



  try {

    /* ===============================================
       1. ตรวจ VOICEVOX
       =============================================== */

    await checkVoicevox();


    /* ===============================================
       2. ตรวจ Speaker
       =============================================== */

    await checkSpeaker();


    status.innerText =
      "🎙️ กำลังสร้างเสียงตอบ...";



    /* ===============================================
       3. audio_query
       =============================================== */

    log(
      "กำลังสร้าง audio_query"
    );


    const queryResponse =
      await fetch(
        VOICEVOX_URL +
        "/audio_query?speaker=" +
        SPEAKER_ID +
        "&text=" +
        encodeURIComponent(
          text
        ),
        {
          method:
            "POST",

          cache:
            "no-store"
        }
      );


    log(
      "audio_query response",
      {
        status:
          queryResponse.status,

        ok:
          queryResponse.ok
      }
    );


    if (
      !queryResponse.ok
    ) {

      const errorText =
        await queryResponse.text();


      throw new Error(
        "audio_query HTTP " +
        queryResponse.status +
        ": " +
        errorText
      );

    }


    const query =
      await queryResponse.json();



    /* ===============================================
       4. ปรับเสียง
       =============================================== */

    query.speedScale =
      1.0;


    query.pitchScale =
      0.02;


    query.intonationScale =
      1.08;


    query.volumeScale =
      1.0;



    /* ===============================================
       5. Synthesis
       =============================================== */

    log(
      "กำลังสร้างไฟล์เสียง WAV"
    );


    const synthesisResponse =
      await fetch(
        VOICEVOX_URL +
        "/synthesis?speaker=" +
        SPEAKER_ID,
        {
          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Accept":
              "audio/wav"

          },

          body:
            JSON.stringify(
              query
            )
        }
      );


    log(
      "synthesis response",
      {
        status:
          synthesisResponse.status,

        ok:
          synthesisResponse.ok
      }
    );


    if (
      !synthesisResponse.ok
    ) {

      const errorText =
        await synthesisResponse.text();


      throw new Error(
        "synthesis HTTP " +
        synthesisResponse.status +
        ": " +
        errorText
      );

    }



    /* ===============================================
       6. รับ WAV
       =============================================== */

    const audioBlob =
      await synthesisResponse.blob();


    log(
      "ได้รับไฟล์เสียง",
      {
        size:
          audioBlob.size,

        type:
          audioBlob.type
      }
    );


    if (
      !audioBlob ||
      audioBlob.size === 0
    ) {

      throw new Error(
        "VOICEVOX ส่งไฟล์เสียงว่างกลับมา"
      );

    }



    /* ===============================================
       7. สร้าง URL
       =============================================== */

    if (
      currentAudioUrl
    ) {

      URL.revokeObjectURL(
        currentAudioUrl
      );

    }


    currentAudioUrl =
      URL.createObjectURL(
        audioBlob
      );



    /* ===============================================
       8. ใช้ HTML AUDIO
       เป็นตัวเล่นหลัก
       =============================================== */

    audioPlayer.src =
      currentAudioUrl;


    audioPlayer.volume =
      1.0;


    audioPlayer.muted =
      false;


    audioPlayer.style.display =
      "block";


    audioPlayer.load();



    status.innerText =
      "🔊 VOICEVOX กำลังพูด...";


    log(
      "เริ่มเล่นเสียง"
    );



    /* ===============================================
       9. เล่นเสียง
       =============================================== */

    try {

      await audioPlayer.play();


      log(
        "audio.play() สำเร็จ",
        {
          paused:
            audioPlayer.paused,

          volume:
            audioPlayer.volume,

          muted:
            audioPlayer.muted
        }
      );

    }

    catch (playError) {

      log(
        "audio.play() ถูกบล็อก",
        playError.message
      );


      status.innerText =
        "🔊 กดปุ่ม ▶ ในตัวเล่นเสียงเพื่อฟังคำตอบ";


      return;

    }



    audioPlayer.onended =
      function () {

        status.innerText =
          "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";


        log(
          "เล่นเสียงเสร็จแล้ว"
        );

      };



    audioPlayer.onerror =
      function () {

        log(
          "HTML Audio ERROR",
          audioPlayer.error
        );


        status.innerText =
          "❌ เบราว์เซอร์เปิดไฟล์เสียงไม่ได้";

      };

  }


  catch (error) {

    console.error(
      "VOICEVOX ERROR:",
      error
    );


    const message =
      error &&
      error.message
        ? error.message
        : String(
            error
          );


    log(
      "VOICEVOX ERROR",
      message
    );


    status.innerText =
      "❌ VOICEVOX ERROR";


    answerBox.innerText =
      answerBox.innerText +
      "\n\n[VOICEVOX ERROR]\n" +
      message;

  }

}



/* =====================================================
   ทดสอบ VOICEVOX
   ===================================================== */

testVoiceButton.addEventListener(
  "click",
  async function () {

    status.innerText =
      "🔊 กำลังทดสอบเสียง...";


    const testText =
      "สวัสดีครับ ระบบ Cucumber AI พร้อมทำงานแล้วครับ";


    await speak(
      testText
    );

  }
);



/* =====================================================
   ปุ่มส่งคำถาม
   ===================================================== */

sendButton.addEventListener(
  "click",
  function () {

    askAI(
      questionInput.value
    );

  }
);



/* =====================================================
   Enter เพื่อส่งคำถาม
   ===================================================== */

questionInput.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();


      askAI(
        this.value
      );

    }

  }
);



/* =====================================================
   เริ่มระบบ
   ===================================================== */

log(
  "Cucumber AI พร้อมทำงาน"
);


status.innerText =
  "ระบบพร้อมทำงาน";


</script>


</body>

</html>
:::

let thaiVoice =

function findThaiVoice(
  voices
) {

  let voice =
    voices.find(
      function(v) {

        return (
          v.lang &&
          v.lang
            .toLowerCase() ===
            "th-th"
        );

      }
    );


  if (voice) {

    return voice;

  voice =
    voices.find(
      function(v) {

        return (
          v.lang &&
          v.lang
            .toLowerCase()
            .startsWith("th")
        );

    );


  if (voice) {

    return voice;

  }


  voice =
    voices.find(
      function(v) {

        const text =
          (
            v.name +
            " " +
            v.lang
          )
            .toLowerCase();

        return (
          text.includes("thai") ||
          text.includes("ไทย")
        );

      }
    );


  return voice || null;

}

/* =====================================================
   DETECT LANGUAGE

   FIX #4

   แยก kana (ญี่ปุ่นแท้)
   ออกจาก CJK (จีน/kanji)

   - ถ้ามี kana → ja
   - ถ้ามีแต่ kanji/CJK ไม่มี kana
     และไม่มีไทย → zh (ภาษาจีน)
   - ภาษาจีนจะ fallback เป็น Browser TTS
     (ไม่ส่งเข้า VOICEVOX)
   ===================================================== */

function detectLanguage(
  text
) {

  const value =
    String(
      text || ""
    ).trim();


  if (!value) {

    return "unknown";

  }


  const kanaMatches =
    value.match(
      /[\u3040-\u30ff]/g
    );


  const cjkMatches =
    value.match(
      /[\u3400-\u4dbf\u4e00-\u9fff]/g
    );


  const thaiMatches =
    value.match(
      /[\u0E00-\u0E7F]/g
    );


  const englishMatches =
    value.match(
      /[A-Za-z]/g
    );


  const kanaCount =
    kanaMatches
      ? kanaMatches.length
      : 0;


  const cjkCount =
    cjkMatches
      ? cjkMatches.length
      : 0;


  const japaneseCount =
    kanaCount + cjkCount;


  const thaiCount =
    thaiMatches
      ? thaiMatches.length
      : 0;


  const englishCount =
    englishMatches
      ? englishMatches.length
      : 0;


  log(
    "ตรวจภาษา",
    {
      thai:
        thaiCount,
      japanese:
        japaneseCount,
      kana:
        kanaCount,
      chinese:
        cjkCount,
      english:
        englishCount
    }
  );


  /*
     มี kana = ญี่ปุ่นแน่นอน
  */

  if (
    kanaCount > 0 &&
    kanaCount >= thaiCount
  ) {

    return "ja";

  }


  /*
     มีแต่ CJK ไม่มี kana
     = ภาษาจีน (ไม่ใช่ญี่ปุ่น)
  */

  if (
    cjkCount > 0 &&
    kanaCount === 0 &&
    cjkCount > thaiCount &&
    cjkCount >= englishCount
  ) {

    return "zh";

  }


  /*
     มี kana + CJK ผสม
     และ CJK เยอะกว่าไทย
     = ญี่ปุ่น
  */

  if (
    japaneseCount >
      thaiCount &&
    japaneseCount >
      englishCount
  ) {

    return "ja";

  }


  if (
    thaiCount >=
      japaneseCount &&
    thaiCount >=
      englishCount
  ) {

    return "th";

  }


  if (
    englishCount > 0
  ) {

    return "en";

  }


  return "th";

}


/* =====================================================
   SPLIT TEXT FOR GOOGLE TTS

   FIX #5

   ไม่ใช้ lookbehind regex
   (Safari เก่า parse ไม่ได้)
   เขียน split ประโยคแบบ loop แทน
   ===================================================== */

function splitSentences(
  clean
) {

  const result =
    [];


  let current =
    "";


  for (
    let i = 0;
    i < clean.length;
    i++
  ) {

    const ch =
      clean[i];


    current += ch;


    if (
      ".!?。！？".indexOf(ch) !==
      -1
    ) {

      result.push(
        current.trim()
      );


      current =
        "";

    }

  }


  if (
    current.trim()
  ) {

    result.push(
      current.trim()
    );

  }


  return result.filter(
    function(s) {

      return s.length > 0;

    }
  );

}


function splitText(
  text,
  maxLength = 180
) {

  const clean =
    String(
      text || ""
    )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if (
    clean.length <=
    maxLength
  ) {

    return [
      clean
    ];

  }


  const result =
    [];


  let current =
    "";


  const sentences =
    splitSentences(
      clean
    );


  for (
    const sentence
    of sentences
  ) {

    if (
      (
        current +
        " " +
        sentence
      ).trim().length <=
      maxLength
    ) {

      current =
        (
          current +
          " " +
          sentence
        ).trim();

    }

    else {

      if (current) {

        result.push(
          current
        );

      }


      if (
        sentence.length >
        maxLength
      ) {

        let start =
          0;


        while (
          start <
          sentence.length
        ) {

          result.push(
            sentence.substring(
              start,
              start +
                maxLength
            )
          );


          start +=
            maxLength;

        }


        current =
          "";

      }

      else {

        current =
          sentence;

      }

    }

  }


  if (current) {

    result.push(
      current
    );

  }


  return result;

}


/* =====================================================
   BROWSER TTS

   FIX #6

   Chrome บางกรณี onend ไม่ fire

function speakBrowser(
  text,
  language
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      if (
        !("speechSynthesis" in window)
      ) {

        reject(
          new Error(
            "Browser ไม่รองรับ Speech Synthesis"
          )
        );

        return;

      }


      if (
        !text ||
        !text.trim()
      ) {

        resolve();

        return;

      }


      window.speechSynthesis.cancel();


      loadBrowserVoices();


      if (
        language === "th" &&
        !thaiVoice
      ) {

        reject(
          new Error(
            "ไม่พบ Thai Voice ใน Browser"
          )
        );

        return;

      }


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      if (
        language === "th"
      ) {

        utterance.lang =
          "th-TH";

        utterance.voice =
          thaiVoice;

      }

      else {

        utterance.lang =
          "en-US";


        if (
          englishVoice
        ) {

          utterance.voice =
            englishVoice;

        }

      }


      utterance.rate =
        0.95;

      utterance.pitch =
        1.0;

      utterance.volume =
        1.0;


      let finished =
        false;


      let safetyTimer =
        null;


      function finish() {

        if (finished) {

          return;

        }


        finished =
          true;


        if (safetyTimer) {

          clearTimeout(
            safetyTimer
          );

        }


        statusElement.innerText =
          "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";


        resolve();

      }


      utterance.onstart =
        function() {

          log(
            "Browser TTS เริ่มพูด",
            {
              language:
                language
            }
          );


          statusElement.innerText =
            language === "th"
              ? "🔊 กำลังพูดภาษาไทย..."
              : "🔊 กำลังพูดภาษาอังกฤษ...";

        };


      utterance.onend =
        function() {

          log(
            "Browser TTS พูดเสร็จแล้ว"
          );


          finish();

        };


      utterance.onerror =
        function(event) {

          log(
            "Browser TTS ERROR",
            event.error
          );


          if (finished) {

            return;

          }


          finished =
            true;


          if (safetyTimer) {

            clearTimeout(
              safetyTimer
            );

          }


          reject(
            new Error(
              "Browser TTS: " +
              event.error
            )
          );

        };


      /*
         Safety timeout:

         ถ้า onend/onerror ไม่ยิง
         (Chrome bug กับประโยคยาว)
         ให้ resolve เอง
      */

      safetyTimer =
        setTimeout(
          function() {

            log(
              "Browser TTS safety timeout"
            );


            window.speechSynthesis.cancel();


            finish();

          },
          text.length *
            BROWSER_TTS_SAFETY_MS_PER_CHAR +
            5000
        );


      try {

        window.speechSynthesis
          .speak(
            utterance
          );

      }

      catch (error) {

        if (safetyTimer) {

          clearTimeout(
            safetyTimer
          );

        }


        reject(
          error
        );

      }

    }
  );

}


/* =====================================================
   GOOGLE THAI TTS

   FIX #2

   รอ canplay ก่อนแล้วค่อย play()
   ไม่เรียก play() ทันทีหลัง load()
   ลด AbortError / Format error
   ===================================================== */

function speakGoogleThaiChunk(
  text,
  index,
  total
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      log(
        "สร้าง Google Thai TTS",
        {
          part:
            index +
            "/" +
            total,
          length:
            text.length
        }
      );


      statusElement.innerText =
        "🔊 กำลังสร้างเสียงไทย " +
        index +
        "/" +
        total +
        "...";


      const params =
        new URLSearchParams();


      params.set(
        "ie",
        "UTF-8"
      );


      params.set(
        "client",
        "tw-ob"
      );


      params.set(
        "tl",
        "th"
      );


      params.set(
        "q",
        text
      );


      const url =
        GOOGLE_TTS_URL +
        "?" +
        params.toString();


      const audio =
        new Audio();


      audio.preload =
        "auto";

      audio.volume =
        1.0;


      let finished =
        false;


      let playStarted =
        false;


      let loadTimer =
        null;


      function cleanup() {

        audio.onended =
          null;

        audio.onerror =
          null;

        audio.oncanplay =
          null;

        audio.onloadeddata =
          null;


        if (loadTimer) {

          clearTimeout(
            loadTimer
          );

        }

      }


      function fail(
        message
      ) {

        if (finished) {

          return;

        }


        finished =
          true;


        cleanup();


        try {

          audio.pause();

          audio.removeAttribute(
            "src"
          );

          audio.load();

        }

        catch {}


        log(
          "Google Thai TTS ERROR",
          {
            part:
              index +
              "/" +
              total,
            error:
              message
          }
        );


        reject(
          new Error(
            message
          )
        );

      }


      function succeed() {

        if (finished) {

          return;

        }


        finished =
          true;


        cleanup();


        log(
          "Google TTS เล่นเสร็จ",
          {
            part:
              index +
              "/" +
              total
          }
        );


        resolve();

      }


      audio.oncanplay =
        function() {

          log(
            "Google TTS โหลดเสียงสำเร็จ",
            {
              part:
                index +
                "/" +
                total
            }
          );


          if (
            finished ||
            playStarted
          ) {

            return;

          }


          playStarted =
            true;


          audio.play()
            .then(
              function() {

                log(
                  "Google TTS เริ่มเล่น",
                  {
                    part:
                      index +
                      "/" +
                      total
                  }
                );


                statusElement.innerText =
                  "🔊 กำลังพูดภาษาไทย " +
                  index +
                  "/" +
                  total +
                  "...";

              }
            )
            .catch(
              function(error) {

                fail(
                  "audio.play() ไม่สำเร็จ: " +
                  error.message
                );

              }
            );

        };


      audio.onended =
        function() {

          succeed();

        };


      audio.onerror =
        function() {

          let message =
            "HTML Audio error";


          if (
            audio.error
          ) {

            message +=
              " | code=" +
              audio.error.code;


            if (
              audio.error.message
            ) {

              message +=
                " | " +
                audio.error.message;

            }

          }


          fail(
            message
          );

        };


      /*
         Load timeout:

         ถ้า 10 วินาที
         ยังเล่นไม่ได้ = fail
      */

      loadTimer =
        setTimeout(
          function() {

            fail(
              "โหลด Google TTS ช้าเกินไป (timeout)"
            );

          },
          10000
        );


      audio.src =
        url;


      log(
        "กำลังโหลด Google Thai TTS"
      );


      audio.load();

    }
  );

}


async function speakGoogleThai(
  text
) {

  const chunks =
    splitText(
      text,
      180
    );


  if (
    !chunks.length
  ) {

    return;

  }


  log(
    "เริ่ม Google Thai TTS",
    {
      chunks:
        chunks.length
    }
  );


  for (
    let i = 0;
    i < chunks.length;
    i++
  ) {

    await speakGoogleThaiChunk(
      chunks[i],
      i + 1,
      chunks.length
    );

  }


  statusElement.innerText =
    "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";


  log(
    "Google Thai TTS พูดเสร็จแล้ว"
  );

}


/* =====================================================
   VOICEVOX

   FIX #3

   เพิ่มการตรวจ CORS/network error
   และบอกวิธีแก้ชัดเจน
   (ต้องรัน engine แบบ --cors_allow_all)
   ===================================================== */

async function speakVoicevox(
  text
) {

  statusElement.innerText =
    "🎙️ กำลังสร้างเสียง VOICEVOX...";


  log(
    "เริ่มสร้างเสียง VOICEVOX",
    {
      speaker:
        VOICEVOX_SPEAKER_ID,
      text:
        text
    }
  );


  let versionResponse;


  try {

    versionResponse =
      await fetch(
        VOICEVOX_URL +
        "/version",
        {
          method:
            "GET"
        }
      );

  }

  catch (networkError) {

    throw new Error(
      "เชื่อมต่อ VOICEVOX ไม่ได้\n\n" +
      "ตรวจสอบ:\n" +
      "1. เปิด VOICEVOX Engine แล้วหรือยัง\n" +
      "2. รันแบบเปิด CORS:\n" +
      "   voicevox_engine.exe --cors_allow_all\n" +
      "\nรายละเอียด: " +
      networkError.message
    );

  }


  log(
    "VOICEVOX /version",
    {
      status:
        versionResponse.status,
      ok:
        versionResponse.ok
    }
  );


  if (
    !versionResponse.ok
  ) {

    throw new Error(
      "VOICEVOX /version HTTP " +
      versionResponse.status
    );

  }


  const version =
    await versionResponse.text();


  log(
    "VOICEVOX version",
    version
  );


  const speakersResponse =
    await fetch(
      VOICEVOX_URL +
      "/speakers"
    );


  if (
    !speakersResponse.ok
  ) {

    throw new Error(
      "VOICEVOX /speakers HTTP " +
      speakersResponse.status
    );

  }


  const speakers =
    await speakersResponse.json();


  let speakerFound =
    null;


  for (
    const speaker
    of speakers
  ) {

    if (
      !speaker.styles
    ) {

      continue;

    }


    for (
      const style
      of speaker.styles
    ) {

      if (
        style.id ===
        VOICEVOX_SPEAKER_ID
      ) {

        speakerFound = {

          name:
            speaker.name,

          style:
            style.name,

          id:
            style.id

        };

      }

    }

  }


  if (
    !speakerFound
  ) {

    throw new Error(
      "ไม่พบ VOICEVOX Speaker ID " +
      VOICEVOX_SPEAKER_ID
    );

  }


  log(
    "พบ Speaker",
    speakerFound
  );


  const queryResponse =
    await fetch(
      VOICEVOX_URL +
      "/audio_query?speaker=" +
      VOICEVOX_SPEAKER_ID +
      "&text=" +
      encodeURIComponent(
        text
      ),
      {
        method:
          "POST"
      }
    );


  log(
    "audio_query response",
    {
      status:
        queryResponse.status,
      ok:
        queryResponse.ok
    }
  );


  if (
    !queryResponse.ok
  ) {

    const errorText =
      await queryResponse.text();


    throw new Error(
      "VOICEVOX audio_query HTTP " +
      queryResponse.status +
      ": " +
      errorText
    );

  }


  const query =
    await queryResponse.json();


  query.speedScale =
    1.0;

  query.pitchScale =
    0.02;

  query.intonationScale =
    1.08;

  query.volumeScale =
    1.0;


  log(
    "กำลังสร้างไฟล์เสียง WAV"
  );


  const synthesisResponse =
    await fetch(
      VOICEVOX_URL +
      "/synthesis?speaker=" +
      VOICEVOX_SPEAKER_ID,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json",

          "Accept":
            "audio/wav"

        },

        body:
          JSON.stringify(
            query
          )

      }
    );


  log(
    "synthesis response",
    {
      status:
        synthesisResponse.status,
      ok:
        synthesisResponse.ok
    }
  );


  if (
    !synthesisResponse.ok
  ) {

    const errorText =
      await synthesisResponse.text();


    throw new Error(
      "VOICEVOX synthesis HTTP " +
      synthesisResponse.status +
      ": " +
      errorText
    );

  }


  const audioBlob =
    await synthesisResponse.blob();


  log(
    "ได้รับไฟล์เสียง VOICEVOX",
    {
      size:
        audioBlob.size,
      type:
        audioBlob.type
    }
  );


  if (
    !audioBlob ||
    audioBlob.size === 0
  ) {

    throw new Error(
      "VOICEVOX ส่งไฟล์เสียงว่าง"
    );

  }


  const audioUrl =
    URL.createObjectURL(
      audioBlob
    );


  const audio =
    new Audio(
      audioUrl
    );


  audio.volume =
    1.0;


  return new Promise(
    function(
      resolve,
      reject
    ) {

      audio.onplay =
        function() {

          log(
            "VOICEVOX เริ่มเล่นเสียง"
          );


          statusElement.innerText =
            "🔊 ずんだもん กำลังพูด...";

        };


      audio.onended =
        function() {

          log(
            "VOICEVOX พูดเสร็จแล้ว"
          );


          URL.revokeObjectURL(
            audioUrl
          );


          statusElement.innerText =
            "พร้อมครับ กดไมค์เพื่อถามอีกครั้ง";


          resolve();

        };


      audio.onerror =
        function() {

          URL.revokeObjectURL(
            audioUrl
          );


          log(
            "VOICEVOX audio ERROR"
          );


          reject(
            new Error(
              "เปิดไฟล์เสียง VOICEVOX ไม่ได้"
            )
          );

        };


      audio.play()
        .then(
          function() {

            log(
              "VOICEVOX audio.play() สำเร็จ",
              {
                paused:
                  audio.paused,
                volume:
                  audio.volume,
                muted:
                  audio.muted
              }
            );

          }
        )
        .catch(
          function(error) {

            URL.revokeObjectURL(
              audioUrl
            );


            log(
              "VOICEVOX audio.play() ERROR",
              error.message
            );


            reject(
              error
            );

          }
        );

    }
  );

}

async function speak(
  text
) {

  if (
    !text ||
    !text.trim()
  ) {

    return;

  }


  unlockAudio();


  const language =
    detectLanguage(
      text
    );


  log(
    "เลือกระบบเสียง",
    {
      language:
        language
    }
  );


  try {

    /*
       🇹🇭 THAI
    */

    if (
      language === "th"
    ) {

      loadBrowserVoices();


      if (
        thaiVoice
      ) {

        log(
          "พบ Thai Voice → ใช้ Browser TTS"
        );


        await speakBrowser(
          text,
          "th"
        );


        return;

      }


      log(
        "ไม่พบ Thai Voice → ใช้ Google Thai TTS"
      );


      try {

        await speakGoogleThai(
          text
        );


        return;

      }

      catch (
        googleError
      ) {

        log(
          "Google Thai TTS ERROR",
          googleError.message
        );


        throw new Error(
          "❌ ไม่สามารถพูดภาษาไทยได้\n\n" +
          "ไม่พบ Thai Voice ใน Browser และ Google Thai TTS ก็เล่นเสียงไม่ได้\n\n" +
          "สาเหตุล่าสุด:\n" +
          googleError.message
        );

      }

    }


    /*
       🇯🇵 JAPANESE
    */

    if (
      language === "ja"
    ) {

      log(
        "ภาษาญี่ปุ่น → VOICEVOX ID 7"
      );


      await speakVoicevox(
        text
      );


      return;

    }


    /*
       🇨🇳 CHINESE

       FIX #8

       VOICEVOX พูดจีนไม่ได้
       ใช้ Browser TTS แทน
    */

    if (
      language === "zh"
    ) {

      log(
        "ภาษาจีน → Browser TTS"
      );


      await speakBrowser(
        text,
        "zh"
      );


      return;

    }


    /*
       🇺🇸 ENGLISH
    */

    if (
      language === "en"
    ) {

      log(
        "ภาษาอังกฤษ → Browser TTS"
      );


      await speakBrowser(
        text,
        "en"
      );


      return;

    }


    /*
       UNKNOWN
    */

    log(
      "ไม่ทราบภาษา → ใช้ Browser Thai"
    );


    await speakBrowser(
      text,
      "th"
    );

  }

  catch (error) {

    log(
      "ระบบเสียง ERROR",
      {
        message:
          error.message
      }
    );


    statusElement.innerText =
      "❌ ระบบเสียงมีปัญหา";


    answerElement.innerText =
      answerElement.innerText +
      "\n\n[VOICE ERROR]\n" +
      error.message;

  }

}
